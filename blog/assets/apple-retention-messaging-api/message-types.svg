<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d" font-family="Manrope, Helvetica, Arial, sans-serif"><title id="t">The four message types</title><desc id="d">Apple supports text-only, text with image, switch-plan and promotional-offer messages. Only text messages can be defaults.</desc><rect width="1600" height="900" fill="#FFFFFF"/><rect x="80" y="56" width="64" height="10" fill="#F7B500"/><text x="80" y="128" font-size="44" font-weight="800" fill="#0A0A0A" text-anchor="start">Apple supports four message types</text><text x="80" y="176" font-size="26" font-weight="500" fill="#525252" text-anchor="start">Only the first two can be default messages.</text><rect x="80" y="270" width="330" height="330" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2"/><text x="96" y="379" font-size="28" font-weight="800" fill="#0A0A0A" text-anchor="start">Text</text><text x="96" y="417" font-size="12" font-weight="500" fill="#525252" text-anchor="start"></text><text x="96" y="433" font-size="24" font-weight="500" fill="#525252" text-anchor="start">Header, body and</text><text x="96" y="466" font-size="24" font-weight="500" fill="#525252" text-anchor="start">optional bullet points</text><text x="96" y="498" font-size="12" font-weight="500" fill="#525252" text-anchor="start"></text><text x="96" y="514" font-size="24" font-weight="800" fill="#0A0A0A" text-anchor="start">Can be default</text><rect x="450" y="270" width="330" height="330" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2"/><text x="466" y="379" font-size="28" font-weight="800" fill="#0A0A0A" text-anchor="start">Text and image</text><text x="466" y="417" font-size="12" font-weight="500" fill="#525252" text-anchor="start"></text><text x="466" y="433" font-size="24" font-weight="500" fill="#525252" text-anchor="start">The same, with an</text><text x="466" y="466" font-size="24" font-weight="500" fill="#525252" text-anchor="start">image from you</text><text x="466" y="498" font-size="12" font-weight="500" fill="#525252" text-anchor="start"></text><text x="466" y="514" font-size="24" font-weight="800" fill="#0A0A0A" text-anchor="start">Can be default</text><rect x="820" y="270" width="330" height="330" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2"/><text x="836" y="379" font-size="28" font-weight="800" fill="#0A0A0A" text-anchor="start">Switch plan</text><text x="836" y="417" font-size="12" font-weight="500" fill="#525252" text-anchor="start"></text><text x="836" y="433" font-size="24" font-weight="500" fill="#525252" text-anchor="start">Suggests another plan</text><text x="836" y="466" font-size="24" font-weight="500" fill="#525252" text-anchor="start">in the same group</text><text x="836" y="498" font-size="12" font-weight="500" fill="#525252" text-anchor="start"></text><text x="836" y="514" font-size="24" font-weight="800" fill="#0A0A0A" text-anchor="start">Needs real-time URL</text><rect x="1190" y="270" width="330" height="330" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2"/><text x="1206" y="379" font-size="28" font-weight="800" fill="#0A0A0A" text-anchor="start">Promotional offer</text><text x="1206" y="417" font-size="12" font-weight="500" fill="#525252" text-anchor="start"></text><text x="1206" y="433" font-size="24" font-weight="500" fill="#525252" text-anchor="start">Offers a discounted</text><text x="1206" y="466" font-size="24" font-weight="500" fill="#525252" text-anchor="start">price you signed</text><text x="1206" y="498" font-size="12" font-weight="500" fill="#525252" text-anchor="start"></text><text x="1206" y="514" font-size="24" font-weight="800" fill="#0A0A0A" text-anchor="start">Needs real-time URL</text><text x="80" y="680" font-size="26" font-weight="500" fill="#525252" text-anchor="start">Switch-plan and offer messages are chosen per customer, so they need your real-time URL.</text><line x1="80" y1="846" x2="1520" y2="846" stroke="#E5E5E5" stroke-width="2"/><text x="80" y="880" font-size="22" font-weight="500" fill="#525252" text-anchor="start">Source: developer.apple.com/documentation/retentionmessaging/setting-up-retention-messages</text></svg>