<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d" font-family="Manrope, Helvetica, Arial, sans-serif"><title id="t">What Apple does when a customer taps Cancel</title><desc id="d">The customer taps Cancel Subscription, Apple calls your server within 700 milliseconds, your server picks a message, and Apple shows it.</desc><rect width="1600" height="900" fill="#FFFFFF"/><rect x="80" y="56" width="64" height="10" fill="#F7B500"/><text x="80" y="150" font-size="60" font-weight="800" fill="#0A0A0A" text-anchor="start">Apple asks your server what to show</text><text x="80" y="205" font-size="30" font-weight="500" fill="#525252" text-anchor="start">You have 700 ms to answer. If you are late, Apple shows your default message.</text><rect x="80" y="290" width="300" height="190" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2"/><text x="96" y="362" font-size="30" font-weight="800" fill="#0A0A0A" text-anchor="start">Customer</text><text x="96" y="403" font-size="24" font-weight="500" fill="#525252" text-anchor="start">Taps Cancel</text><text x="96" y="435" font-size="24" font-weight="500" fill="#525252" text-anchor="start">Subscription</text><line x1="390" y1="385" x2="436" y2="385" stroke="#0A0A0A" stroke-width="3"/><polygon points="450,385 432,375 432,395" fill="#0A0A0A"/><rect x="460" y="290" width="300" height="190" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2"/><text x="476" y="362" font-size="30" font-weight="800" fill="#0A0A0A" text-anchor="start">Apple</text><text x="476" y="403" font-size="24" font-weight="500" fill="#525252" text-anchor="start">Calls your URL</text><text x="476" y="435" font-size="24" font-weight="500" fill="#525252" text-anchor="start">with a signed call</text><line x1="770" y1="385" x2="816" y2="385" stroke="#0A0A0A" stroke-width="3"/><polygon points="830,385 812,375 812,395" fill="#0A0A0A"/><rect x="840" y="290" width="300" height="190" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="4"/><text x="856" y="362" font-size="30" font-weight="800" fill="#0A0A0A" text-anchor="start">Your server</text><text x="856" y="403" font-size="24" font-weight="500" fill="#525252" text-anchor="start">Picks a message</text><text x="856" y="435" font-size="24" font-weight="500" fill="#525252" text-anchor="start">within 700 ms</text><line x1="1150" y1="385" x2="1196" y2="385" stroke="#0A0A0A" stroke-width="3"/><polygon points="1210,385 1192,375 1192,395" fill="#0A0A0A"/><rect x="1220" y="290" width="300" height="190" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2"/><text x="1236" y="362" font-size="30" font-weight="800" fill="#0A0A0A" text-anchor="start">Confirm screen</text><text x="1236" y="403" font-size="24" font-weight="500" fill="#525252" text-anchor="start">Message or offer,</text><text x="1236" y="435" font-size="24" font-weight="500" fill="#525252" text-anchor="start">or the default</text><rect x="80" y="560" width="1440" height="200" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"/><text x="96" y="635" font-size="30" font-weight="800" fill="#0A0A0A" text-anchor="start">Apple reviews every message before it can show</text><text x="96" y="675" font-size="26" font-weight="500" fill="#525252" text-anchor="start">Your developer account also needs Apple's approval for the API.</text><text x="96" y="710" font-size="26" font-weight="500" fill="#525252" text-anchor="start">The API is described as a pre-release in Apple's documentation.</text><line x1="80" y1="846" x2="1520" y2="846" stroke="#E5E5E5" stroke-width="2"/><text x="80" y="880" font-size="22" font-weight="500" fill="#525252" text-anchor="start">Source: developer.apple.com/documentation/retentionmessaging</text></svg>