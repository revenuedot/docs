<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" width="1600" height="720" role="img" aria-labelledby="t d"><title id="t">Monthly cost at $50,000 of tracked revenue</title><desc id="d">RevenueCat 500 dollars; RevenueDot Cloud Pro 200 dollars; self-hosting on one 12 dollar server about 12 dollars; with managed Postgres about 27 dollars.</desc><rect width="1600" height="720" fill="#FFFFFF"/><text x="100" y="90" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#0A0A0A" text-anchor="start">Monthly cost at $50,000 of tracked revenue</text><text x="100" y="170" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#0A0A0A" text-anchor="start">RevenueCat, 1% of all tracked revenue</text><rect x="100" y="186" width="900.0" height="50" fill="#0A0A0A" stroke="#0A0A0A" stroke-width="3"/><text x="1016.0" y="224" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#0A0A0A" text-anchor="start">$500</text><text x="100" y="292" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#0A0A0A" text-anchor="start">RevenueDot Cloud Pro, 0.5% above $10K</text><rect x="100" y="308" width="360.0" height="50" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="3"/><text x="476.0" y="346" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#0A0A0A" text-anchor="start">$200</text><text x="100" y="414" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#0A0A0A" text-anchor="start">Self-host: server + managed Postgres</text><rect x="100" y="430" width="48.87" height="50" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="3"/><text x="164.87" y="468" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#0A0A0A" text-anchor="start">about $27</text><text x="100" y="536" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#0A0A0A" text-anchor="start">Self-host: one server, Postgres in Compose</text><rect x="100" y="552" width="21.6" height="50" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="3"/><text x="137.6" y="590" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#0A0A0A" text-anchor="start">$12</text><text x="100" y="638" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#525252" text-anchor="start">Server prices are DigitalOcean list prices. Backups, your time and uptime are extra.</text></svg>