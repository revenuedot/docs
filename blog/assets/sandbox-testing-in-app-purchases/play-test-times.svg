<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d" font-family="Manrope, Helvetica, Arial, sans-serif"><title id="t">Google Play test subscription renewal times</title><desc id="d">Test renewal time by production period: one week 5 minutes, one month 5, three months 10, six months 15, one year 30.</desc><rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/><rect x="80" y="56" width="64" height="10" fill="#F7B500"/><text x="80" y="150" font-size="48" font-weight="800" fill="#0A0A0A" text-anchor="start">Google Play test subscriptions renew in minutes</text><text x="80" y="200" font-size="26" font-weight="500" fill="#525252" text-anchor="start">Production period and test renewal time for license testers</text><line x1="300" y1="260" x2="300" y2="640" stroke="#0A0A0A" stroke-width="2"/><text x="80" y="316" font-size="28" font-weight="800" fill="#0A0A0A" text-anchor="start">1 week</text><rect x="300" y="280" width="130" height="48" fill="#E5E5E5"/><text x="446" y="314" font-size="26" font-weight="800" fill="#0A0A0A" text-anchor="start">5 min</text><text x="80" y="388" font-size="28" font-weight="800" fill="#0A0A0A" text-anchor="start">1 month</text><rect x="300" y="352" width="130" height="48" fill="#E5E5E5"/><text x="446" y="386" font-size="26" font-weight="800" fill="#0A0A0A" text-anchor="start">5 min</text><text x="80" y="460" font-size="28" font-weight="800" fill="#0A0A0A" text-anchor="start">3 months</text><rect x="300" y="424" width="260" height="48" fill="#E5E5E5"/><text x="576" y="458" font-size="26" font-weight="800" fill="#0A0A0A" text-anchor="start">10 min</text><text x="80" y="532" font-size="28" font-weight="800" fill="#0A0A0A" text-anchor="start">6 months</text><rect x="300" y="496" width="390" height="48" fill="#E5E5E5"/><text x="706" y="530" font-size="26" font-weight="800" fill="#0A0A0A" text-anchor="start">15 min</text><text x="80" y="604" font-size="28" font-weight="800" fill="#0A0A0A" text-anchor="start">1 year</text><rect x="300" y="568" width="780" height="48" fill="#0A0A0A"/><text x="1096" y="602" font-size="26" font-weight="800" fill="#0A0A0A" text-anchor="start">30 min</text><text x="80" y="720" font-size="26" font-weight="500" fill="#0A0A0A" text-anchor="start">Test periods: free trial 3 min, grace period 5 min, account hold 10 min.</text><text x="80" y="762" font-size="24" font-weight="500" fill="#525252" text-anchor="start">A test subscription renews at most six times. Times are approximate.</text><line x1="80" y1="846" x2="1520" y2="846" stroke="#E5E5E5" stroke-width="2"/><text x="80" y="880" font-size="22" font-weight="500" fill="#525252" text-anchor="start">Source: Android Developers, Test your Google Play Billing Library integration (developer.android.com)</text></svg>