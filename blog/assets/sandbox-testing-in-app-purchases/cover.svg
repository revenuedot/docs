<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d" font-family="Manrope, Helvetica, Arial, sans-serif"><title id="t">Test in-app purchases without charging anyone</title><desc id="d">Table of five test setups: Test Store, StoreKit configuration file, App Store sandbox, TestFlight and Play license testers.</desc><rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/><rect x="80" y="56" width="64" height="10" fill="#F7B500"/><text x="80" y="170" font-size="64" font-weight="800" fill="#0A0A0A" text-anchor="start">Test in-app purchases</text><text x="80" y="245" font-size="64" font-weight="800" fill="#0A0A0A" text-anchor="start">without charging anyone</text><text x="80" y="305" font-size="28" font-weight="500" fill="#525252" text-anchor="start">Five test setups, from no store account to the real store</text><rect x="80" y="340" width="1440" height="60" fill="#0A0A0A"/><text x="96" y="380" font-size="24" font-weight="800" fill="#FFFFFF" text-anchor="start">Setup</text><text x="566" y="380" font-size="24" font-weight="800" fill="#FFFFFF" text-anchor="start">Needs</text><text x="1036" y="380" font-size="24" font-weight="800" fill="#FFFFFF" text-anchor="start">Proves</text><text x="96" y="445" font-size="24" font-weight="800" fill="#0A0A0A" text-anchor="start">Test Store</text><text x="566" y="445" font-size="24" font-weight="500" fill="#525252" text-anchor="start">SDK key only</text><text x="1036" y="445" font-size="24" font-weight="500" fill="#525252" text-anchor="start">Paywall and entitlement flow</text><line x1="80" y1="474" x2="1520" y2="474" stroke="#E5E5E5" stroke-width="2"/><text x="96" y="519" font-size="24" font-weight="800" fill="#0A0A0A" text-anchor="start">StoreKit config file</text><text x="566" y="519" font-size="24" font-weight="500" fill="#525252" text-anchor="start">Xcode, no network</text><text x="1036" y="519" font-size="24" font-weight="500" fill="#525252" text-anchor="start">Purchase UI, offers, renewals</text><line x1="80" y1="548" x2="1520" y2="548" stroke="#E5E5E5" stroke-width="2"/><text x="96" y="593" font-size="24" font-weight="800" fill="#0A0A0A" text-anchor="start">App Store sandbox</text><text x="566" y="593" font-size="24" font-weight="500" fill="#525252" text-anchor="start">Sandbox Apple Account</text><text x="1036" y="593" font-size="24" font-weight="500" fill="#525252" text-anchor="start">Real products and notifications</text><line x1="80" y1="622" x2="1520" y2="622" stroke="#E5E5E5" stroke-width="2"/><text x="96" y="667" font-size="24" font-weight="800" fill="#0A0A0A" text-anchor="start">TestFlight</text><text x="566" y="667" font-size="24" font-weight="500" fill="#525252" text-anchor="start">Beta build, sandbox account</text><text x="1036" y="667" font-size="24" font-weight="500" fill="#525252" text-anchor="start">Release build behavior</text><line x1="80" y1="696" x2="1520" y2="696" stroke="#E5E5E5" stroke-width="2"/><text x="96" y="741" font-size="24" font-weight="800" fill="#0A0A0A" text-anchor="start">Play license testers</text><text x="566" y="741" font-size="24" font-weight="500" fill="#525252" text-anchor="start">Tester Google account</text><text x="1036" y="741" font-size="24" font-weight="500" fill="#525252" text-anchor="start">Real Play products, test cards</text><line x1="80" y1="770" x2="1520" y2="770" stroke="#E5E5E5" stroke-width="2"/><line x1="80" y1="846" x2="1520" y2="846" stroke="#E5E5E5" stroke-width="2"/><text x="80" y="880" font-size="22" font-weight="500" fill="#525252" text-anchor="start">Sources: Apple, Testing with sandbox; Android Developers, Test your Play Billing integration; RevenueCat docs</text></svg>