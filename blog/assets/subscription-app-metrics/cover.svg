<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d" font-family="Manrope, Helvetica, Arial, sans-serif"><title id="t">Six subscription metrics</title><desc id="d">MRR, churn, trial conversion, LTV, refund rate and paywall conversion are the six metrics a subscription app checks first.</desc><rect width="1600" height="900" fill="#FFFFFF"/><rect x="80" y="56" width="64" height="10" fill="#F7B500"/><text x="80" y="150" font-size="60" font-weight="800" fill="#0A0A0A" text-anchor="start">Six numbers tell you if the app is healthy</text><text x="80" y="205" font-size="30" font-weight="500" fill="#525252" text-anchor="start">Define each one once, then watch it weekly.</text><rect x="80" y="290" width="450" height="200" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2"/><text x="96" y="365" font-size="32" font-weight="800" fill="#0A0A0A" text-anchor="start">MRR</text><text x="96" y="408" font-size="26" font-weight="500" fill="#525252" text-anchor="start">Monthly price of every</text><text x="96" y="444" font-size="26" font-weight="500" fill="#525252" text-anchor="start">paid subscription</text><rect x="575" y="290" width="450" height="200" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2"/><text x="591" y="365" font-size="32" font-weight="800" fill="#0A0A0A" text-anchor="start">Churn</text><text x="591" y="408" font-size="26" font-weight="500" fill="#525252" text-anchor="start">Subscriptions that ended</text><text x="591" y="444" font-size="26" font-weight="500" fill="#525252" text-anchor="start">over those active</text><rect x="1070" y="290" width="450" height="200" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2"/><text x="1086" y="365" font-size="32" font-weight="800" fill="#0A0A0A" text-anchor="start">Trial conversion</text><text x="1086" y="408" font-size="26" font-weight="500" fill="#525252" text-anchor="start">Trials that became</text><text x="1086" y="444" font-size="26" font-weight="500" fill="#525252" text-anchor="start">paid subscriptions</text><rect x="80" y="530" width="450" height="200" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2"/><text x="96" y="605" font-size="32" font-weight="800" fill="#0A0A0A" text-anchor="start">LTV</text><text x="96" y="648" font-size="26" font-weight="500" fill="#525252" text-anchor="start">Revenue per customer</text><text x="96" y="684" font-size="26" font-weight="500" fill="#525252" text-anchor="start">over their lifetime</text><rect x="575" y="530" width="450" height="200" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2"/><text x="591" y="605" font-size="32" font-weight="800" fill="#0A0A0A" text-anchor="start">Refund rate</text><text x="591" y="648" font-size="26" font-weight="500" fill="#525252" text-anchor="start">Paid transactions that</text><text x="591" y="684" font-size="26" font-weight="500" fill="#525252" text-anchor="start">were refunded</text><rect x="1070" y="530" width="450" height="200" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2"/><text x="1086" y="605" font-size="32" font-weight="800" fill="#0A0A0A" text-anchor="start">Paywall conversion</text><text x="1086" y="648" font-size="26" font-weight="500" fill="#525252" text-anchor="start">Viewers who started</text><text x="1086" y="684" font-size="26" font-weight="500" fill="#525252" text-anchor="start">a trial or paid</text><line x1="80" y1="846" x2="1520" y2="846" stroke="#E5E5E5" stroke-width="2"/><text x="80" y="880" font-size="22" font-weight="500" fill="#525252" text-anchor="start">Definitions: revenuedot.app/docs/guides/charts</text></svg>