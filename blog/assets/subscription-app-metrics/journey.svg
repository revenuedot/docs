<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d" font-family="Manrope, Helvetica, Arial, sans-serif"><title id="t">Where each metric sits in the customer journey</title><desc id="d">A row of stages: new customer, paywall, trial, paid, renewal, refund. Each stage names the chart that measures it.</desc><rect width="1600" height="900" fill="#FFFFFF"/><rect x="80" y="56" width="64" height="10" fill="#F7B500"/><text x="80" y="128" font-size="44" font-weight="800" fill="#0A0A0A" text-anchor="start">Where each metric sits in the customer journey</text><text x="80" y="176" font-size="26" font-weight="500" fill="#525252" text-anchor="start">Each stage has one chart that answers whether people move on.</text><rect x="80" y="250" width="300" height="200" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2"/><text x="96" y="343" font-size="28" font-weight="800" fill="#0A0A0A" text-anchor="start">New customer</text><text x="96" y="381" font-size="24" font-weight="500" fill="#525252" text-anchor="start">New customers</text><line x1="390" y1="350" x2="436" y2="350" stroke="#0A0A0A" stroke-width="3"/><polygon points="450,350 432,340 432,360" fill="#0A0A0A"/><rect x="460" y="250" width="300" height="200" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2"/><text x="476" y="343" font-size="28" font-weight="800" fill="#0A0A0A" text-anchor="start">Paywall</text><text x="476" y="381" font-size="24" font-weight="500" fill="#525252" text-anchor="start">Paywall conversion</text><line x1="770" y1="350" x2="816" y2="350" stroke="#0A0A0A" stroke-width="3"/><polygon points="830,350 812,340 812,360" fill="#0A0A0A"/><rect x="840" y="250" width="300" height="200" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2"/><text x="856" y="343" font-size="28" font-weight="800" fill="#0A0A0A" text-anchor="start">Trial</text><text x="856" y="381" font-size="24" font-weight="500" fill="#525252" text-anchor="start">Trial conversion</text><line x1="1150" y1="350" x2="1196" y2="350" stroke="#0A0A0A" stroke-width="3"/><polygon points="1210,350 1192,340 1192,360" fill="#0A0A0A"/><rect x="1220" y="250" width="300" height="200" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2"/><text x="1236" y="343" font-size="28" font-weight="800" fill="#0A0A0A" text-anchor="start">Paid</text><text x="1236" y="381" font-size="24" font-weight="500" fill="#525252" text-anchor="start">MRR, churn</text><rect x="80" y="540" width="1440" height="220" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"/><text x="96" y="607" font-size="30" font-weight="800" fill="#0A0A0A" text-anchor="start">After the purchase</text><text x="96" y="648" font-size="26" font-weight="500" fill="#525252" text-anchor="start">Retention shows how many subscribers reach the next paid period.</text><text x="96" y="683" font-size="26" font-weight="500" fill="#525252" text-anchor="start">Refund rate shows how many paid transactions were later refunded.</text><text x="96" y="718" font-size="26" font-weight="500" fill="#525252" text-anchor="start">LTV adds up what each customer paid, minus refunds.</text><line x1="80" y1="846" x2="1520" y2="846" stroke="#E5E5E5" stroke-width="2"/><text x="80" y="880" font-size="22" font-weight="500" fill="#525252" text-anchor="start">Charts: revenuedot.app/charts</text></svg>