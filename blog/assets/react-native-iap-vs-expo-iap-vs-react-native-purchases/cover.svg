<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d" font-family="Manrope, Helvetica, Arial, sans-serif"><title id="t">react-native-iap vs expo-iap vs react-native-purchases</title><desc id="d">Three columns: react-native-iap and expo-iap leave verification and renewals to your own server, while react-native-purchases sends purchases to a backend that handles them.</desc><rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/><rect x="80" y="56" width="64" height="10" fill="#F7B500"/><text x="80" y="170" font-size="60" font-weight="800" fill="#0A0A0A">react-native-iap vs expo-iap</text><text x="80" y="242" font-size="60" font-weight="800" fill="#0A0A0A">vs react-native-purchases</text><text x="80" y="302" font-size="28" font-weight="500" fill="#525252">Who verifies the purchase decides how much you build</text><rect x="80" y="350" width="453" height="440" fill="none" stroke="#0A0A0A" stroke-width="2"/><text x="106" y="402" font-size="34" font-weight="800" fill="#0A0A0A">react-native-iap</text><text x="106" y="438" font-size="22" font-weight="500" fill="#525252">OpenIAP, MIT, bare RN</text><rect x="106" y="472" width="14" height="14" fill="#F7B500"/><text x="134" y="490" font-size="22" font-weight="500" fill="#0A0A0A">Products and purchase sheet</text><rect x="106" y="532" width="14" height="14" fill="#F7B500"/><text x="134" y="550" font-size="22" font-weight="500" fill="#0A0A0A">Your server verifies it</text><rect x="106" y="592" width="14" height="14" fill="#F7B500"/><text x="134" y="610" font-size="22" font-weight="500" fill="#0A0A0A">Your server tracks renewals</text><rect x="106" y="652" width="14" height="14" fill="#F7B500"/><text x="134" y="670" font-size="22" font-weight="500" fill="#0A0A0A">Acknowledge on Play in 3 days</text><rect x="106" y="712" width="14" height="14" fill="#F7B500"/><text x="134" y="730" font-size="22" font-weight="500" fill="#0A0A0A">Not for Expo projects</text><rect x="573" y="350" width="453" height="440" fill="none" stroke="#0A0A0A" stroke-width="2"/><text x="599" y="402" font-size="34" font-weight="800" fill="#0A0A0A">expo-iap</text><text x="599" y="438" font-size="22" font-weight="500" fill="#525252">OpenIAP, MIT, Expo</text><rect x="599" y="472" width="14" height="14" fill="#F7B500"/><text x="627" y="490" font-size="22" font-weight="500" fill="#0A0A0A">Products and purchase sheet</text><rect x="599" y="532" width="14" height="14" fill="#F7B500"/><text x="627" y="550" font-size="22" font-weight="500" fill="#0A0A0A">Your server verifies it</text><rect x="599" y="592" width="14" height="14" fill="#F7B500"/><text x="627" y="610" font-size="22" font-weight="500" fill="#0A0A0A">Your server tracks renewals</text><rect x="599" y="652" width="14" height="14" fill="#F7B500"/><text x="627" y="670" font-size="22" font-weight="500" fill="#0A0A0A">Acknowledge on Play in 3 days</text><rect x="599" y="712" width="14" height="14" fill="#F7B500"/><text x="627" y="730" font-size="22" font-weight="500" fill="#0A0A0A">Development build, not Expo Go</text><rect x="1066" y="350" width="453" height="440" fill="none" stroke="#0A0A0A" stroke-width="2"/><text x="1092" y="402" font-size="30" font-weight="800" fill="#0A0A0A">react-native-purchases</text><text x="1092" y="438" font-size="22" font-weight="500" fill="#525252">RevenueCat SDK, MIT</text><rect x="1092" y="472" width="14" height="14" fill="#F7B500"/><text x="1120" y="490" font-size="22" font-weight="500" fill="#0A0A0A">Offerings and purchase sheet</text><rect x="1092" y="532" width="14" height="14" fill="#F7B500"/><text x="1120" y="550" font-size="22" font-weight="500" fill="#0A0A0A">Backend verifies purchases</text><rect x="1092" y="592" width="14" height="14" fill="#F7B500"/><text x="1120" y="610" font-size="22" font-weight="500" fill="#0A0A0A">Backend tracks renewals</text><rect x="1092" y="652" width="14" height="14" fill="#F7B500"/><text x="1120" y="670" font-size="22" font-weight="500" fill="#0A0A0A">One entitlement on both stores</text><rect x="1092" y="712" width="14" height="14" fill="#F7B500"/><text x="1120" y="730" font-size="22" font-weight="500" fill="#0A0A0A">RevenueCat or RevenueDot</text><line x1="80" y1="846" x2="1520" y2="846" stroke="#E5E5E5" stroke-width="2"/><text x="80" y="880" font-size="22" font-weight="500" fill="#525252">Sources: npm, OpenIAP docs, RevenueCat Expo docs and pricing, Android Developers</text></svg>