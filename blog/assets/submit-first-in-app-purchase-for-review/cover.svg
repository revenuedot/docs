<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d" font-family="Manrope, Helvetica, Arial, sans-serif"><title id="t">Submit your first in-app purchase</title><desc id="d">Two columns: what to finish in App Store Connect, such as the Paid Apps Agreement and the review screenshot, and what to finish in the app, such as showing price and length and adding a restore button.</desc><rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/><rect x="80" y="56" width="64" height="10" fill="#F7B500"/><text x="80" y="170" font-size="64" font-weight="800" fill="#0A0A0A">Submit your first in-app purchase</text><text x="80" y="230" font-size="28" font-weight="500" fill="#525252">Send it with an app version, then pass App Review</text><rect x="80" y="350" width="700" height="440" fill="none" stroke="#0A0A0A" stroke-width="2"/><text x="108" y="402" font-size="34" font-weight="800" fill="#0A0A0A">In App Store Connect</text><text x="108" y="438" font-size="22" font-weight="500" fill="#525252">Before you add it for review</text><rect x="108" y="472" width="14" height="14" fill="#F7B500"/><text x="138" y="490" font-size="26" font-weight="500" fill="#0A0A0A">Sign the Paid Apps Agreement</text><rect x="108" y="532" width="14" height="14" fill="#F7B500"/><text x="138" y="550" font-size="26" font-weight="500" fill="#0A0A0A">Add tax and banking</text><rect x="108" y="592" width="14" height="14" fill="#F7B500"/><text x="138" y="610" font-size="26" font-weight="500" fill="#0A0A0A">Fill in name, price, screenshot</text><rect x="108" y="652" width="14" height="14" fill="#F7B500"/><text x="138" y="670" font-size="26" font-weight="500" fill="#0A0A0A">Add for Review with a version</text><rect x="108" y="712" width="14" height="14" fill="#F7B500"/><text x="138" y="730" font-size="26" font-weight="500" fill="#0A0A0A">Write clear review notes</text><rect x="820" y="350" width="700" height="440" fill="none" stroke="#0A0A0A" stroke-width="2"/><text x="848" y="402" font-size="34" font-weight="800" fill="#0A0A0A">In your app</text><text x="848" y="438" font-size="22" font-weight="500" fill="#525252">What the reviewer checks</text><rect x="848" y="472" width="14" height="14" fill="#F7B500"/><text x="878" y="490" font-size="26" font-weight="500" fill="#0A0A0A">Load prices in the sandbox</text><rect x="848" y="532" width="14" height="14" fill="#F7B500"/><text x="878" y="550" font-size="26" font-weight="500" fill="#0A0A0A">Show price and length</text><rect x="848" y="592" width="14" height="14" fill="#F7B500"/><text x="878" y="610" font-size="26" font-weight="500" fill="#0A0A0A">Link terms and privacy</text><rect x="848" y="652" width="14" height="14" fill="#F7B500"/><text x="878" y="670" font-size="26" font-weight="500" fill="#0A0A0A">Add a restore button</text><rect x="848" y="712" width="14" height="14" fill="#F7B500"/><text x="878" y="730" font-size="26" font-weight="500" fill="#0A0A0A">Never show a blank paywall</text></svg>