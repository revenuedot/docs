<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d" font-family="Manrope, Helvetica, Arial, sans-serif"><title id="t">Weekly plans now earn 55.5% of app revenue</title><desc id="d">Two bars: weekly plans were 43.3% of subscription revenue two years earlier and 55.5% in the 2026 report.</desc><rect width="1600" height="900" fill="#FFFFFF"/><rect x="80" y="56" width="64" height="10" fill="#F7B500"/><text x="80" y="170" font-size="64" font-weight="800" fill="#0A0A0A" text-anchor="start">Weekly plans now earn</text><text x="80" y="245" font-size="64" font-weight="800" fill="#0A0A0A" text-anchor="start">55.5% of app revenue</text><text x="80" y="305" font-size="28" font-weight="500" fill="#525252" text-anchor="start">Share of subscription revenue from weekly plans, Adapty</text><text x="80" y="360" font-size="28" font-weight="500" fill="#0A0A0A" text-anchor="start">Up from 43.3% two years earlier.</text><line x1="860" y1="730" x2="1520" y2="730" stroke="#0A0A0A" stroke-width="3"/><rect x="895.0" y="316.5045045045045" width="260" height="413.4954954954955" fill="#E5E5E5"/><text x="1025.0" y="298.5045045045045" font-size="64" font-weight="800" fill="#0A0A0A" text-anchor="middle">43.3%</text><text x="1025.0" y="770" font-size="28" font-weight="800" fill="#0A0A0A" text-anchor="middle">Two years earlier</text><rect x="1225.0" y="200.0" width="260" height="530.0" fill="#0A0A0A"/><text x="1355.0" y="182.0" font-size="64" font-weight="800" fill="#0A0A0A" text-anchor="middle">55.5%</text><text x="1355.0" y="770" font-size="28" font-weight="800" fill="#0A0A0A" text-anchor="middle">2026 report</text><line x1="80" y1="846" x2="1520" y2="846" stroke="#E5E5E5" stroke-width="2"/><text x="80" y="880" font-size="22" font-weight="500" fill="#525252" text-anchor="start">Source: Adapty, State of In-App Subscriptions 2026 (adapty.io/blog/mobile-app-monetization-2026)</text></svg>
