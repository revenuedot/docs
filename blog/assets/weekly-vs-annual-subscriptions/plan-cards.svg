<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d" font-family="Manrope, Helvetica, Arial, sans-serif"><title id="t">How to show weekly and annual side by side</title><desc id="d">Three plan cards: annual selected with a save badge, monthly, and weekly with a 3-day trial. Billed amounts are largest.</desc><rect width="1600" height="900" fill="#FFFFFF"/><rect x="80" y="56" width="64" height="10" fill="#F7B500"/><text x="80" y="128" font-size="44" font-weight="800" fill="#0A0A0A" text-anchor="start">How to show weekly and annual side by side</text><text x="80" y="176" font-size="26" font-weight="500" fill="#525252" text-anchor="start">The billed amount is the largest price on every card (Apple).</text><line x1="80" y1="846" x2="1520" y2="846" stroke="#E5E5E5" stroke-width="2"/><text x="80" y="880" font-size="22" font-weight="500" fill="#525252" text-anchor="start">Rule: developer.apple.com/app-store/subscriptions. Prices are examples.</text><rect x="80" y="260" width="440" height="330" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="5"/><rect x="104" y="242" width="170" height="36" fill="#F7B500"/><text x="189" y="268" font-size="24" font-weight="800" fill="#0A0A0A" text-anchor="middle">SAVE 85%</text><text x="110" y="340" font-size="34" font-weight="800" fill="#0A0A0A" text-anchor="start">Annual</text><text x="110" y="430" font-size="64" font-weight="800" fill="#0A0A0A" text-anchor="start">$39.99</text><text x="110" y="472" font-size="26" font-weight="500" fill="#525252" text-anchor="start">billed yearly</text><text x="110" y="530" font-size="24" font-weight="500" fill="#525252" text-anchor="start">$0.77 a week</text><rect x="570" y="260" width="440" height="330" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"/><text x="600" y="340" font-size="34" font-weight="800" fill="#0A0A0A" text-anchor="start">Monthly</text><text x="600" y="430" font-size="64" font-weight="800" fill="#0A0A0A" text-anchor="start">$9.99</text><text x="600" y="472" font-size="26" font-weight="500" fill="#525252" text-anchor="start">billed monthly</text><text x="600" y="530" font-size="24" font-weight="500" fill="#525252" text-anchor="start">$2.31 a week</text><rect x="1060" y="260" width="440" height="330" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"/><text x="1090" y="340" font-size="34" font-weight="800" fill="#0A0A0A" text-anchor="start">Weekly</text><text x="1090" y="430" font-size="64" font-weight="800" fill="#0A0A0A" text-anchor="start">$4.99</text><text x="1090" y="472" font-size="26" font-weight="500" fill="#525252" text-anchor="start">billed weekly</text><text x="1090" y="530" font-size="24" font-weight="500" fill="#525252" text-anchor="start">3 days free</text><rect x="80" y="640" width="40" height="40" fill="#F7B500"/><text x="100.0" y="668.0" font-size="26" font-weight="800" fill="#0A0A0A" text-anchor="middle">1</text><text x="140" y="670" font-size="28" font-weight="500" fill="#0A0A0A" text-anchor="start">Annual is selected when the screen opens. Billed amount in the biggest type.</text><rect x="80" y="700" width="40" height="40" fill="#F7B500"/><text x="100.0" y="728.0" font-size="26" font-weight="800" fill="#0A0A0A" text-anchor="middle">2</text><text x="140" y="730" font-size="28" font-weight="500" fill="#0A0A0A" text-anchor="start">Per-week price and savings are smaller and sit below the billed amount.</text><rect x="80" y="760" width="40" height="40" fill="#F7B500"/><text x="100.0" y="788.0" font-size="26" font-weight="800" fill="#0A0A0A" text-anchor="middle">3</text><text x="140" y="790" font-size="28" font-weight="500" fill="#0A0A0A" text-anchor="start">Weekly shows its trial on the card. The trial belongs to a plan, not a switch.</text></svg>
