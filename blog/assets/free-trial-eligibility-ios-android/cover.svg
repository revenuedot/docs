<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d" font-family="Manrope, Helvetica, Arial, sans-serif"><title id="t">How to check free trial eligibility on iOS and Android</title><desc id="d">A decision path: check eligibility with StoreKit 2 on iOS or the eligible offers from Google Play, then show Start free trial with the trial terms to eligible users and the plain price to everyone else.</desc><rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/><rect x="80" y="56" width="64" height="10" fill="#F7B500"/><text x="80" y="170" font-size="64" font-weight="800" fill="#0A0A0A">Free trial eligibility</text><text x="80" y="245" font-size="64" font-weight="800" fill="#0A0A0A">on iOS and Android</text><text x="80" y="305" font-size="28" font-weight="500" fill="#525252">Show "Start free trial" only to people who can get it</text><rect x="80" y="370" width="560" height="380" fill="none" stroke="#0A0A0A" stroke-width="2"/><text x="108" y="422" font-size="34" font-weight="800" fill="#0A0A0A">Check</text><text x="108" y="458" font-size="22" font-weight="500" fill="#525252">Before the paywall shows a trial</text><rect x="108" y="502" width="14" height="14" fill="#F7B500"/><text x="138" y="520" font-size="26" font-weight="500" fill="#0A0A0A">iOS: isEligibleForIntroOffer</text><rect x="108" y="572" width="14" height="14" fill="#F7B500"/><text x="138" y="590" font-size="26" font-weight="500" fill="#0A0A0A">One intro offer per group</text><rect x="108" y="642" width="14" height="14" fill="#F7B500"/><text x="138" y="660" font-size="26" font-weight="500" fill="#0A0A0A">Android: Play lists only</text><text x="138" y="696" font-size="26" font-weight="500" fill="#0A0A0A">eligible offers</text><line x1="640" y1="560" x2="760" y2="560" stroke="#0A0A0A" stroke-width="2"/><line x1="760" y1="470" x2="760" y2="650" stroke="#0A0A0A" stroke-width="2"/><line x1="760" y1="470" x2="820" y2="470" stroke="#0A0A0A" stroke-width="2"/><line x1="760" y1="650" x2="820" y2="650" stroke="#0A0A0A" stroke-width="2"/><rect x="820" y="370" width="700" height="190" fill="#F7B500"/><text x="848" y="420" font-size="24" font-weight="700" fill="#0A0A0A">Eligible</text><text x="848" y="478" font-size="40" font-weight="800" fill="#0A0A0A">Start free trial</text><text x="848" y="528" font-size="26" font-weight="500" fill="#0A0A0A">7 days free, then $59.99 a year</text><rect x="820" y="560" width="700" height="190" fill="none" stroke="#0A0A0A" stroke-width="2"/><text x="848" y="610" font-size="24" font-weight="700" fill="#525252">Ineligible, unknown or no offer</text><text x="848" y="668" font-size="40" font-weight="800" fill="#0A0A0A">Subscribe</text><text x="848" y="718" font-size="26" font-weight="500" fill="#0A0A0A">$59.99 a year</text><line x1="80" y1="846" x2="1520" y2="846" stroke="#E5E5E5" stroke-width="2"/><text x="80" y="880" font-size="22" font-weight="500" fill="#525252">Sources: Apple StoreKit docs, Android Developers, RevenueCat SDK reference</text></svg>
