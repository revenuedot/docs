<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" width="1600" height="520" role="img" aria-labelledby="t d"><title id="t">Real-time developer notification path</title><desc id="d">Google Play publishes to a Pub/Sub topic, a push subscription delivers it to RevenueDot, and RevenueDot reads the purchase from the Play Developer API.</desc><rect width="1600" height="520" fill="#FFFFFF"/><rect x="60" y="190" width="262" height="150" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"/><text x="191.0" y="272.92" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#0A0A0A" text-anchor="middle">Google Play</text><text x="191.0" y="300" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#525252" text-anchor="middle">publishes event</text><line x1="322" y1="265" x2="364" y2="265" stroke="#0A0A0A" stroke-width="3"/><polygon points="364,265 348.0,273.0 348.0,257.0" fill="#0A0A0A"/><rect x="364" y="190" width="262" height="150" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"/><text x="495.0" y="272.92" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#0A0A0A" text-anchor="middle">Pub/Sub topic</text><text x="495.0" y="300" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#525252" text-anchor="middle">one per app</text><line x1="626" y1="265" x2="668" y2="265" stroke="#0A0A0A" stroke-width="3"/><polygon points="668,265 652.0,273.0 652.0,257.0" fill="#0A0A0A"/><rect x="668" y="190" width="262" height="150" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"/><text x="799.0" y="272.92" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#0A0A0A" text-anchor="middle">Push delivery</text><text x="799.0" y="300" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#525252" text-anchor="middle">HTTPS POST</text><line x1="930" y1="265" x2="972" y2="265" stroke="#0A0A0A" stroke-width="3"/><polygon points="972,265 956.0,273.0 956.0,257.0" fill="#0A0A0A"/><rect x="972" y="190" width="262" height="150" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="3"/><rect x="986" y="204" width="14" height="14" fill="#F7B500"/><text x="1103.0" y="272.92" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#0A0A0A" text-anchor="middle">RevenueDot</text><text x="1103.0" y="300" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#525252" text-anchor="middle">notification URL</text><line x1="1234" y1="265" x2="1276" y2="265" stroke="#0A0A0A" stroke-width="3"/><polygon points="1276,265 1260.0,273.0 1260.0,257.0" fill="#0A0A0A"/><rect x="1276" y="190" width="262" height="150" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"/><text x="1407.0" y="272.92" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#0A0A0A" text-anchor="middle">Play API</text><text x="1407.0" y="300" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#525252" text-anchor="middle">subscriptionsv2.get</text><text x="60" y="100" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="28" font-weight="800" fill="#0A0A0A" text-anchor="start">The message only says something changed. RevenueDot then reads the full purchase.</text><text x="60" y="440" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#525252" text-anchor="start">Pub/Sub retries when the endpoint answers 500 or 503. RevenueDot answers 200 when handled.</text></svg>