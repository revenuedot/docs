<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d" font-family="Manrope, Helvetica, Arial, sans-serif"><title id="t">Move from Adapty in four steps</title><desc id="d">Four steps move subscribers from Adapty to RevenueDot. Subscribers re-sync from store receipts.</desc><rect width="1600" height="900" fill="#FFFFFF"/><rect x="80" y="56" width="64" height="10" fill="#F7B500"/><text x="80" y="150" font-size="60" font-weight="800" fill="#0A0A0A" text-anchor="start">Leave Adapty without losing a subscriber</text><text x="80" y="205" font-size="30" font-weight="500" fill="#525252" text-anchor="start">Active subscribers come across when the new app posts their store receipts.</text><rect x="80" y="300" width="300" height="190" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2"/><text x="96" y="372" font-size="30" font-weight="800" fill="#0A0A0A" text-anchor="start">1. Rebuild</text><text x="96" y="413" font-size="24" font-weight="500" fill="#525252" text-anchor="start">Products, offerings</text><text x="96" y="445" font-size="24" font-weight="500" fill="#525252" text-anchor="start">and entitlements</text><line x1="390" y1="395" x2="436" y2="395" stroke="#0A0A0A" stroke-width="3"/><polygon points="450,395 432,385 432,405" fill="#0A0A0A"/><rect x="460" y="300" width="300" height="190" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2"/><text x="476" y="372" font-size="30" font-weight="800" fill="#0A0A0A" text-anchor="start">2. Swap SDK</text><text x="476" y="413" font-size="24" font-weight="500" fill="#525252" text-anchor="start">RevenueCat SDK with</text><text x="476" y="445" font-size="24" font-weight="500" fill="#525252" text-anchor="start">the proxy URL set</text><line x1="770" y1="395" x2="816" y2="395" stroke="#0A0A0A" stroke-width="3"/><polygon points="830,395 812,385 812,405" fill="#0A0A0A"/><rect x="840" y="300" width="300" height="190" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2"/><text x="856" y="372" font-size="30" font-weight="800" fill="#0A0A0A" text-anchor="start">3. Route</text><text x="856" y="413" font-size="24" font-weight="500" fill="#525252" text-anchor="start">Notifications go to</text><text x="856" y="445" font-size="24" font-weight="500" fill="#525252" text-anchor="start">RevenueDot first</text><line x1="1150" y1="395" x2="1196" y2="395" stroke="#0A0A0A" stroke-width="3"/><polygon points="1210,395 1192,385 1192,405" fill="#0A0A0A"/><rect x="1220" y="300" width="300" height="190" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="4"/><text x="1236" y="372" font-size="30" font-weight="800" fill="#0A0A0A" text-anchor="start">4. Re-sync</text><text x="1236" y="413" font-size="24" font-weight="500" fill="#525252" text-anchor="start">First launch posts</text><text x="1236" y="445" font-size="24" font-weight="500" fill="#525252" text-anchor="start">store receipts</text><rect x="80" y="580" width="1440" height="130" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"/><text x="110" y="636" font-size="30" font-weight="800" fill="#0A0A0A" text-anchor="start">No Adapty importer exists. RevenueDot's importer reads RevenueCat projects only.</text><text x="110" y="682" font-size="26" font-weight="500" fill="#525252" text-anchor="start">Keep Adapty running until the re-sync is complete.</text><line x1="80" y1="846" x2="1520" y2="846" stroke="#E5E5E5" stroke-width="2"/><text x="80" y="880" font-size="22" font-weight="500" fill="#525252" text-anchor="start">Sources: adapty.io/docs/migrate-to-adapty-from-another-solutions, revenuedot.app/docs/migrate</text></svg>