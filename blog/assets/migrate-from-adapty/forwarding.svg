<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d" font-family="Manrope, Helvetica, Arial, sans-serif"><title id="t">One Apple URL, forwarded to Adapty</title><desc id="d">Apple sends notifications to RevenueDot, which stores them and forwards the exact body to Adapty during the overlap.</desc><rect width="1600" height="900" fill="#FFFFFF"/><rect x="80" y="56" width="64" height="10" fill="#F7B500"/><text x="80" y="128" font-size="44" font-weight="800" fill="#0A0A0A" text-anchor="start">One Apple URL, forwarded to Adapty</text><text x="80" y="176" font-size="26" font-weight="500" fill="#525252" text-anchor="start">App Store Connect holds one production and one sandbox URL, so RevenueDot sits first.</text><rect x="80" y="270" width="380" height="190" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2"/><text x="96" y="342" font-size="30" font-weight="800" fill="#0A0A0A" text-anchor="start">Apple</text><text x="96" y="383" font-size="24" font-weight="500" fill="#525252" text-anchor="start">App Store Server</text><text x="96" y="415" font-size="24" font-weight="500" fill="#525252" text-anchor="start">Notifications V2</text><line x1="470" y1="365" x2="586" y2="365" stroke="#0A0A0A" stroke-width="3"/><polygon points="600,365 582,355 582,375" fill="#0A0A0A"/><rect x="610" y="270" width="380" height="190" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="4"/><text x="626" y="343" font-size="32" font-weight="800" fill="#0A0A0A" text-anchor="start">RevenueDot</text><text x="626" y="386" font-size="24" font-weight="500" fill="#525252" text-anchor="start">Stores, applies,</text><text x="626" y="419" font-size="24" font-weight="500" fill="#525252" text-anchor="start">then forwards the body</text><line x1="1000" y1="365" x2="1116" y2="365" stroke="#0A0A0A" stroke-width="3"/><polygon points="1130,365 1112,355 1112,375" fill="#0A0A0A"/><rect x="1140" y="270" width="380" height="190" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2"/><text x="1156" y="342" font-size="30" font-weight="800" fill="#0A0A0A" text-anchor="start">Adapty</text><text x="1156" y="383" font-size="24" font-weight="500" fill="#525252" text-anchor="start">Keeps old app versions</text><text x="1156" y="415" font-size="24" font-weight="500" fill="#525252" text-anchor="start">and webhooks correct</text><rect x="80" y="530" width="1440" height="250" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"/><text x="96" y="612" font-size="30" font-weight="800" fill="#0A0A0A" text-anchor="start">During the overlap</text><text x="96" y="653" font-size="26" font-weight="500" fill="#525252" text-anchor="start">Old app versions still call Adapty, so Adapty needs every renewal and refund.</text><text x="96" y="688" font-size="26" font-weight="500" fill="#525252" text-anchor="start">Forwarding is fire and forget with a 10 second timeout and never delays Apple's answer.</text><text x="96" y="723" font-size="26" font-weight="500" fill="#525252" text-anchor="start">Run a daily check that active entitlements match in both systems before you switch Adapty off.</text><line x1="80" y1="846" x2="1520" y2="846" stroke="#E5E5E5" stroke-width="2"/><text x="80" y="880" font-size="22" font-weight="500" fill="#525252" text-anchor="start">Sources: Apple Help, adapty.io/docs/enable-app-store-server-notifications, RevenueDot dual-run docs</text></svg>