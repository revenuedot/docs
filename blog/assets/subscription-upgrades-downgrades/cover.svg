<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d" font-family="Manrope, Helvetica, Arial, sans-serif"><title id="t">Subscription upgrades, downgrades and crossgrades</title><desc id="d">App Store: upgrade now with prorated refund, downgrade at renewal, crossgrade by duration. Google Play: replacement modes.</desc><rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/><rect x="80" y="56" width="64" height="10" fill="#F7B500"/><text x="80" y="170" font-size="64" font-weight="800" fill="#0A0A0A" text-anchor="start">Subscription upgrades,</text><text x="80" y="245" font-size="64" font-weight="800" fill="#0A0A0A" text-anchor="start">downgrades and crossgrades</text><text x="80" y="305" font-size="28" font-weight="500" fill="#525252" text-anchor="start">Apple decides by level. Google Play decides by replacement mode</text><rect x="80" y="350" width="700" height="440" fill="none" stroke="#0A0A0A" stroke-width="2"/><text x="108" y="400" font-size="34" font-weight="800" fill="#0A0A0A" text-anchor="start">App Store</text><text x="108" y="436" font-size="22" font-weight="500" fill="#525252" text-anchor="start">Rank products by level in a subscription group</text><line x1="108" y1="464" x2="752" y2="464" stroke="#E5E5E5" stroke-width="2"/><text x="108" y="500" font-size="26" font-weight="800" fill="#0A0A0A" text-anchor="start">Upgrade</text><text x="108" y="534" font-size="24" font-weight="500" fill="#525252" text-anchor="start">Higher level: starts now, prorated refund</text><line x1="108" y1="570" x2="752" y2="570" stroke="#E5E5E5" stroke-width="2"/><text x="108" y="606" font-size="26" font-weight="800" fill="#0A0A0A" text-anchor="start">Downgrade</text><text x="108" y="640" font-size="24" font-weight="500" fill="#525252" text-anchor="start">Lower level: starts at the next renewal</text><line x1="108" y1="676" x2="752" y2="676" stroke="#E5E5E5" stroke-width="2"/><text x="108" y="712" font-size="26" font-weight="800" fill="#0A0A0A" text-anchor="start">Crossgrade</text><text x="108" y="746" font-size="24" font-weight="500" fill="#525252" text-anchor="start">Same level: same duration now, else later</text><rect x="820" y="350" width="700" height="440" fill="none" stroke="#0A0A0A" stroke-width="2"/><text x="848" y="400" font-size="34" font-weight="800" fill="#0A0A0A" text-anchor="start">Google Play</text><text x="848" y="436" font-size="22" font-weight="500" fill="#525252" text-anchor="start">Pick a replacement mode in code</text><line x1="848" y1="464" x2="1492" y2="464" stroke="#E5E5E5" stroke-width="2"/><text x="848" y="500" font-size="26" font-weight="800" fill="#0A0A0A" text-anchor="start">Upgrade to a pricier tier</text><text x="848" y="534" font-size="24" font-weight="500" fill="#525252" text-anchor="start">CHARGE_PRORATED_PRICE</text><line x1="848" y1="570" x2="1492" y2="570" stroke="#E5E5E5" stroke-width="2"/><text x="848" y="606" font-size="26" font-weight="800" fill="#0A0A0A" text-anchor="start">Downgrade to a cheaper tier</text><text x="848" y="640" font-size="24" font-weight="500" fill="#525252" text-anchor="start">DEFERRED</text><line x1="848" y1="676" x2="1492" y2="676" stroke="#E5E5E5" stroke-width="2"/><text x="848" y="712" font-size="26" font-weight="800" fill="#0A0A0A" text-anchor="start">Upgrade in a trial, keep the trial</text><text x="848" y="746" font-size="24" font-weight="500" fill="#525252" text-anchor="start">WITHOUT_PRORATION</text><line x1="80" y1="846" x2="1520" y2="846" stroke="#E5E5E5" stroke-width="2"/><text x="80" y="880" font-size="22" font-weight="500" fill="#525252" text-anchor="start">Sources: Apple, Subscriptions; Android Developers, About subscriptions (replacement recommendations)</text></svg>