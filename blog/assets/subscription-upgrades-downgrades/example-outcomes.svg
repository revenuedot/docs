<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d" font-family="Manrope, Helvetica, Arial, sans-serif"><title id="t">One upgrade, five outcomes on Google Play</title><desc id="d">Table of Google's example upgrade from a 2 dollar monthly plan to a 36 dollar annual plan, by replacement mode.</desc><rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/><rect x="80" y="56" width="64" height="10" fill="#F7B500"/><text x="80" y="150" font-size="48" font-weight="800" fill="#0A0A0A" text-anchor="start">One upgrade, five outcomes</text><text x="80" y="200" font-size="26" font-weight="500" fill="#525252" text-anchor="start">Google's example: a $2 monthly plan to a $36 annual plan on April 15</text><rect x="80" y="250" width="1440" height="64" fill="#0A0A0A"/><text x="96" y="294" font-size="24" font-weight="800" fill="#FFFFFF" text-anchor="start">Replacement mode</text><text x="566" y="294" font-size="24" font-weight="800" fill="#FFFFFF" text-anchor="start">New plan starts</text><text x="886" y="294" font-size="24" font-weight="800" fill="#FFFFFF" text-anchor="start">What is charged</text><text x="96" y="364" font-size="24" font-weight="800" fill="#0A0A0A" text-anchor="start">WITH_TIME_PRORATION</text><text x="566" y="364" font-size="24" font-weight="500" fill="#525252" text-anchor="start">April 15</text><text x="886" y="364" font-size="24" font-weight="500" fill="#525252" text-anchor="start">$1 credit covers 10 days, then $36 on Apr 26</text><line x1="80" y1="398" x2="1520" y2="398" stroke="#E5E5E5" stroke-width="2"/><text x="96" y="448" font-size="24" font-weight="800" fill="#0A0A0A" text-anchor="start">CHARGE_PRORATED_PRICE</text><text x="566" y="448" font-size="24" font-weight="500" fill="#525252" text-anchor="start">April 15</text><text x="886" y="448" font-size="24" font-weight="500" fill="#525252" text-anchor="start">$0.50 now, $36 on May 1</text><line x1="80" y1="482" x2="1520" y2="482" stroke="#E5E5E5" stroke-width="2"/><text x="96" y="532" font-size="24" font-weight="800" fill="#0A0A0A" text-anchor="start">CHARGE_FULL_PRICE</text><text x="566" y="532" font-size="24" font-weight="500" fill="#525252" text-anchor="start">April 15</text><text x="886" y="532" font-size="24" font-weight="500" fill="#525252" text-anchor="start">$36 now, next $36 in a year and 10 days</text><line x1="80" y1="566" x2="1520" y2="566" stroke="#E5E5E5" stroke-width="2"/><text x="96" y="616" font-size="24" font-weight="800" fill="#0A0A0A" text-anchor="start">WITHOUT_PRORATION</text><text x="566" y="616" font-size="24" font-weight="500" fill="#525252" text-anchor="start">April 15</text><text x="886" y="616" font-size="24" font-weight="500" fill="#525252" text-anchor="start">No charge now, $36 on May 1</text><line x1="80" y1="650" x2="1520" y2="650" stroke="#E5E5E5" stroke-width="2"/><text x="96" y="700" font-size="24" font-weight="800" fill="#0A0A0A" text-anchor="start">DEFERRED</text><text x="566" y="700" font-size="24" font-weight="500" fill="#525252" text-anchor="start">May 1</text><text x="886" y="700" font-size="24" font-weight="500" fill="#525252" text-anchor="start">$36 on May 1</text><line x1="80" y1="734" x2="1520" y2="734" stroke="#E5E5E5" stroke-width="2"/><line x1="80" y1="846" x2="1520" y2="846" stroke="#E5E5E5" stroke-width="2"/><text x="80" y="880" font-size="22" font-weight="500" fill="#525252" text-anchor="start">Source: Android Developers, About subscriptions, replacement examples (developer.android.com)</text></svg>