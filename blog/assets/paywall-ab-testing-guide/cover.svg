<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d" font-family="Manrope, Helvetica, Arial, sans-serif"><title id="t">Customers needed per variant to detect a lift</title><desc id="d">Bars: at a 10% baseline conversion, detecting a 10% relative lift needs 14,751 customers per variant, 20% needs 3,841, 30% needs 1,774, 50% needs 686.</desc><rect width="1600" height="900" fill="#FFFFFF"/><rect x="80" y="56" width="64" height="10" fill="#F7B500"/><text x="80" y="150" font-size="60" font-weight="800" fill="#0A0A0A" text-anchor="start">Small lifts need thousands of customers</text><text x="80" y="205" font-size="30" font-weight="500" fill="#525252" text-anchor="start">Customers needed per variant at a 10% baseline (5% significance, 80% power).</text><text x="80" y="336" font-size="28" font-weight="800" fill="#0A0A0A" text-anchor="start">+10% lift</text><rect x="320" y="290" width="900" height="70" fill="#0A0A0A"/><text x="1240" y="337" font-size="30" font-weight="800" fill="#0A0A0A" text-anchor="start">14,751</text><text x="80" y="436" font-size="28" font-weight="800" fill="#0A0A0A" text-anchor="start">+20% lift</text><rect x="320" y="390" width="234" height="70" fill="#0A0A0A"/><text x="574" y="437" font-size="30" font-weight="800" fill="#0A0A0A" text-anchor="start">3,841</text><text x="80" y="536" font-size="28" font-weight="800" fill="#0A0A0A" text-anchor="start">+30% lift</text><rect x="320" y="490" width="108" height="70" fill="#0A0A0A"/><text x="448" y="537" font-size="30" font-weight="800" fill="#0A0A0A" text-anchor="start">1,774</text><text x="80" y="636" font-size="28" font-weight="800" fill="#0A0A0A" text-anchor="start">+50% lift</text><rect x="320" y="590" width="41" height="70" fill="#0A0A0A"/><text x="381" y="637" font-size="30" font-weight="800" fill="#0A0A0A" text-anchor="start">686</text><text x="80" y="720" font-size="26" font-weight="500" fill="#525252" text-anchor="start">A 10% lift means conversion moves from 10.0% to 11.0%. A 50% lift means 10.0% to 15.0%.</text><line x1="80" y1="846" x2="1520" y2="846" stroke="#E5E5E5" stroke-width="2"/><text x="80" y="880" font-size="22" font-weight="500" fill="#525252" text-anchor="start">Our calculation: two-sided two-proportion test. Method: evanmiller.org/ab-testing/sample-size.html</text></svg>