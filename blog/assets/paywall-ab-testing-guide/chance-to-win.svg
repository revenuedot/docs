<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d" font-family="Manrope, Helvetica, Arial, sans-serif"><title id="t">Reading chance to win</title><desc id="d">A scale from 0 to 100 percent: below 5 is probably worse, 5 to 95 is not decided, above 95 is a likely winner.</desc><rect width="1600" height="900" fill="#FFFFFF"/><rect x="80" y="56" width="64" height="10" fill="#F7B500"/><text x="80" y="128" font-size="44" font-weight="800" fill="#0A0A0A" text-anchor="start">Reading chance to win</text><text x="80" y="176" font-size="26" font-weight="500" fill="#525252" text-anchor="start">It is the probability that the treatment beats the control, given the data so far.</text><rect x="80" y="330" width="1440" height="100" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2"/><rect x="80" y="330" width="72" height="100" fill="#E5E5E5" stroke="#0A0A0A" stroke-width="2"/><rect x="152" y="330" width="1296" height="100" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2"/><rect x="1448" y="330" width="72" height="100" fill="#0A0A0A" stroke="#0A0A0A" stroke-width="2"/><text x="800" y="392" font-size="28" font-weight="800" fill="#0A0A0A" text-anchor="middle">Not decided: keep collecting data</text><line x1="80" y1="430" x2="80" y2="460" stroke="#0A0A0A" stroke-width="3"/><text x="80" y="500" font-size="26" font-weight="800" fill="#0A0A0A" text-anchor="start">0%</text><line x1="800" y1="430" x2="800" y2="460" stroke="#0A0A0A" stroke-width="3"/><text x="800" y="500" font-size="26" font-weight="800" fill="#0A0A0A" text-anchor="middle">50%</text><line x1="1448" y1="430" x2="1448" y2="460" stroke="#0A0A0A" stroke-width="3"/><text x="1448" y="500" font-size="26" font-weight="800" fill="#0A0A0A" text-anchor="middle">95%</text><line x1="1520" y1="430" x2="1520" y2="460" stroke="#0A0A0A" stroke-width="3"/><text x="1520" y="500" font-size="26" font-weight="800" fill="#0A0A0A" text-anchor="end">100%</text><rect x="80" y="570" width="450" height="190" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"/><text x="96" y="642" font-size="28" font-weight="800" fill="#0A0A0A" text-anchor="start">Below 5%</text><text x="96" y="680" font-size="24" font-weight="500" fill="#525252" text-anchor="start">The treatment is very</text><text x="96" y="712" font-size="24" font-weight="500" fill="#525252" text-anchor="start">likely worse. Stop it.</text><rect x="575" y="570" width="450" height="190" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"/><text x="591" y="642" font-size="28" font-weight="800" fill="#0A0A0A" text-anchor="start">Around 50%</text><text x="591" y="680" font-size="24" font-weight="500" fill="#525252" text-anchor="start">A coin flip. Either the</text><text x="591" y="712" font-size="24" font-weight="500" fill="#525252" text-anchor="start">lift is tiny or data is thin.</text><rect x="1070" y="570" width="450" height="190" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"/><text x="1086" y="642" font-size="28" font-weight="800" fill="#0A0A0A" text-anchor="start">Above 95%</text><text x="1086" y="680" font-size="24" font-weight="500" fill="#525252" text-anchor="start">Many developers accept</text><text x="1086" y="712" font-size="24" font-weight="500" fill="#525252" text-anchor="start">this as a winner.</text><line x1="80" y1="846" x2="1520" y2="846" stroke="#E5E5E5" stroke-width="2"/><text x="80" y="880" font-size="22" font-weight="500" fill="#525252" text-anchor="start">Source: RevenueCat docs, reading experiment results (revenuecat.com/docs/tools/experiments-v1)</text></svg>