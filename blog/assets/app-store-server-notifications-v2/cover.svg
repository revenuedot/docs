<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d"><title id="t">Structure of an App Store Server Notifications V2 body: a signed payload containing notificationType, subtype and a data object with signed transaction and renewal info</title><desc id="d">Structure of an App Store Server Notifications V2 body: a signed payload containing notificationType, subtype and a data object with signed transaction and renewal info</desc><rect width="1600" height="900" fill="#FFFFFF"/><rect x="100" y="100" width="22" height="22" fill="#F7B500"/><text x="138" y="120" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#0A0A0A" text-anchor="start">REVENUEDOT</text><text x="100" y="330" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="62" font-weight="800" fill="#0A0A0A" text-anchor="start">App Store Server</text><text x="100" y="406" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="62" font-weight="800" fill="#0A0A0A" text-anchor="start">Notifications V2</text><text x="100" y="500" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="30" font-weight="400" fill="#525252" text-anchor="start">Setup, every notification type,</text><text x="100" y="546" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="30" font-weight="400" fill="#525252" text-anchor="start">and how RevenueDot handles them</text><line x1="100" y1="800" x2="1500" y2="800" stroke="#E5E5E5" stroke-width="2"/><text x="100" y="850" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#525252" text-anchor="start">revenuedot.app/blog</text><rect x="900" y="150" width="600" height="610" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="3"/><rect x="914" y="164" width="14" height="14" fill="#F7B500"/><text x="940" y="184" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#0A0A0A" text-anchor="sta