<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" width="1600" height="640" role="img" aria-labelledby="t d"><title id="t">Forwarding App Store notifications during a migration</title><desc id="d">Apple sends one notification to RevenueDot. RevenueDot applies it, sends webhooks to your backend, and forwards the exact body to RevenueCat&#x27;s notification URL.</desc><rect width="1600" height="640" fill="#FFFFFF"/><rect x="60" y="250" width="300" height="150" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"/><text x="210.0" y="314.92" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#0A0A0A" text-anchor="middle">Apple</text><text x="210.0" y="350.92" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#525252" text-anchor="middle">notifications V2</text><rect x="560" y="250" width="420" height="150" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="3"/><rect x="574" y="264" width="14" height="14" fill="#F7B500"/><text x="770.0" y="314.92" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#0A0A0A" text-anchor="middle">RevenueDot</text><text x="770.0" y="350.92" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#525252" text-anchor="middle">stores, verifies, applies</text><rect x="1180" y="120" width="360" height="130" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"/><text x="1360.0" y="174.92" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#0A0A0A" text-anchor="middle">RevenueCat URL</text><text x="1360.0" y="210.92" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#525252" text-anchor="middle">exact body, 10 s timeout</text><rect x="1180" y="400" width="360" height="130" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"/><text x="1360.0" y="454.92" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#0A0A0A" text-anchor="middle">Your backend</text><text x="1360.0" y="490.92" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#525252" text-anchor="middle">RevenueDot webhook</text><line x1="360" y1="325" x2="560" y2="325" stroke="#0A0A0A" stroke-width="3"/><polygon points="560,325 544.0,333.0 544.0,317.0" fill="#0A0A0A"/><line x1="980" y1="300" x2="1180" y2="200" stroke="#0A0A0A" stroke-width="3"/><polygon points="1180,200 1169.3,214.3 1162.1,200.0" fill="#0A0A0A"/><line x1="980" y1="350" x2="1180" y2="450" stroke="#0A0A0A" stroke-width="3"/><polygon points="1180,450 1162.1,450.0 1169.3,435.7" fill="#0A0A0A"/><text x="460" y="300" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0A0A0A" text-anchor="middle">1. POST</text><text x="990" y="205" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0A0A0A" text-anchor="middle">2. forward</text><text x="990" y="480" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0A0A0A" text-anchor="middle">3. webhook</text><text x="60" y="590" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#525252" text-anchor="start">Apple allows one production URL per app, so one system must receive and forward.</text></svg>