<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" width="1600" height="520" role="img" aria-labelledby="t d"><title id="t">Apple&#x27;s retry schedule for version 2 notifications</title><desc id="d">After a failed delivery, Apple retries five times, at 1, 12, 24, 48 and 72 hours after the previous attempt, in production only.</desc><rect width="1600" height="520" fill="#FFFFFF"/><text x="60" y="100" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#0A0A0A" text-anchor="start">Answer 200 to every verified notification. Apple retries anything else.</text><line x1="170" y1="260" x2="1470" y2="260" stroke="#0A0A0A" stroke-width="3"/><rect x="158" y="248" width="24" height="24" fill="#F7B500" stroke="#F7B500" stroke-width="2"/><text x="170" y="320" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#0A0A0A" text-anchor="middle">First attempt</text><text x="170" y="356" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#525252" text-anchor="middle">sent</text><rect x="418" y="248" width="24" height="24" fill="#0A0A0A" stroke="#0A0A0A" stroke-width="2"/><text x="430" y="320" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#0A0A0A" text-anchor="middle">+1 hour</text><text x="430" y="356" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#525252" text-anchor="middle">retry 1</text><rect x="678" y="248" width="24" height="24" fill="#0A0A0A" stroke="#0A0A0A" stroke-width="2"/><text x="690" y="320" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#0A0A0A" text-anchor="middle">+12 hours</text><text x="690" y="356" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#525252" text-anchor="middle">retry 2</text><rect x="938" y="248" width="24" height="24" fill="#0A0A0A" stroke="#0A0A0A" stroke-width="2"/><text x="950" y="320" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#0A0A0A" text-anchor="middle">+24 hours</text><text x="950" y="356" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#525252" text-anchor="middle">retry 3</text><rect x="1198" y="248" width="24" height="24" fill="#0A0A0A" stroke="#0A0A0A" stroke-width="2"/><text x="1210" y="320" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#0A0A0A" text-anchor="middle">+48 hours</text><text x="1210" y="356" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#525252" text-anchor="middle">retry 4</text><rect x="1458" y="248" width="24" height="24" fill="#0A0A0A" stroke="#0A0A0A" stroke-width="2"/><text x="1470" y="320" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#0A0A0A" text-anchor="middle">+72 hours</text><text x="1470" y="356" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#525252" text-anchor="middle">retry 5</text><text x="60" y="450" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#525252" text-anchor="start">Each retry waits from the previous attempt. The sandbox gets one attempt and no retries.</text></svg>