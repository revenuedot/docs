<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d" font-family="Manrope, Helvetica, Arial, sans-serif"><title id="t">How to sell a lifetime purchase next to a subscription</title><desc id="d">A lifetime non-consumable and monthly and annual subscriptions all point to one pro entitlement, with notes on refunds, Family Sharing and subscribers who buy lifetime.</desc><rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/><rect x="80" y="56" width="64" height="10" fill="#F7B500"/><text x="80" y="170" font-size="64" font-weight="800" fill="#0A0A0A">Sell lifetime next to</text><text x="80" y="245" font-size="64" font-weight="800" fill="#0A0A0A">a subscription</text><text x="80" y="305" font-size="28" font-weight="500" fill="#525252">Different product types, one entitlement your app checks</text><rect x="80" y="360" width="440" height="110" fill="none" stroke="#0A0A0A" stroke-width="2"/><text x="108" y="410" font-size="30" font-weight="800" fill="#0A0A0A">pro_monthly</text><text x="108" y="446" font-size="22" font-weight="500" fill="#525252">Auto-renewable, subscription group</text><rect x="80" y="500" width="440" height="110" fill="none" stroke="#0A0A0A" stroke-width="2"/><text x="108" y="550" font-size="30" font-weight="800" fill="#0A0A0A">pro_annual</text><text x="108" y="586" font-size="22" font-weight="500" fill="#525252">Auto-renewable, subscription group</text><rect x="80" y="640" width="440" height="110" fill="#FFF8E1" stroke="#F7B500" stroke-width="3"/><text x="108" y="690" font-size="30" font-weight="800" fill="#0A0A0A">pro_lifetime</text><text x="108" y="726" font-size="22" font-weight="500" fill="#525252">Non-consumable / one-time product</text><line x1="520" y1="415" x2="700" y2="545" stroke="#0A0A0A" stroke-width="2"/><line x1="520" y1="555" x2="700" y2="555" stroke="#0A0A0A" stroke-width="2"/><line x1="520" y1="695" x2="700" y2="565" stroke="#F7B500" stroke-width="3"/><rect x="700" y="490" width="260" height="130" fill="#0A0A0A"/><text x="830" y="548" font-size="22" font-weight="500" fill="#FFFFFF" text-anchor="middle">entitlement</text><text x="830" y="592" font-size="40" font-weight="800" fill="#F7B500" text-anchor="middle">pro</text><rect x="1030" y="400" width="14" height="14" fill="#F7B500"/><text x="1060" y="418" font-size="26" font-weight="500" fill="#0A0A0A">Subscriber buys lifetime:</text><text x="1060" y="452" font-size="26" font-weight="500" fill="#0A0A0A">they must cancel the plan</text><rect x="1030" y="510" width="14" height="14" fill="#F7B500"/><text x="1060" y="528" font-size="26" font-weight="500" fill="#0A0A0A">Google: acknowledge in 3 days</text><rect x="1030" y="590" width="14" height="14" fill="#F7B500"/><text x="1060" y="608" font-size="26" font-weight="500" fill="#0A0A0A">Refund ends lifetime access</text><rect x="1030" y="670" width="14" height="14" fill="#F7B500"/><text x="1060" y="688" font-size="26" font-weight="500" fill="#0A0A0A">Family Sharing: cannot undo</text><line x1="80" y1="846" x2="1520" y2="846" stroke="#E5E5E5" stroke-width="2"/><text x="80" y="880" font-size="22" font-weight="500" fill="#525252">Sources: Apple App Store Connect Help and StoreKit docs, Google Play Billing docs</text></svg>
