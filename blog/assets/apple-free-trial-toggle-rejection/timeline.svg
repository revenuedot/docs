<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d" font-family="Manrope, Helvetica, Arial, sans-serif"><title id="t">How the toggle ban unfolded in 2026</title><desc id="d">Timeline: mid-January 2026 first rejections; April 23 Flo Health uses dedicated 14-day trial plans; June 3 Superwall reports Apple says toggles are not allowed.</desc><rect width="1600" height="900" fill="#FFFFFF"/><rect x="80" y="56" width="64" height="10" fill="#F7B500"/><text x="80" y="128" font-size="44" font-weight="800" fill="#0A0A0A" text-anchor="start">How the toggle ban unfolded in 2026</text><text x="80" y="176" font-size="26" font-weight="500" fill="#525252" text-anchor="start">Three dated events, each from a published source.</text><line x1="80" y1="846" x2="1520" y2="846" stroke="#E5E5E5" stroke-width="2"/><text x="80" y="880" font-size="22" font-weight="500" fill="#525252" text-anchor="start">Sources: RevenueCat blog (rip-toggle-paywall) and Superwall blog, checked October 2026</text><line x1="160" y1="420" x2="1440" y2="420" stroke="#0A0A0A" stroke-width="4"/><rect x="236" y="396" width="48" height="48" fill="#F7B500"/><text x="260" y="350" font-size="34" font-weight="800" fill="#0A0A0A" text-anchor="middle">Mid-January 2026</text><text x="260" y="500" font-size="26" font-weight="500" fill="#0A0A0A" text-anchor="middle">First public reports of</text><text x="260" y="536" font-size="26" font-weight="500" fill="#0A0A0A" text-anchor="middle">3.1.2 rejections for</text><text x="260" y="572" font-size="26" font-weight="500" fill="#0A0A0A" text-anchor="middle">toggle paywalls, with no</text><text x="260" y="608" font-size="26" font-weight="500" fill="#0A0A0A" text-anchor="middle">prior notice.</text><rect x="776" y="396" width="48" height="48" fill="#F7B500"/><text x="800" y="350" font-size="34" font-weight="800" fill="#0A0A0A" text-anchor="middle">April 23, 2026</text><text x="800" y="500" font-size="26" font-weight="500" fill="#0A0A0A" text-anchor="middle">RevenueCat update: Flo</text><text x="800" y="536" font-size="26" font-weight="500" fill="#0A0A0A" text-anchor="middle">Health replaces its</text><text x="800" y="572" font-size="26" font-weight="500" fill="#0A0A0A" text-anchor="middle">toggles with dedicated</text><text x="800" y="608" font-size="26" font-weight="500" fill="#0A0A0A" text-anchor="middle">14-day trial plans.</text><rect x="1316" y="396" width="48" height="48" fill="#F7B500"/><text x="1340" y="350" font-size="34" font-weight="800" fill="#0A0A0A" text-anchor="middle">June 3, 2026</text><text x="1340" y="500" font-size="26" font-weight="500" fill="#0A0A0A" text-anchor="middle">Superwall reports Apple</text><text x="1340" y="536" font-size="26" font-weight="500" fill="#0A0A0A" text-anchor="middle">says toggles are not</text><text x="1340" y="572" font-size="26" font-weight="500" fill="#0A0A0A" text-anchor="middle">allowed and A/B tests</text><text x="1340" y="608" font-size="26" font-weight="500" fill="#0A0A0A" text-anchor="middle">are.</text></svg>
