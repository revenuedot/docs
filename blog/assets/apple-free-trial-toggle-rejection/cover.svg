<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d" font-family="Manrope, Helvetica, Arial, sans-serif"><title id="t">Replace the trial toggle with a plan card</title><desc id="d">Left: a trial on/off switch marked rejected. Right: two plan cards, annual with a 3-day trial and weekly without, marked ships.</desc><rect width="1600" height="900" fill="#FFFFFF"/><rect x="80" y="56" width="64" height="10" fill="#F7B500"/><text x="80" y="150" font-size="60" font-weight="800" fill="#0A0A0A" text-anchor="start">Replace the trial toggle with a plan card</text><text x="80" y="205" font-size="30" font-weight="500" fill="#525252" text-anchor="start">Apple rejects the switch under guideline 3.1.2. A separate plan with a trial ships.</text><rect x="80" y="290" width="620" height="380" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"/><text x="110" y="345" font-size="30" font-weight="800" fill="#0A0A0A" text-anchor="start">Rejected</text><text x="110" y="385" font-size="24" font-weight="500" fill="#525252" text-anchor="start">A switch adds or removes the free trial</text><text x="110" y="490" font-size="30" font-weight="500" fill="#0A0A0A" text-anchor="start">Free trial enabled</text><rect x="500" y="455" width="150" height="60" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="4"/><rect x="510" y="465" width="40" height="40" fill="#0A0A0A"/><text x="110" y="590" font-size="24" font-weight="500" fill="#525252" text-anchor="start">Apple called this design confusing in</text><text x="110" y="622" font-size="24" font-weight="500" fill="#525252" text-anchor="start">its 3.1.2 rejection notice.</text><line x1="720" y1="480" x2="860" y2="480" stroke="#0A0A0A" stroke-width="3"/><polygon points="860,480 842,470 842,490" fill="#0A0A0A"/><rect x="880" y="290" width="640" height="380" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="4"/><text x="910" y="345" font-size="30" font-weight="800" fill="#0A0A0A" text-anchor="start">Ships</text><text x="910" y="385" font-size="24" font-weight="500" fill="#525252" text-anchor="start">Each plan states its own terms</text><rect x="910" y="420" width="280" height="220" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="4"/><rect x="1210" y="420" width="280" height="220" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"/><rect x="930" y="404" width="110" height="32" fill="#F7B500"/><text x="985" y="428" font-size="22" font-weight="800" fill="#0A0A0A" text-anchor="middle">BEST</text><text x="930" y="500" font-size="30" font-weight="800" fill="#0A0A0A" text-anchor="start">Annual</text><text x="930" y="545" font-size="24" font-weight="500" fill="#525252" text-anchor="start">3 days free</text><text x="930" y="590" font-size="24" font-weight="500" fill="#525252" text-anchor="start">then $39.99/yr</text><text x="1230" y="480" font-size="30" font-weight="800" fill="#0A0A0A" text-anchor="start">Weekly</text><text x="1230" y="525" font-size="24" font-weight="500" fill="#525252" text-anchor="start">No trial</text><text x="1230" y="570" font-size="24" font-weight="500" fill="#525252" text-anchor="start">$4.99/wk</text><line x1="80" y1="846" x2="1520" y2="846" stroke="#E5E5E5" stroke-width="2"/><text x="80" y="880" font-size="22" font-weight="500" fill="#525252" text-anchor="start">Sources: RevenueCat, Adapty, Superwall, 2026. Apple App Review Guidelines, updated June 8, 2026</text></svg>
