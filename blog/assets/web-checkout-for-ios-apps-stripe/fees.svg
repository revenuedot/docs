<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" width="1600" height="720" role="img" aria-labelledby="t d"><title id="t">What you keep from a $9.99 monthly subscription</title><desc id="d">Net amount per month after fees, before tax: Apple at 30 percent leaves 6.99 dollars, Apple at 15 percent leaves 8.49, Stripe card fees leave 9.40, and 9.33 with Stripe Billing at 0.7 percent.</desc><rect width="1600" height="720" fill="#FFFFFF"/><text x="100" y="90" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#0A0A0A" text-anchor="start">You keep, per $9.99 month, before tax</text><text x="100" y="170" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#0A0A0A" text-anchor="start">Apple, 30% commission</text><rect x="100" y="186" width="629.7297297297297" height="54" fill="#E5E5E5" stroke="#E5E5E5" stroke-width="2"/><text x="745.7297297297297" y="226" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#0A0A0A" text-anchor="start">$6.99</text><text x="100" y="300" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#0A0A0A" text-anchor="start">Apple, 15% commission</text><rect x="100" y="316" width="764.8648648648649" height="54" fill="#E5E5E5" stroke="#E5E5E5" stroke-width="2"/><text x="880.8648648648649" y="356" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#0A0A0A" text-anchor="start">$8.49</text><text x="100" y="430" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#0A0A0A" text-anchor="start">Stripe card: 2.9% + 30 cents</text><rect x="100" y="446" width="846.8468468468468" height="54" fill="#0A0A0A" stroke="#0A0A0A" stroke-width="2"/><text x="962.8468468468468" y="486" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#0A0A0A" text-anchor="start">$9.40</text><text x="100" y="560" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#0A0A0A" text-anchor="start">Stripe card + Billing at 0.7%</text><rect x="100" y="576" width="840.5405405405405" height="54" fill="#0A0A0A" stroke="#0A0A0A" stroke-width="2"/><text x="956.5405405405405" y="616" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#0A0A0A" text-anchor="start">$9.33</text><rect x="100" y="668" width="22" height="22" fill="#F7B500" stroke="#F7B500" stroke-width="2"/><text x="136" y="686" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#525252" text-anchor="start">Stripe&#x27;s fee varies by country, card and plan. Apple&#x27;s by program and subscriber tenure.</text></svg>