<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 560" width="1600" height="560" role="img" aria-labelledby="t d"><title id="t">Timeline of the US external link ruling</title><desc id="d">April 30, 2025 contempt order; December 11, 2025 Ninth Circuit decision; June 30, 2026 Supreme Court agrees to hear the appeal; October 2026 term begins.</desc><rect width="1600" height="560" fill="#FFFFFF"/><text x="60" y="100" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#0A0A0A" text-anchor="start">The US link-out rules, step by step</text><line x1="100" y1="250" x2="1500" y2="250" stroke="#0A0A0A" stroke-width="3"/><rect x="148" y="238" width="24" height="24" fill="#0A0A0A" stroke="#0A0A0A" stroke-width="2"/><text x="160" y="310" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#0A0A0A" text-anchor="start">Apr 30, 2025</text><text x="160" y="350" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#525252" text-anchor="start">District court: no</text><text x="160" y="384" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#525252" text-anchor="start">commission on links</text><rect x="528" y="238" width="24" height="24" fill="#0A0A0A" stroke="#0A0A0A" stroke-width="2"/><text x="540" y="310" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#0A0A0A" text-anchor="start">Dec 11, 2025</text><text x="540" y="350" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#525252" text-anchor="start">Ninth Circuit: links stay,</text><text x="540" y="384" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#525252" text-anchor="start">fee rate to be set</text><rect x="908" y="238" width="24" height="24" fill="#0A0A0A" stroke="#0A0A0A" stroke-width="2"/><text x="920" y="310" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#0A0A0A" text-anchor="start">Jun 30, 2026</text><text x="920" y="350" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#525252" text-anchor="start">Supreme Court takes</text><text x="920" y="384" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#525252" text-anchor="start">Apple&#x27;s appeal</text><rect x="1288" y="238" width="24" height="24" fill="#0A0A0A" stroke="#0A0A0A" stroke-width="2"/><text x="1300" y="310" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#0A0A0A" text-anchor="start">Oct 2026</text><text x="1300" y="350" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#525252" text-anchor="start">Court term begins</text><text x="60" y="500" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#525252" text-anchor="start">Status as of October 1, 2026. Apple charges no commission on US link-outs while the rate is undecided.</text></svg>