<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d" font-family="Manrope, Helvetica, Arial, sans-serif"><title id="t">How to handle Google Play refunds and chargebacks</title><desc id="d">A Google Play refund travels two paths to your server: a voided purchase notification within moments, and the Voided Purchases API once a day for the last 30 days.</desc><rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/><rect x="80" y="56" width="64" height="10" fill="#F7B500"/><text x="80" y="170" font-size="64" font-weight="800" fill="#0A0A0A">Google Play refunds</text><text x="80" y="245" font-size="64" font-weight="800" fill="#0A0A0A">and chargebacks</text><text x="80" y="305" font-size="28" font-weight="500" fill="#525252">Two signals tell your server; your server removes access</text><rect x="80" y="350" width="700" height="440" fill="none" stroke="#0A0A0A" stroke-width="2"/><text x="108" y="402" font-size="34" font-weight="800" fill="#0A0A0A">Within moments</text><text x="108" y="438" font-size="22" font-weight="500" fill="#525252">Real-time developer notification</text><rect x="108" y="472" width="14" height="14" fill="#F7B500"/><text x="138" y="490" font-size="26" font-weight="500" fill="#0A0A0A">voidedPurchaseNotification</text><rect x="108" y="532" width="14" height="14" fill="#F7B500"/><text x="138" y="550" font-size="26" font-weight="500" fill="#0A0A0A">Purchase token and order ID</text><rect x="108" y="592" width="14" height="14" fill="#F7B500"/><text x="138" y="610" font-size="26" font-weight="500" fill="#0A0A0A">productType: 1 subscription, 2 one-time</text><rect x="108" y="652" width="14" height="14" fill="#F7B500"/><text x="138" y="670" font-size="26" font-weight="500" fill="#0A0A0A">refundType: 1 full, 2 by quantity</text><rect x="108" y="712" width="14" height="14" fill="#F7B500"/><text x="138" y="730" font-size="26" font-weight="500" fill="#0A0A0A">Chargebacks: SUBSCRIPTION_REVOKED</text><rect x="820" y="350" width="700" height="440" fill="none" stroke="#0A0A0A" stroke-width="2"/><text x="848" y="402" font-size="34" font-weight="800" fill="#0A0A0A">Once a day</text><text x="848" y="438" font-size="22" font-weight="500" fill="#525252">Voided Purchases API, last 30 days</text><rect x="848" y="472" width="14" height="14" fill="#F7B500"/><text x="878" y="490" font-size="26" font-weight="500" fill="#0A0A0A">Use type=1 to include subscriptions</text><rect x="848" y="532" width="14" height="14" fill="#F7B500"/><text x="878" y="550" font-size="26" font-weight="500" fill="#0A0A0A">Needs View financial data</text><rect x="848" y="592" width="14" height="14" fill="#F7B500"/><text x="878" y="610" font-size="26" font-weight="500" fill="#0A0A0A">6,000 queries a day per app</text><rect x="848" y="652" width="14" height="14" fill="#F7B500"/><text x="878" y="670" font-size="26" font-weight="500" fill="#0A0A0A">Developer refunds only if revoked</text><rect x="848" y="712" width="14" height="14" fill="#F7B500"/><text x="878" y="730" font-size="26" font-weight="500" fill="#0A0A0A">Catches missed notifications</text><line x1="80" y1="846" x2="1520" y2="846" stroke="#E5E5E5" stroke-width="2"/><text x="80" y="880" font-size="22" font-weight="500" fill="#525252">Sources: Android Developers, Google Play Developer API and Google Play Help, checked October 2026</text></svg>