<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d" font-family="Manrope, Helvetica, Arial, sans-serif"><title id="t">One subscription on iOS, Android and the web</title><desc id="d">One customer account with an App Store, a Google Play and a web subscription all unlocking the same pro entitlement.</desc><rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/><rect x="80" y="56" width="64" height="10" fill="#F7B500"/><text x="80" y="170" font-size="64" font-weight="800" fill="#0A0A0A">One subscription on iOS,</text><text x="80" y="245" font-size="64" font-weight="800" fill="#0A0A0A">Android and the web</text><text x="80" y="305" font-size="28" font-weight="500" fill="#525252">One account ID and one entitlement, whichever store bills</text><rect x="80" y="350" width="440" height="150" fill="none" stroke="#0A0A0A" stroke-width="2"/><text x="108" y="408" font-size="34" font-weight="800" fill="#0A0A0A">App Store</text><rect x="108" y="440" width="14" height="14" fill="#F7B500"/><text x="138" y="458" font-size="26" font-weight="500" fill="#0A0A0A">pro_monthly</text><line x1="300" y1="500" x2="300" y2="600" stroke="#0A0A0A" stroke-width="2"/><polygon points="291,588 309,588 300,604" fill="#0A0A0A"/><rect x="580" y="350" width="440" height="150" fill="none" stroke="#0A0A0A" stroke-width="2"/><text x="608" y="408" font-size="34" font-weight="800" fill="#0A0A0A">Google Play</text><rect x="608" y="440" width="14" height="14" fill="#F7B500"/><text x="638" y="458" font-size="26" font-weight="500" fill="#0A0A0A">pro:monthly</text><line x1="800" y1="500" x2="800" y2="600" stroke="#0A0A0A" stroke-width="2"/><polygon points="791,588 809,588 800,604" fill="#0A0A0A"/><rect x="1080" y="350" width="440" height="150" fill="none" stroke="#0A0A0A" stroke-width="2"/><text x="1108" y="408" font-size="34" font-weight="800" fill="#0A0A0A">Web (Stripe)</text><rect x="1108" y="440" width="14" height="14" fill="#F7B500"/><text x="1138" y="458" font-size="26" font-weight="500" fill="#0A0A0A">pro_monthly_web</text><line x1="1300" y1="500" x2="1300" y2="600" stroke="#0A0A0A" stroke-width="2"/><polygon points="1291,588 1309,588 1300,604" fill="#0A0A0A"/><rect x="80" y="606" width="1440" height="200" fill="#0A0A0A"/><text x="120" y="672" font-size="34" font-weight="800" fill="#FFFFFF">One customer: user_42</text><text x="120" y="716" font-size="26" font-weight="500" fill="#D4D4D4">logIn("user_42") on iPhone, Android and the web</text><rect x="120" y="748" width="14" height="14" fill="#F7B500"/><text x="150" y="766" font-size="26" font-weight="700" fill="#FFFFFF">Entitlement pro: active, from any store</text><line x1="80" y1="846" x2="1520" y2="846" stroke="#E5E5E5" stroke-width="2"/><text x="80" y="880" font-size="22" font-weight="500" fill="#525252">Sources: Apple App Review Guideline 3.1.3(b), Google Play Payments policy, RevenueCat docs</text></svg>