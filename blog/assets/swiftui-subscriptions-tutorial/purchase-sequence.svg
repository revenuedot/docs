<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 826" width="1600" height="826" role="img" aria-labelledby="t d"><title id="t">Purchase sequence in a SwiftUI app</title><desc id="d">The app asks RevenueDot for offerings, StoreKit shows the payment sheet, the SDK posts the signed transaction to RevenueDot, RevenueDot verifies it with Apple and returns customer info.</desc><rect width="1600" height="826" fill="#FFFFFF"/><rect x="40.0" y="70" width="300" height="76" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"/><text x="190.0" y="115.92" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#0A0A0A" text-anchor="middle">App + SDK</text><line x1="190.0" y1="146" x2="190.0" y2="806" stroke="#E5E5E5" stroke-width="2" stroke-dasharray="8 8"/><rect x="446.66666666666674" y="70" width="300" height="76" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"/><text x="596.6666666666667" y="115.92" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#0A0A0A" text-anchor="middle">StoreKit 2</text><line x1="596.6666666666667" y1="146" x2="596.6666666666667" y2="806" stroke="#E5E5E5" stroke-width="2" stroke-dasharray="8 8"/><rect x="853.3333333333334" y="70" width="300" height="76" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="3"/><rect x="867.3333333333334" y="84" width="14" height="14" fill="#F7B500"/><text x="1003.3333333333334" y="115.92" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#0A0A0A" text-anchor="middle">RevenueDot</text><line x1="1003.3333333333334" y1="146" x2="1003.3333333333334" y2="806" stroke="#E5E5E5" stroke-width="2" stroke-dasharray="8 8"/><rect x="1260.0" y="70" width="300" height="76" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"/><text x="1410.0" y="115.92" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#0A0A0A" text-anchor="middle">Apple</text><line x1="1410.0" y1="146" x2="1410.0" y2="806" stroke="#E5E5E5" stroke-width="2" stroke-dasharray="8 8"/><line x1="190.0" y1="230.4" x2="1003.3333333333334" y2="230.4" stroke="#0A0A0A" stroke-width="3"/><polygon points="1003.3333333333334,230.4 987.3,238.4 987.3,222.4" fill="#0A0A0A"/><text x="596.6666666666667" y="208.4" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#0A0A0A" text-anchor="middle">1. offerings()</text><line x1="1003.3333333333334" y1="318.4" x2="190.0" y2="318.4" stroke="#525252" stroke-width="3" stroke-dasharray="10 8"/><polygon points="190.0,318.4 206.0,310.4 206.0,326.4" fill="#525252"/><text x="596.6666666666667" y="296.4" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#525252" text-anchor="middle">packages + product ids</text><line x1="190.0" y1="406.4" x2="596.6666666666667" y2="406.4" stroke="#0A0A0A" stroke-width="3"/><polygon points="596.6666666666667,406.4 580.7,414.4 580.7,398.4" fill="#0A0A0A"/><text x="393.33333333333337" y="384.4" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#0A0A0A" text-anchor="middle">2. purchase(package:)</text><line x1="596.6666666666667" y1="494.4" x2="190.0" y2="494.4" stroke="#525252" stroke-width="3" stroke-dasharray="10 8"/><polygon points="190.0,494.4 206.0,486.4 206.0,502.4" fill="#525252"/><text x="393.33333333333337" y="472.4" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#525252" text-anchor="middle">signed transaction</text><line x1="190.0" y1="582.4" x2="1003.3333333333334" y2="582.4" stroke="#0A0A0A" stroke-width="3"/><polygon points="1003.3333333333334,582.4 987.3,590.4 987.3,574.4" fill="#0A0A0A"/><text x="596.6666666666667" y="560.4" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#0A0A0A" text-anchor="middle">3. POST /v1/receipts</text><line x1="1003.3333333333334" y1="670.4" x2="1410.0" y2="670.4" stroke="#0A0A0A" st