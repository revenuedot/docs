<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d" font-family="Manrope, Helvetica, Arial, sans-serif"><title id="t">From ad click to app access</title><desc id="d">A visitor clicks an ad, answers a quiz, pays on Stripe Checkout, opens a redemption link and gets the entitlement in the app.</desc><rect width="1600" height="900" fill="#FFFFFF"/><rect x="80" y="56" width="64" height="10" fill="#F7B500"/><text x="80" y="150" font-size="60" font-weight="800" fill="#0A0A0A" text-anchor="start">From ad click to app access in six steps</text><text x="80" y="205" font-size="30" font-weight="500" fill="#525252" text-anchor="start">The quiz and checkout run on the web. A link hands the purchase to the app.</text><rect x="80" y="270" width="300" height="170" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2"/><text x="96" y="349" font-size="30" font-weight="800" fill="#0A0A0A" text-anchor="start">Ad click</text><text x="96" y="389" font-size="24" font-weight="500" fill="#525252" text-anchor="start">Meta or TikTok</text><line x1="390" y1="355" x2="436" y2="355" stroke="#0A0A0A" stroke-width="3"/><polygon points="450,355 432,345 432,365" fill="#0A0A0A"/><rect x="460" y="270" width="300" height="170" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2"/><text x="476" y="349" font-size="30" font-weight="800" fill="#0A0A0A" text-anchor="start">Quiz</text><text x="476" y="389" font-size="24" font-weight="500" fill="#525252" text-anchor="start">Answers saved</text><line x1="770" y1="355" x2="816" y2="355" stroke="#0A0A0A" stroke-width="3"/><polygon points="830,355 812,345 812,365" fill="#0A0A0A"/><rect x="840" y="270" width="300" height="170" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2"/><text x="856" y="349" font-size="30" font-weight="800" fill="#0A0A0A" text-anchor="start">Paywall</text><text x="856" y="389" font-size="24" font-weight="500" fill="#525252" text-anchor="start">Plans and discount</text><line x1="1150" y1="355" x2="1196" y2="355" stroke="#0A0A0A" stroke-width="3"/><polygon points="1210,355 1192,345 1192,365" fill="#0A0A0A"/><rect x="1220" y="270" width="300" height="170" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="4"/><text x="1236" y="349" font-size="30" font-weight="800" fill="#0A0A0A" text-anchor="start">Checkout</text><text x="1236" y="389" font-size="24" font-weight="500" fill="#525252" text-anchor="start">Stripe, your own</text><line x1="1370" y1="440" x2="1370" y2="485" stroke="#0A0A0A" stroke-width="3"/><line x1="1370" y1="485" x2="230" y2="485" stroke="#0A0A0A" stroke-width="3"/><line x1="230" y1="485" x2="230" y2="514" stroke="#0A0A0A" stroke-width="3"/><polygon points="230,528 220,510 240,510" fill="#0A0A0A"/><rect x="80" y="530" width="300" height="170" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2"/><text x="96" y="609" font-size="30" font-weight="800" fill="#0A0A0A" text-anchor="start">Redemption link</text><text x="96" y="649" font-size="24" font-weight="500" fill="#525252" text-anchor="start">Email or page</text><line x1="390" y1="615" x2="436" y2="615" stroke="#0A0A0A" stroke-width="3"/><polygon points="450,615 432,605 432,625" fill="#0A0A0A"/><rect x="460" y="530" width="300" height="170" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2"/><text x="476" y="609" font-size="30" font-weight="800" fill="#0A0A0A" text-anchor="start">App opens</text><text x="476" y="649" font-size="24" font-weight="500" fill="#525252" text-anchor="start">redeemWebPurchase</text><line x1="770" y1="615" x2="816" y2="615" stroke="#0A0A0A" stroke-width="3"/><polygon points="830,615 812,605 812,625" fill="#0A0A0A"/><rect x="840" y="530" width="300" height="170" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="4"/><text x="856" y="609" font-size="30" font-weight="800" fill="#0A0A0A" text-anchor="start">Entitlement</text><text x="856" y="649" font-size="24" font-weight="500" fill="#525252" text-anchor="start">Active at once</text><line x1="80" y1="846" x2="1520" y2="846" str