<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d" font-family="Manrope, Helvetica, Arial, sans-serif"><title id="t">Where funnel events go</title><desc id="d">Funnel purchase becomes Purchase in Meta, purchase in Google Tag Manager, PURCHASE in Branch and rd_funnel_purchase in AppsFlyer. TikTok click ids ride along in click_ids.</desc><rect width="1600" height="900" fill="#FFFFFF"/><rect x="80" y="56" width="64" height="10" fill="#F7B500"/><text x="80" y="128" font-size="44" font-weight="800" fill="#0A0A0A" text-anchor="start">Where a funnel purchase is sent</text><text x="80" y="176" font-size="26" font-weight="500" fill="#525252" text-anchor="start">Turn on the three funnel event types on each integration to receive them.</text><rect x="80" y="220" width="620" height="84" fill="#0A0A0A" stroke="#0A0A0A" stroke-width="2"/><rect x="700" y="220" width="820" height="84" fill="#0A0A0A" stroke="#0A0A0A" stroke-width="2"/><text x="110" y="274" font-size="28" font-weight="800" fill="#FFFFFF" text-anchor="start">Network</text><text x="730" y="274" font-size="28" font-weight="800" fill="#FFFFFF" text-anchor="start">Funnel purchase becomes</text><rect x="80" y="304" width="620" height="84" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"/><rect x="700" y="304" width="820" height="84" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"/><text x="110" y="358" font-size="28" font-weight="500" fill="#0A0A0A" text-anchor="start">Meta (Conversions API)</text><text x="730" y="358" font-size="28" font-weight="500" fill="#0A0A0A" text-anchor="start">Purchase with the dollar value</text><rect x="80" y="388" width="620" height="84" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"/><rect x="700" y="388" width="820" height="84" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"/><text x="110" y="442" font-size="28" font-weight="500" fill="#0A0A0A" text-anchor="start">Google Tag Manager (GA4)</text><text x="730" y="442" font-size="28" font-weight="500" fill="#0A0A0A" text-anchor="start">purchase with the dollar value</text><rect x="80" y="472" width="620" height="84" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"/><rect x="700" y="472" width="820" height="84" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"/><text x="110" y="526" font-size="28" font-weight="500" fill="#0A0A0A" text-anchor="start">Branch</text><text x="730" y="526" font-size="28" font-weight="500" fill="#0A0A0A" text-anchor="start">PURCHASE with the dollar revenue</text><rect x="80" y="556" width="620" height="84" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"/><rect x="700" y="556" width="820" height="84" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"/><text x="110" y="610" font-size="28" font-weight="500" fill="#0A0A0A" text-anchor="start">AppsFlyer</text><text x="730" y="610" font-size="28" font-weight="500" fill="#0A0A0A" text-anchor="start">rd_funnel_purchase with revenue</text><rect x="80" y="640" width="620" height="84" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"/><rect x="700" y="640" width="820" height="84" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"/><text x="110" y="694" font-size="28" font-weight="500" fill="#0A0A0A" text-anchor="start">TikTok</text><text x="730" y="694" font-size="28" font-weight="500" fill="#0A0A0A" text-anchor="start">ttclid in click_ids; send it yourself</text><line x1="80" y1="846" x2="1520" y2="846" stroke="#E5E5E5" stroke-width="2"/><text x="80" y="880" font-size="22" font-weight="500" fill="#525252" text-anchor="start">Source: revenuedot.app/docs/guides/integrations#funnel-events-to-ad-networks</text></svg>