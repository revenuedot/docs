<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d" font-family="Manrope, Helvetica, Arial, sans-serif"><title id="t">What Blinkist saw after it explained the trial</title><desc id="d">Bars: complaints down 55%, trial conversions up 23%, reminder opt-in from 6% to 74%.</desc><rect width="1600" height="900" fill="#FFFFFF"/><rect x="80" y="56" width="64" height="10" fill="#F7B500"/><text x="80" y="128" font-size="44" font-weight="800" fill="#0A0A0A" text-anchor="start">What Blinkist saw after it explained the trial</text><text x="80" y="176" font-size="26" font-weight="500" fill="#525252" text-anchor="start">A transparent trial, plus an offer to remind users before it ends.</text><line x1="80" y1="846" x2="1520" y2="846" stroke="#E5E5E5" stroke-width="2"/><text x="80" y="880" font-size="22" font-weight="500" fill="#525252" text-anchor="start">Source: Growth.design, Blinkist trial paywall challenge (growth.design/case-studies/trial-paywall-challenge)</text><text x="80" y="260" font-size="26" font-weight="800" fill="#0A0A0A" text-anchor="start">Customer complaints</text><text x="80" y="292" font-size="22" font-weight="500" fill="#525252" text-anchor="start">Change after the new trial paywall</text><rect x="620" y="238" width="536.25" height="52" fill="#0A0A0A"/><text x="1172.25" y="278" font-size="36" font-weight="800" fill="#0A0A0A" text-anchor="start">-55%</text><line x1="80" y1="350" x2="1520" y2="350" stroke="#E5E5E5" stroke-width="2"/><text x="80" y="390" font-size="26" font-weight="800" fill="#0A0A0A" text-anchor="start">Trial conversions</text><text x="80" y="422" font-size="22" font-weight="500" fill="#525252" text-anchor="start">Change after the new trial paywall</text><rect x="620" y="368" width="224.25" height="52" fill="#0A0A0A"/><text x="860.25" y="408" font-size="36" font-weight="800" fill="#0A0A0A" text-anchor="start">+23%</text><line x1="80" y1="480" x2="1520" y2="480" stroke="#E5E5E5" stroke-width="2"/><text x="80" y="520" font-size="26" font-weight="800" fill="#0A0A0A" text-anchor="start">Reminder opt-in before</text><text x="80" y="552" font-size="22" font-weight="500" fill="#525252" text-anchor="start">Share of users who opted in, old paywall</text><rect x="620" y="498" width="58.5" height="52" fill="#0A0A0A"/><text x="694.5" y="538" font-size="36" font-weight="800" fill="#0A0A0A" text-anchor="start">6%</text><line x1="80" y1="610" x2="1520" y2="610" stroke="#E5E5E5" stroke-width="2"/><text x="80" y="650" font-size="26" font-weight="800" fill="#0A0A0A" text-anchor="start">Reminder opt-in after</text><text x="80" y="682" font-size="22" font-weight="500" fill="#525252" text-anchor="start">Share of users who opted in, new paywall</text><rect x="620" y="628" width="721.5" height="52" fill="#0A0A0A"/><text x="1357.5" y="668" font-size="36" font-weight="800" fill="#0A0A0A" text-anchor="start">74%</text><line x1="80" y1="740" x2="1520" y2="740" stroke="#E5E5E5" stroke-width="2"/></svg>
