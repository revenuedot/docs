<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d" font-family="Manrope, Helvetica, Arial, sans-serif"><title id="t">Tell people when they will be charged</title><desc id="d">A trial timeline with three points: Today full access, Day 5 reminder, Day 7 charge.</desc><rect width="1600" height="900" fill="#FFFFFF"/><rect x="80" y="56" width="64" height="10" fill="#F7B500"/><text x="80" y="150" font-size="60" font-weight="800" fill="#0A0A0A" text-anchor="start">Tell people when they will be charged</text><text x="80" y="205" font-size="30" font-weight="500" fill="#525252" text-anchor="start">A three-step timeline answers the fear of forgetting to cancel.</text><line x1="260" y1="470" x2="1340" y2="470" stroke="#0A0A0A" stroke-width="4"/><rect x="236" y="446" width="48" height="48" fill="#F7B500"/><text x="260" y="400" font-size="44" font-weight="800" fill="#0A0A0A" text-anchor="middle">Today</text><text x="260" y="560" font-size="28" font-weight="500" fill="#0A0A0A" text-anchor="middle">Full access starts</text><rect x="1007" y="446" width="48" height="48" fill="#0A0A0A"/><text x="1031" y="400" font-size="44" font-weight="800" fill="#0A0A0A" text-anchor="middle">Day 5</text><text x="1031" y="560" font-size="28" font-weight="500" fill="#0A0A0A" text-anchor="middle">We send a reminder</text><rect x="1316" y="446" width="48" height="48" fill="#0A0A0A"/><text x="1340" y="400" font-size="44" font-weight="800" fill="#0A0A0A" text-anchor="middle">Day 7</text><text x="1340" y="560" font-size="28" font-weight="500" fill="#0A0A0A" text-anchor="middle">$39.99 is charged</text><rect x="80" y="660" width="1440" height="110" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"/><text x="110" y="708" font-size="30" font-weight="800" fill="#0A0A0A" text-anchor="start">Blinkist case study: +23% trial conversions and 55% fewer complaints.</text><text x="110" y="748" font-size="24" font-weight="500" fill="#525252" text-anchor="start">Growth.design, trial paywall challenge</text><line x1="80" y1="846" x2="1520" y2="846" stroke="#E5E5E5" stroke-width="2"/><text x="80" y="880" font-size="22" font-weight="500" fill="#525252" text-anchor="start">Example of a 7-day trial. RevenueDot blog, October 2026</text></svg>
