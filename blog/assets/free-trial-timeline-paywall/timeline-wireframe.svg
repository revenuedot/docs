<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d" font-family="Manrope, Helvetica, Arial, sans-serif"><title id="t">A timeline paywall in six parts</title><desc id="d">Phone wireframe: headline, three-step timeline with Today, Day 5 reminder and Day 7 charge, plan cards, and the button.</desc><rect width="1600" height="900" fill="#FFFFFF"/><rect x="80" y="56" width="64" height="10" fill="#F7B500"/><text x="80" y="128" font-size="44" font-weight="800" fill="#0A0A0A" text-anchor="start">A timeline paywall in six parts</text><text x="80" y="176" font-size="26" font-weight="500" fill="#525252" text-anchor="start">Same layout as the Trial timeline template in the RevenueDot gallery.</text><line x1="80" y1="846" x2="1520" y2="846" stroke="#E5E5E5" stroke-width="2"/><text x="80" y="880" font-size="22" font-weight="500" fill="#525252" text-anchor="start">Layout: RevenueDot Trial timeline template. Day numbers fit a 7-day trial.</text><rect x="140" y="200" width="420" height="630" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="4"/><rect x="310.0" y="210" width="80" height="10" fill="#0A0A0A"/><text x="164" y="262" font-size="26" font-weight="500" fill="#525252" text-anchor="start">X</text><text x="350.0" y="312" font-size="28" font-weight="800" fill="#0A0A0A" text-anchor="middle">How your free trial works</text><rect x="174" y="360" width="28" height="28" fill="#F7B500"/><text x="220" y="384" font-size="26" font-weight="800" fill="#0A0A0A" text-anchor="start">Today</text><text x="220" y="414" font-size="22" font-weight="500" fill="#525252" text-anchor="start">Full access to everything</text><line x1="188" y1="390" x2="188" y2="436" stroke="#0A0A0A" stroke-width="3"/><rect x="174" y="436" width="28" height="28" fill="#0A0A0A"/><text x="220" y="460" font-size="26" font-weight="800" fill="#0A0A0A" text-anchor="start">Day 5</text><text x="220" y="490" font-size="22" font-weight="500" fill="#525252" text-anchor="start">We remind you by notification</text><line x1="188" y1="466" x2="188" y2="512" stroke="#0A0A0A" stroke-width="3"/><rect x="174" y="512" width="28" height="28" fill="#0A0A0A"/><text x="220" y="536" font-size="26" font-weight="800" fill="#0A0A0A" text-anchor="start">Day 7</text><text x="220" y="566" font-size="22" font-weight="500" fill="#525252" text-anchor="start">You are charged $39.99</text><rect x="160" y="610" width="380" height="52" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="4"/><text x="180" y="644" font-size="24" font-weight="800" fill="#0A0A0A" text-anchor="start">Annual  $39.99/yr</text><rect x="160" y="672" width="380" height="40" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"/><text x="180" y="700" font-size="22" font-weight="500" fill="#525252" text-anchor="start">Monthly  $6.99/mo</text><rect x="160" y="728" width="380" height="52" fill="#0A0A0A"/><text x="350.0" y="763" font-size="26" font-weight="800" fill="#FFFFFF" text-anchor="middle">Start free trial</text><text x="350.0" y="806" font-size="22" font-weight="500" fill="#525252" text-anchor="middle">No commitment, cancel anytime</text><line x1="560" y1="312" x2="650" y2="270" stroke="#E5E5E5" stroke-width="2"/><rect x="650" y="250" width="40" height="40" fill="#F7B500"/><text x="670.0" y="278.0" font-size="26" font-weight="800" fill="#0A0A0A" text-anchor="middle">1</text><text x="710" y="279" font-size="28" font-weight="500" fill="#0A0A0A" text-anchor="start">Headline says how the trial works</text><line x1="560" y1="374" x2="650" y2="360" stroke="#E5E5E5" stroke-width="2"/><rect x="650" y="340" width="40" height="40" fill="#F7B500"/><text x="670.0" y="368.0" font-size="26" font-weight="800" fill="#0A0A0A" text-anchor="middle">2</text><text x="710" y="369" font-size="28" font-weight="500" fill="#0A0A0A" text-anchor="start">Today: say what the user gets</text><line x1="560" y1="450" x2="650" y2="450" stroke="#E5E5E5" stroke-width="2"/><rect x="650" y="430" width="40" height="40" fill="#F7B500"/><text x="670.0" y="458.0" font-size="26" font-weight="800" fill="#0A0A0A" text-anchor="middle">3</text><text x="710" y="459" font-size="28" font-weight="500" fill="#0A0A0A" text-anchor="start">Day 5: promise a reminder, then send it</text><line x1="560" y1="526" x2="650" y2="540" stroke="#E5E5E5" stroke-width="2"/><rect x="650" y="520" width="40" height="40" fill="#F7B500"/><text x="670.0" y="548.0" font-size="26" font-weight="800" fill="#0A0A0A" text-anchor="middle">4</text><text x="710" y="549" font-size="28" font-weight="500" fill="#0A0A0A" text-anchor="start">Day 7: the date and the exact price</text><line x1="560" y1="636" x2="650" y2="630" stroke="#E5E5E5" stroke-width="2"/><rect x="650" y="610" width="40" height="40" fill="#F7B500"/><text x="670.0" y="638.0" font-size="26" font-weight="800" fill="#0A0A0A" text-anchor="middle">5</text><text x="710" y="639" font-size="28" font-weight="500" fill="#0A0A0A" text-anchor="start">Annual selected, billed amount largest</text><line x1="560" y1="754" x2="650" y2="720" stroke="#E5E5E5" stroke-width="2"/><rect x="650" y="700" width="40" height="40" fill="#F7B500"/><text x="670.0" y="728.0" font-size="26" font-weight="800" fill="#0A0A0A" text-anchor="middle">6</text><text x="710" y="729" font-size="28" font-weight="500" fill="#0A0A0A" text-anchor="start">Button label matches the offer</text></svg>
