<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d" font-family="Manrope, Helvetica, Arial, sans-serif"><title id="t">Look up an in-app purchase by order ID</title><desc id="d">An App Store order ID and a Google Play order ID, each going to its store's API and coming back as a verified purchase on the customer's account.</desc><rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/><rect x="80" y="56" width="64" height="10" fill="#F7B500"/><text x="80" y="170" font-size="64" font-weight="800" fill="#0A0A0A">Look up an in-app</text><text x="80" y="245" font-size="64" font-weight="800" fill="#0A0A0A">purchase by order ID</text><text x="80" y="305" font-size="28" font-weight="500" fill="#525252">From the receipt email to a restored purchase</text><rect x="80" y="350" width="700" height="440" fill="none" stroke="#0A0A0A" stroke-width="2"/><text x="108" y="402" font-size="34" font-weight="800" fill="#0A0A0A">App Store</text><text x="108" y="438" font-size="22" font-weight="500" fill="#525252">Look Up Order ID, production only</text><rect x="108" y="472" width="14" height="14" fill="#F7B500"/><text x="138" y="490" font-size="26" font-weight="500" fill="#0A0A0A">Order ID from the receipt email</text><rect x="108" y="532" width="14" height="14" fill="#F7B500"/><text x="138" y="550" font-size="26" font-weight="500" fill="#0A0A0A">GET /inApps/v1/lookup/{orderId}</text><rect x="108" y="592" width="14" height="14" fill="#F7B500"/><text x="138" y="610" font-size="26" font-weight="500" fill="#0A0A0A">Status 0: signed transactions</text><rect x="108" y="652" width="14" height="14" fill="#F7B500"/><text x="138" y="670" font-size="26" font-weight="500" fill="#0A0A0A">Status 1: invalid for your app</text><rect x="108" y="712" width="14" height="14" fill="#F7B500"/><text x="138" y="730" font-size="26" font-weight="500" fill="#0A0A0A">Verify, then grant</text><rect x="820" y="350" width="700" height="440" fill="none" stroke="#0A0A0A" stroke-width="2"/><text x="848" y="402" font-size="34" font-weight="800" fill="#0A0A0A">Google Play</text><text x="848" y="438" font-size="22" font-weight="500" fill="#525252">Orders API with a service account</text><rect x="848" y="472" width="14" height="14" fill="#F7B500"/><text x="878" y="490" font-size="26" font-weight="500" fill="#0A0A0A">Order ID starts with GPA.</text><rect x="848" y="532" width="14" height="14" fill="#F7B500"/><text x="878" y="550" font-size="26" font-weight="500" fill="#0A0A0A">GET .../orders/{orderId}</text><rect x="848" y="592" width="14" height="14" fill="#F7B500"/><text x="878" y="610" font-size="26" font-weight="500" fill="#0A0A0A">Returns the purchase token</text><rect x="848" y="652" width="14" height="14" fill="#F7B500"/><text x="878" y="670" font-size="26" font-weight="500" fill="#0A0A0A">State: PROCESSED or REFUNDED</text><rect x="848" y="712" width="14" height="14" fill="#F7B500"/><text x="878" y="730" font-size="26" font-weight="500" fill="#0A0A0A">Verify, then grant</text></svg>
