<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d" font-family="Manrope, Helvetica, Arial, sans-serif"><title id="t">When a price increase needs subscriber consent</title><desc id="d">Two panels: Apple's consent triggers and notice-only increases, and Google Play opt-in and opt-out increase rules.</desc><rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/><rect x="80" y="56" width="64" height="10" fill="#F7B500"/><text x="80" y="150" font-size="48" font-weight="800" fill="#0A0A0A" text-anchor="start">When a price increase needs consent</text><text x="80" y="200" font-size="26" font-weight="500" fill="#525252" text-anchor="start">Apple and Google Play rules, checked October 2026</text><rect x="80" y="250" width="700" height="540" fill="none" stroke="#0A0A0A" stroke-width="2"/><text x="108" y="302" font-size="34" font-weight="800" fill="#0A0A0A" text-anchor="start">App Store</text><text x="108" y="350" font-size="24" font-weight="800" fill="#0A0A0A" text-anchor="start">Consent is needed if any of these is true:</text><text x="108" y="384" font-size="24" font-weight="500" fill="#525252" text-anchor="start">- The region requires it for any change</text><text x="108" y="418" font-size="24" font-weight="500" fill="#525252" text-anchor="start">- The raise is over 50% and over about $5</text><text x="108" y="452" font-size="24" font-weight="500" fill="#525252" text-anchor="start">  a period ($50 a year for annual plans)</text><text x="108" y="486" font-size="24" font-weight="500" fill="#525252" text-anchor="start">- The subscriber had a raise in 12 months</text><text x="108" y="520" font-size="24" font-weight="500" fill="#525252" text-anchor="start"></text><text x="108" y="538" font-size="24" font-weight="800" fill="#0A0A0A" text-anchor="start">Otherwise Apple sends notices only.</text><text x="108" y="572" font-size="24" font-weight="500" fill="#525252" text-anchor="start">If a subscriber who must consent does not,</text><text x="108" y="606" font-size="24" font-weight="500" fill="#525252" text-anchor="start">the subscription expires at the end of the</text><text x="108" y="640" font-size="24" font-weight="500" fill="#525252" text-anchor="start">billing cycle.</text><text x="108" y="674" font-size="24" font-weight="500" fill="#525252" text-anchor="start"></text><text x="108" y="692" font-size="24" font-weight="500" fill="#525252" text-anchor="start">You can keep any number of active</text><text x="108" y="726" font-size="24" font-weight="500" fill="#525252" text-anchor="start">subscribers at their old price.</text><rect x="820" y="250" width="700" height="540" fill="none" stroke="#0A0A0A" stroke-width="2"/><text x="848" y="302" font-size="34" font-weight="800" fill="#0A0A0A" text-anchor="start">Google Play</text><text x="848" y="350" font-size="24" font-weight="800" fill="#0A0A0A" text-anchor="start">Opt-in (the default)</text><text x="848" y="384" font-size="24" font-weight="500" fill="#525252" text-anchor="start">The user must agree, or the subscription is</text><text x="848" y="418" font-size="24" font-weight="500" fill="#525252" text-anchor="start">canceled before the first higher charge.</text><text x="848" y="452" font-size="24" font-weight="500" fill="#525252" text-anchor="start">At least 30 days of notice.</text><text x="848" y="486" font-size="24" font-weight="500" fill="#525252" text-anchor="start"></text><text x="848" y="504" font-size="24" font-weight="800" fill="#0A0A0A" text-anchor="start">Opt-out (some countries only)</text><text x="848" y="538" font-size="24" font-weight="500" fill="#525252" text-anchor="start">Notice only. One per base plan and country</text><text x="848" y="572" font-size="24" font-weight="500" fill="#525252" text-anchor="start">in 365 days. At most the greater of 50% or</text><text x="848" y="606" font-size="24" font-weight="500" fill="#525252" text-anchor="start">17 US cents a day. 30 or 60 days of notice,</text><text x="848" y="640" font-size="24" font-weight="500" fill="#525252" text-anchor="start">plus an in-app notice 30 days ahead.</text><line x1="80" y1="846" x2="1520" y2="846" stroke="#E5E5E5" stroke-width="2"/><text x="80" y="880" font-size="22" font-weight="500" fill="#525252" text-anchor="start">Sources: Apple, Manage pricing for subscriptions; Google Play Console Help, Understanding subscriptions</text></svg>