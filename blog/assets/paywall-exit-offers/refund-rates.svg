<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d" font-family="Manrope, Helvetica, Arial, sans-serif"><title id="t">Refund rate: 3.3% with an abandon offer, 6.8% without</title><desc id="d">Bars: refund rate 3.3% for users shown a discount after abandoning a purchase, 6.8% for the control group.</desc><rect width="1600" height="900" fill="#FFFFFF"/><rect x="80" y="56" width="64" height="10" fill="#F7B500"/><text x="80" y="128" font-size="42" font-weight="800" fill="#0A0A0A" text-anchor="start">Refund rate: 3.3% with an abandon offer, 6.8% without</text><text x="80" y="176" font-size="26" font-weight="500" fill="#525252" text-anchor="start">Apple worried about unintentional purchases. The refund data points the other way.</text><line x1="80" y1="846" x2="1520" y2="846" stroke="#E5E5E5" stroke-width="2"/><text x="80" y="880" font-size="22" font-weight="500" fill="#525252" text-anchor="start">Source: Superwall case study: 87,403 variant users, 438,144 control users, 18 companies</text><line x1="300" y1="740" x2="1300" y2="740" stroke="#0A0A0A" stroke-width="3"/><rect x="400.0" y="526.4705882352941" width="300" height="213.52941176470588" fill="#0A0A0A"/><text x="550.0" y="508.47058823529414" font-size="64" font-weight="800" fill="#0A0A0A" text-anchor="middle">3.3%</text><text x="550.0" y="780" font-size="28" font-weight="800" fill="#0A0A0A" text-anchor="middle">Abandon-offer group</text><text x="550.0" y="814" font-size="22" font-weight="500" fill="#525252" text-anchor="middle">87,403 users</text><rect x="900.0" y="300.0" width="300" height="440.0" fill="#E5E5E5"/><text x="1050.0" y="282.0" font-size="64" font-weight="800" fill="#0A0A0A" text-anchor="middle">6.8%</text><text x="1050.0" y="780" font-size="28" font-weight="800" fill="#0A0A0A" text-anchor="middle">Control group</text><text x="1050.0" y="814" font-size="22" font-weight="500" fill="#525252" text-anchor="middle">438,144 users</text></svg>
