<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d" font-family="Manrope, Helvetica, Arial, sans-serif"><title id="t">A second offer after a cancelled purchase</title><desc id="d">A bar split: 17% of total revenue from transaction-abandon paywalls, 83% from the rest. Refund rate 3.3% vs 6.8%.</desc><rect width="1600" height="900" fill="#FFFFFF"/><rect x="80" y="56" width="64" height="10" fill="#F7B500"/><text x="80" y="150" font-size="60" font-weight="800" fill="#0A0A0A" text-anchor="start">A second offer after a cancelled purchase</text><text x="80" y="205" font-size="30" font-weight="500" fill="#525252" text-anchor="start">Superwall: transaction-abandon offers account for 17% of total revenue.</text><rect x="80" y="330" width="1440" height="130" fill="#E5E5E5"/><rect x="80" y="330" width="245" height="130" fill="#0A0A0A"/><text x="202" y="420" font-size="60" font-weight="800" fill="#FFFFFF" text-anchor="middle">17%</text><text x="920" y="420" font-size="34" font-weight="500" fill="#0A0A0A" text-anchor="middle">83% from the main paywall</text><text x="80" y="520" font-size="28" font-weight="500" fill="#525252" text-anchor="start">From users who started a purchase and cancelled</text><rect x="80" y="610" width="1440" height="110" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"/><text x="110" y="658" font-size="30" font-weight="800" fill="#0A0A0A" text-anchor="start">Refund rate: 3.3% with the offer vs 6.8% in the control group.</text><text x="110" y="698" font-size="24" font-weight="500" fill="#525252" text-anchor="start">18 companies, at least two weeks. Superwall case study</text><line x1="80" y1="846" x2="1520" y2="846" stroke="#E5E5E5" stroke-width="2"/><text x="80" y="880" font-size="22" font-weight="500" fill="#525252" text-anchor="start">Source: Superwall, 17% revenue boost with transaction abandon paywalls (superwall.com/blog)</text></svg>
