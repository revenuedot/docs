<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d" font-family="Manrope, Helvetica, Arial, sans-serif"><title id="t">Two moments to show a second offer</title><desc id="d">Two flows: A, user taps X on the paywall and sees an exit sheet with a shorter plan. B, user cancels the store sheet and sees a second offer.</desc><rect width="1600" height="900" fill="#FFFFFF"/><rect x="80" y="56" width="64" height="10" fill="#F7B500"/><text x="80" y="128" font-size="44" font-weight="800" fill="#0A0A0A" text-anchor="start">Two moments to show a second offer</text><text x="80" y="176" font-size="26" font-weight="500" fill="#525252" text-anchor="start">Pick one first. Each shows once per user, then lets them leave.</text><line x1="80" y1="846" x2="1520" y2="846" stroke="#E5E5E5" stroke-width="2"/><text x="80" y="880" font-size="22" font-weight="500" fill="#525252" text-anchor="start">Flow: RevenueDot "Focus" sample app (github.com/revenuedot/examples)</text><text x="80" y="250" font-size="30" font-weight="800" fill="#0A0A0A" text-anchor="start">A. The user closes the paywall</text><rect x="80" y="280" width="300" height="150" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2"/><text x="100" y="340" font-size="30" font-weight="800" fill="#0A0A0A" text-anchor="start">Paywall</text><text x="100" y="382" font-size="24" font-weight="500" fill="#525252" text-anchor="start">Annual selected</text><line x1="390" y1="355" x2="450" y2="355" stroke="#0A0A0A" stroke-width="3"/><polygon points="450,355 432,345 432,365" fill="#0A0A0A"/><rect x="460" y="280" width="300" height="150" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2"/><text x="480" y="340" font-size="30" font-weight="800" fill="#0A0A0A" text-anchor="start">Taps X</text><text x="480" y="382" font-size="24" font-weight="500" fill="#525252" text-anchor="start">Without buying</text><line x1="770" y1="355" x2="830" y2="355" stroke="#0A0A0A" stroke-width="3"/><polygon points="830,355 812,345 812,365" fill="#0A0A0A"/><rect x="840" y="280" width="300" height="150" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="4"/><text x="860" y="340" font-size="30" font-weight="800" fill="#0A0A0A" text-anchor="start">Exit sheet</text><text x="860" y="382" font-size="24" font-weight="500" fill="#525252" text-anchor="start">Cheaper plan</text><line x1="1150" y1="355" x2="1210" y2="355" stroke="#0A0A0A" stroke-width="3"/><polygon points="1210,355 1192,345 1192,365" fill="#0A0A0A"/><rect x="1220" y="280" width="300" height="150" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2"/><text x="1240" y="340" font-size="30" font-weight="800" fill="#0A0A0A" text-anchor="start">Buy or leave</text><text x="1240" y="382" font-size="24" font-weight="500" fill="#525252" text-anchor="start">Shown once</text><text x="80" y="520" font-size="30" font-weight="800" fill="#0A0A0A" text-anchor="start">B. The user starts a purchase and cancels the store sheet</text><rect x="80" y="550" width="300" height="150" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2"/><text x="100" y="610" font-size="30" font-weight="800" fill="#0A0A0A" text-anchor="start">Taps button</text><text x="100" y="652" font-size="24" font-weight="500" fill="#525252" text-anchor="start">Start free trial</text><line x1="390" y1="625" x2="450" y2="625" stroke="#0A0A0A" stroke-width="3"/><polygon points="450,625 432,615 432,635" fill="#0A0A0A"/><rect x="460" y="550" width="300" height="150" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2"/><text x="480" y="610" font-size="30" font-weight="800" fill="#0A0A0A" text-anchor="start">Store sheet</text><text x="480" y="652" font-size="24" font-weight="500" fill="#525252" text-anchor="start">Face ID or Cancel</text><line x1="770" y1="625" x2="830" y2="625" stroke="#0A0A0A" stroke-width="3"/><polygon points="830,625 812,615 812,635" fill="#0A0A0A"/><rect x="840" y="550" width="300" height="150" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2"/><text x="860" y="610" font-size="30" font-weight="800" fill="#0A0A0A" text-anchor="start">Cancelled</text><text x="860" y="652" font-size="24" font-weight="500" fill="#525252" text-anchor="start">No transaction</text><line x1="1150" y1="625" x2="1210" y2="625" stroke="#0A0A0A" stroke-width="3"/><polygon points="1210,625 1192,615 1192,635" fill="#0A0A0A"/><rect x="1220" y="550" width="300" height="150" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="4"/><text x="1240" y="610" font-size="30" font-weight="800" fill="#0A0A0A" text-anchor="start">Second offer</text><text x="1240" y="652" font-size="24" font-weight="500" fill="#525252" text-anchor="start">A real lower price</text><text x="80" y="775" font-size="26" font-weight="500" fill="#525252" text-anchor="start">Show it once, and name the real price and period on the sheet.</text></svg>
