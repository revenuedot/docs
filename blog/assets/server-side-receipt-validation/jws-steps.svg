<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" width="1600" height="520" role="img" aria-labelledby="t d"><title id="t">Verifying an Apple signed transaction</title><desc id="d">Four steps: split the JWS, check its certificate chain against Apple&#x27;s root, check bundle ID and environment, then use the decoded fields.</desc><rect width="1600" height="520" fill="#FFFFFF"/><text x="60" y="100" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#0A0A0A" text-anchor="start">Never trust a transaction you did not verify</text><rect x="60" y="170" width="340" height="150" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"/><text x="230.0" y="252.92" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#0A0A0A" text-anchor="middle"></text><text x="230.0" y="239.0" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#0A0A0A" text-anchor="middle">1. Split</text><text x="230.0" y="279.0" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#525252" text-anchor="middle">header.payload.signature</text><line x1="400" y1="245.0" x2="446" y2="245.0" stroke="#0A0A0A" stroke-width="3"/><polygon points="446,245.0 430.0,253.0 430.0,237.0" fill="#0A0A0A"/><rect x="446" y="170" width="340" height="150" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="3"/><rect x="460" y="184" width="14" height="14" fill="#F7B500"/><text x="616.0" y="252.92" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#0A0A0A" text-anchor="middle"></text><text x="616.0" y="239.0" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#0A0A0A" text-anchor="middle">2. Verify chain</text><text x="616.0" y="279.0" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#525252" text-anchor="middle">x5c to Apple root</text><line x1="786" y1="245.0" x2="832" y2="245.0" stroke="#0A0A0A" stroke-width="3"/><polygon points="832,245.0 816.0,253.0 816.0,237.0" fill="#0A0A0A"/><rect x="832" y="170" width="340" height="150" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"/><text x="1002.0" y="252.92" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#0A0A0A" text-anchor="middle"></text><text x="1002.0" y="239.0" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#0A0A0A" text-anchor="middle">3. Check fields</text><text x="1002.0" y="279.0" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#525252" text-anchor="middle">bundleId, environment</text><line x1="1172" y1="245.0" x2="1218" y2="245.0" stroke="#0A0A0A" stroke-width="3"/><polygon points="1218,245.0 1202.0,253.0 1202.0,237.0" fill="#0A0A0A"/><rect x="1218" y="170" width="340" height="150" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"/><text x="1388.0" y="252.92" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#0A0A0A" text-anchor="middle"></text><text x="1388.0" y="239.0" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#0A0A0A" text-anchor="middle">4. Decode</text><text x="1388.0" y="279.0" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#525252" text-anchor="middle">product, expiry, id</text><text x="60" y="420" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#525252" text-anchor="start">Apple&#x27;s open-source App Store Server Library does steps 1 to 4 in Swift, Java, Python and Node.</text></svg>