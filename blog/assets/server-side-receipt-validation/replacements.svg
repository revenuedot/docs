<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700" role="img" aria-labelledby="t d"><title id="t">Deprecated endpoints and their replacements</title><desc id="d">Apple&#x27;s Verify-Receipt endpoint is deprecated; use the App Store Server API with signed JWS data. Google&#x27;s purchases.subscriptions resource is deprecated; use purchases.subscriptionsv2.</desc><rect width="1600" height="700" fill="#FFFFFF"/><text x="100" y="100" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#0A0A0A" text-anchor="start">Apple</text><text x="100" y="370" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#0A0A0A" text-anchor="start">Google Play</text><rect x="100" y="130" width="560" height="110" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"/><text x="380.0" y="174.92" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#0A0A0A" text-anchor="middle">Verify-Receipt</text><text x="380.0" y="210.92" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#525252" text-anchor="middle">deprecated</text><line x1="660" y1="185" x2="900" y2="185" stroke="#0A0A0A" stroke-width="3"/><polygon points="900,185 884.0,193.0 884.0,177.0" fill="#0A0A0A"/><rect x="900" y="130" width="600" height="110" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="3"/><rect x="914" y="144" width="14" height="14" fill="#F7B500"/><text x="1200.0" y="174.92" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#0A0A0A" text-anchor="middle">App Store Server API</text><text x="1200.0" y="210.92" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#525252" text-anchor="middle">signed JWS, transaction id</text><rect x="100" y="400" width="560" height="110" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"/><text x="380.0" y="444.92" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#0A0A0A" text-anchor="middle">purchases.subscriptions</text><text x="380.0" y="480.92" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#525252" text-anchor="middle">deprecated</text><line x1="660" y1="455" x2="900" y2="455" stroke="#0A0A0A" stroke-width="3"/><polygon points="900,455 884.0,463.0 884.0,447.0" fill="#0A0A0A"/><rect x="900" y="400" width="600" height="110" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="3"/><rect x="914" y="414" width="14" height="14" fill="#F7B500"/><text x="1200.0" y="444.92" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#0A0A0A" text-anchor="middle">purchases.subscriptionsv2</text><text x="1200.0" y="480.92" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#525252" text-anchor="middle">SubscriptionPurchaseV2</text><text x="100" y="600" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#525252" text-anchor="start">Both new endpoints return current state, so you read the truth from the store, not the device.</text></svg>