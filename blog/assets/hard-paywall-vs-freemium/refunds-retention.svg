<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d" font-family="Manrope, Helvetica, Arial, sans-serif"><title id="t">The cost of a hard paywall: more refunds, same retention</title><desc id="d">Refund rate 5.8% for hard paywall vs 3.4% for freemium; one-year retention of yearly subscribers 27% vs 28%.</desc><rect width="1600" height="900" fill="#FFFFFF"/><rect x="80" y="56" width="64" height="10" fill="#F7B500"/><text x="80" y="128" font-size="40" font-weight="800" fill="#0A0A0A" text-anchor="start">The cost of a hard paywall: more refunds, same retention</text><text x="80" y="176" font-size="26" font-weight="500" fill="#525252" text-anchor="start">Left: refund rate (2025 report). Right: one-year retention of yearly subscribers (2026 report).</text><line x1="80" y1="846" x2="1520" y2="846" stroke="#E5E5E5" stroke-width="2"/><text x="80" y="880" font-size="22" font-weight="500" fill="#525252" text-anchor="start">Sources: RevenueCat State of Subscription Apps 2025 and 2026 (revenuecat.com/state-of-subscription-apps-2025)</text><line x1="80" y1="730" x2="760" y2="730" stroke="#0A0A0A" stroke-width="3"/><rect x="150.0" y="498.0" width="200" height="232.0" fill="#0A0A0A"/><text x="250.0" y="480.0" font-size="52" font-weight="800" fill="#0A0A0A" text-anchor="middle">5.8%</text><text x="250.0" y="770" font-size="28" font-weight="800" fill="#0A0A0A" text-anchor="middle">Hard paywall</text><rect x="490.0" y="594.0" width="200" height="136.0" fill="#E5E5E5"/><text x="590.0" y="576.0" font-size="52" font-weight="800" fill="#0A0A0A" text-anchor="middle">3.4%</text><text x="590.0" y="770" font-size="28" font-weight="800" fill="#0A0A0A" text-anchor="middle">Freemium</text><text x="420" y="300" font-size="28" font-weight="800" fill="#525252" text-anchor="middle">Refund rate</text><line x1="840" y1="730" x2="1520" y2="730" stroke="#0A0A0A" stroke-width="3"/><rect x="910.0" y="460.0" width="200" height="270.0" fill="#0A0A0A"/><text x="1010.0" y="442.0" font-size="52" font-weight="800" fill="#0A0A0A" text-anchor="middle">27%</text><text x="1010.0" y="770" font-size="28" font-weight="800" fill="#0A0A0A" text-anchor="middle">Hard paywall</text><rect x="1250.0" y="450.0" width="200" height="280.0" fill="#E5E5E5"/><text x="1350.0" y="432.0" font-size="52" font-weight="800" fill="#0A0A0A" text-anchor="middle">28%</text><text x="1350.0" y="770" font-size="28" font-weight="800" fill="#0A0A0A" text-anchor="middle">Freemium</text><text x="1180" y="300" font-size="28" font-weight="800" fill="#525252" text-anchor="middle">One-year retention</text></svg>
