<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d" font-family="Manrope, Helvetica, Arial, sans-serif"><title id="t">Hard paywalls convert 5x more than freemium</title><desc id="d">Two bars: hard paywall 10.7% median Day-35 conversion against 2.1% for freemium.</desc><rect width="1600" height="900" fill="#FFFFFF"/><rect x="80" y="56" width="64" height="10" fill="#F7B500"/><text x="80" y="170" font-size="64" font-weight="800" fill="#0A0A0A" text-anchor="start">Hard paywalls convert</text><text x="80" y="245" font-size="64" font-weight="800" fill="#0A0A0A" text-anchor="start">5x more than freemium</text><text x="80" y="305" font-size="28" font-weight="500" fill="#525252" text-anchor="start">Median Day-35 conversion rate, apps in RevenueCat data</text><text x="80" y="360" font-size="28" font-weight="500" fill="#0A0A0A" text-anchor="start">Hard paywall: no free tier,</text><text x="80" y="398" font-size="28" font-weight="500" fill="#0A0A0A" text-anchor="start">the paywall comes first.</text><line x1="860" y1="730" x2="1520" y2="730" stroke="#0A0A0A" stroke-width="3"/><rect x="895.0" y="200.0" width="260" height="530.0" fill="#0A0A0A"/><text x="1025.0" y="182.0" font-size="64" font-weight="800" fill="#0A0A0A" text-anchor="middle">10.7%</text><text x="1025.0" y="770" font-size="30" font-weight="800" fill="#0A0A0A" text-anchor="middle">Hard paywall</text><rect x="1225.0" y="625.981308411215" width="260" height="104.01869158878506" fill="#E5E5E5"/><text x="1355.0" y="607.981308411215" font-size="64" font-weight="800" fill="#0A0A0A" text-anchor="middle">2.1%</text><text x="1355.0" y="770" font-size="30" font-weight="800" fill="#0A0A0A" text-anchor="middle">Freemium</text><line x1="80" y1="846" x2="1520" y2="846" stroke="#E5E5E5" stroke-width="2"/><text x="80" y="880" font-size="22" font-weight="500" fill="#525252" text-anchor="start">Source: RevenueCat, State of Subscription Apps 2026 (revenuecat.com/blog/growth/subscription-app-trends-benchmarks-2026)</text></svg>
