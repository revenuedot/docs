<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d" font-family="Manrope, Helvetica, Arial, sans-serif"><title id="t">Revenue per install by day 60: $3.09 vs $0.38</title><desc id="d">Two bars: hard paywall $3.09 per install, freemium $0.38 per install at day 60.</desc><rect width="1600" height="900" fill="#FFFFFF"/><rect x="80" y="56" width="64" height="10" fill="#F7B500"/><text x="80" y="128" font-size="44" font-weight="800" fill="#0A0A0A" text-anchor="start">Revenue per install by day 60: $3.09 vs $0.38</text><text x="80" y="176" font-size="26" font-weight="500" fill="#525252" text-anchor="start">A hard paywall earned 8 times more per install in the same data.</text><line x1="80" y1="846" x2="1520" y2="846" stroke="#E5E5E5" stroke-width="2"/><text x="80" y="880" font-size="22" font-weight="500" fill="#525252" text-anchor="start">Source: RevenueCat, State of Subscription Apps 2026, 115,000+ apps</text><line x1="300" y1="740" x2="1300" y2="740" stroke="#0A0A0A" stroke-width="3"/><rect x="400.0" y="300.0" width="300" height="440.0" fill="#0A0A0A"/><text x="550.0" y="282.0" font-size="64" font-weight="800" fill="#0A0A0A" text-anchor="middle">$3.09</text><text x="550.0" y="780" font-size="30" font-weight="800" fill="#0A0A0A" text-anchor="middle">Hard paywall</text><rect x="900.0" y="685.8899676375404" width="300" height="54.11003236245955" fill="#E5E5E5"/><text x="1050.0" y="667.8899676375404" font-size="64" font-weight="800" fill="#0A0A0A" text-anchor="middle">$0.38</text><text x="1050.0" y="780" font-size="30" font-weight="800" fill="#0A0A0A" text-anchor="middle">Freemium</text></svg>
