<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d" font-family="Manrope, Helvetica, Arial, sans-serif"><title id="t">A Google Play offer is a list of phases</title><desc id="d">Seven-day free trial, then one month at 1.99 dollars, then the base plan price of 9.99 dollars a month.</desc><rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/><rect x="80" y="56" width="64" height="10" fill="#F7B500"/><text x="80" y="150" font-size="48" font-weight="800" fill="#0A0A0A" text-anchor="start">An offer is a list of phases</text><text x="80" y="200" font-size="26" font-weight="500" fill="#525252" text-anchor="start">Google's example: a free trial, then an intro price, then the base plan price</text><rect x="80" y="330" width="360" height="150" fill="#0A0A0A"/><text x="260" y="395" font-size="24" font-weight="800" fill="#FFFFFF" text-anchor="middle">Phase 1</text><text x="260" y="435" font-size="24" font-weight="500" fill="#FFFFFF" text-anchor="middle">Free trial, 7 days</text><rect x="440" y="330" width="420" height="150" fill="none" stroke="#0A0A0A" stroke-width="2"/><text x="650" y="395" font-size="24" font-weight="800" fill="#0A0A0A" text-anchor="middle">Phase 2</text><text x="650" y="435" font-size="24" font-weight="500" fill="#525252" text-anchor="middle">1 month at $1.99</text><rect x="860" y="330" width="660" height="150" fill="#E5E5E5"/><text x="1190" y="395" font-size="24" font-weight="800" fill="#0A0A0A" text-anchor="middle">Then the base plan</text><text x="1190" y="435" font-size="24" font-weight="500" fill="#525252" text-anchor="middle">Auto-renews at $9.99 a month</text><text x="80" y="560" font-size="26" font-weight="800" fill="#0A0A0A" text-anchor="start">Eligibility</text><text x="80" y="600" font-size="24" font-weight="500" fill="#525252" text-anchor="start">New customer acquisition: Google checks that the user never had the subscription.</text><text x="80" y="660" font-size="24" font-weight="500" fill="#525252" text-anchor="start">Free trial phases last 3 days to 3 years. Intro price phases run 1 to 52 billing periods.</text><text x="80" y="720" font-size="24" font-weight="500" fill="#525252" text-anchor="start">After the last phase, the subscription renews at the base plan price.</text><line x1="80" y1="846" x2="1520" y2="846" stroke="#E5E5E5" stroke-width="2"/><text x="80" y="880" font-size="22" font-weight="500" fill="#525252" text-anchor="start">Source: Google Play Console Help, Understanding subscriptions (support.google.com)</text></svg>