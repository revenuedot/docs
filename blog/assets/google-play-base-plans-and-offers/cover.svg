<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d" font-family="Manrope, Helvetica, Arial, sans-serif"><title id="t">Google Play subscriptions: base plans and offers</title><desc id="d">A subscription has three base plans: monthly, annual and prepaid. Offers such as a free trial and a win-back hang off the monthly base plan.</desc><rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/><rect x="80" y="56" width="64" height="10" fill="#F7B500"/><text x="80" y="170" font-size="64" font-weight="800" fill="#0A0A0A" text-anchor="start">Google Play subscriptions:</text><text x="80" y="245" font-size="64" font-weight="800" fill="#0A0A0A" text-anchor="start">base plans and offers</text><text x="80" y="305" font-size="28" font-weight="500" fill="#525252" text-anchor="start">One subscription, several base plans, offers on top</text><text x="80" y="370" font-size="22" font-weight="800" fill="#525252" text-anchor="start">SUBSCRIPTION</text><text x="470" y="370" font-size="22" font-weight="800" fill="#525252" text-anchor="start">BASE PLANS</text><text x="960" y="370" font-size="22" font-weight="800" fill="#525252" text-anchor="start">OFFERS (AUTO-RENEWING ONLY)</text><rect x="80" y="500" width="300" height="120" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2"/><text x="104" y="548" font-size="30" font-weight="800" fill="#0A0A0A" text-anchor="start">Subscription</text><text x="104" y="590" font-size="24" font-weight="500" fill="#525252" text-anchor="start">ID: pro</text><rect x="470" y="400" width="400" height="110" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2"/><text x="494" y="448" font-size="28" font-weight="800" fill="#0A0A0A" text-anchor="start">Monthly</text><text x="494" y="486" font-size="24" font-weight="500" fill="#525252" text-anchor="start">auto-renewing</text><rect x="470" y="540" width="400" height="110" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2"/><text x="494" y="588" font-size="28" font-weight="800" fill="#0A0A0A" text-anchor="start">Annual</text><text x="494" y="626" font-size="24" font-weight="500" fill="#525252" text-anchor="start">auto-renewing</text><rect x="470" y="680" width="400" height="110" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2"/><text x="494" y="728" font-size="28" font-weight="800" fill="#0A0A0A" text-anchor="start">Monthly prepaid</text><text x="494" y="766" font-size="24" font-weight="500" fill="#525252" text-anchor="start">no offers possible</text><line x1="380" y1="560" x2="425" y2="560" stroke="#0A0A0A" stroke-width="2"/><line x1="425" y1="455" x2="425" y2="735" stroke="#0A0A0A" stroke-width="2"/><line x1="425" y1="455" x2="470" y2="455" stroke="#0A0A0A" stroke-width="2"/><line x1="425" y1="595" x2="470" y2="595" stroke="#0A0A0A" stroke-width="2"/><line x1="425" y1="735" x2="470" y2="735" stroke="#0A0A0A" stroke-width="2"/><rect x="960" y="400" width="560" height="110" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2"/><text x="984" y="448" font-size="28" font-weight="800" fill="#0A0A0A" text-anchor="start">7-day free trial</text><text x="984" y="486" font-size="24" font-weight="500" fill="#525252" text-anchor="start">New customers</text><rect x="960" y="540" width="560" height="110" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2"/><text x="984" y="588" font-size="28" font-weight="800" fill="#0A0A0A" text-anchor="start">Win-back, 50% off, 3 periods</text><text x="984" y="626" font-size="24" font-weight="500" fill="#525252" text-anchor="start">Developer determined</text><line x1="870" y1="455" x2="915" y2="455" stroke="#0A0A0A" stroke-width="2"/><line x1="915" y1="455" x2="915" y2="595" stroke="#0A0A0A" stroke-width="2"/><line x1="915" y1="595" x2="960" y2="595" stroke="#0A0A0A" stroke-width="2"/><line x1="915" y1="455" x2="960" y2="455" stroke="#0A0A0A" stroke-width="2"/><line x1="80" y1="846" x2="1520" y2="846" stroke="#E5E5E5" stroke-width="2"/><text x="80" y="880" font-size="22" font-weight="500" fill="#525252" 