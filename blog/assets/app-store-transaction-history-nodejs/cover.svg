<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d" font-family="Manrope, Helvetica, Arial, sans-serif"><title id="t">App Store transaction history in Node.js</title><desc id="d">Two columns: the steps to call Get Transaction History from Node.js, from a transaction ID to verified transactions, and the rules to follow, such as using V2 and paging up to 20 at a time.</desc><rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/><rect x="80" y="56" width="64" height="10" fill="#F7B500"/><text x="80" y="170" font-size="64" font-weight="800" fill="#0A0A0A">App Store transaction history</text><text x="80" y="245" font-size="64" font-weight="800" fill="#0A0A0A">in Node.js</text><text x="80" y="305" font-size="28" font-weight="500" fill="#525252">Every purchase a customer made, from one transaction ID</text><rect x="80" y="350" width="700" height="440" fill="none" stroke="#0A0A0A" stroke-width="2"/><text x="108" y="402" font-size="34" font-weight="800" fill="#0A0A0A">The steps</text><text x="108" y="438" font-size="22" font-weight="500" fill="#525252">With Apple’s Node.js library</text><rect x="108" y="472" width="14" height="14" fill="#F7B500"/><text x="138" y="490" font-size="26" font-weight="500" fill="#0A0A0A">Create an In-App Purchase key</text><rect x="108" y="532" width="14" height="14" fill="#F7B500"/><text x="138" y="550" font-size="26" font-weight="500" fill="#0A0A0A">Send one transaction ID</text><rect x="108" y="592" width="14" height="14" fill="#F7B500"/><text x="138" y="610" font-size="26" font-weight="500" fill="#0A0A0A">Call getTransactionHistory</text><rect x="108" y="652" width="14" height="14" fill="#F7B500"/><text x="138" y="670" font-size="26" font-weight="500" fill="#0A0A0A">Follow revision until done</text><rect x="108" y="712" width="14" height="14" fill="#F7B500"/><text x="138" y="730" font-size="26" font-weight="500" fill="#0A0A0A">Verify each signed item</text><rect x="820" y="350" width="700" height="440" fill="none" stroke="#0A0A0A" stroke-width="2"/><text x="848" y="402" font-size="34" font-weight="800" fill="#0A0A0A">The rules</text><text x="848" y="438" font-size="22" font-weight="500" fill="#525252">What trips people up</text><rect x="848" y="472" width="14" height="14" fill="#F7B500"/><text x="878" y="490" font-size="26" font-weight="500" fill="#0A0A0A">Pass V2, the default is V1</text><rect x="848" y="532" width="14" height="14" fill="#F7B500"/><text x="878" y="550" font-size="26" font-weight="500" fill="#0A0A0A">Up to 20 per page</text><rect x="848" y="592" width="14" height="14" fill="#F7B500"/><text x="878" y="610" font-size="26" font-weight="500" fill="#0A0A0A">Same filters on every page</text><rect x="848" y="652" width="14" height="14" fill="#F7B500"/><text x="878" y="670" font-size="26" font-weight="500" fill="#0A0A0A">50 requests a second</text><rect x="848" y="712" width="14" height="14" fill="#F7B500"/><text x="878" y="730" font-size="26" font-weight="500" fill="#0A0A0A">Try sandbox on 4040010</text></svg>