<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d" font-family="Manrope, Helvetica, Arial, sans-serif"><title id="t">Promotional offers: your server signs, Apple verifies</title><desc id="d">Sequence: the app asks the server for a signature, the server signs with the In-App Purchase key, the app buys with the offer, Apple verifies.</desc><rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/><rect x="80" y="56" width="64" height="10" fill="#F7B500"/><text x="80" y="170" font-size="64" font-weight="800" fill="#0A0A0A" text-anchor="start">Promotional offers: your server</text><text x="80" y="245" font-size="64" font-weight="800" fill="#0A0A0A" text-anchor="start">signs, Apple verifies</text><text x="80" y="305" font-size="28" font-weight="500" fill="#525252" text-anchor="start">The signature proves the offer came from you, and works once</text><rect x="170" y="350" width="260" height="64" fill="none" stroke="#0A0A0A" stroke-width="2"/><text x="300" y="392" font-size="28" font-weight="800" fill="#0A0A0A" text-anchor="middle">Your app</text><line x1="300" y1="414" x2="300" y2="810" stroke="#E5E5E5" stroke-width="2"/><rect x="670" y="350" width="260" height="64" fill="none" stroke="#0A0A0A" stroke-width="2"/><text x="800" y="392" font-size="28" font-weight="800" fill="#0A0A0A" text-anchor="middle">Your server</text><line x1="800" y1="414" x2="800" y2="810" stroke="#E5E5E5" stroke-width="2"/><rect x="1170" y="350" width="260" height="64" fill="none" stroke="#0A0A0A" stroke-width="2"/><text x="1300" y="392" font-size="28" font-weight="800" fill="#0A0A0A" text-anchor="middle">Apple</text><line x1="1300" y1="414" x2="1300" y2="810" stroke="#E5E5E5" stroke-width="2"/><line x1="300" y1="470" x2="800" y2="470" stroke="#0A0A0A" stroke-width="3"/><polygon points="800,470 786,461 786,479" fill="#0A0A0A"/><text x="550" y="456" font-size="22" font-weight="500" fill="#0A0A0A" text-anchor="middle">1  product, offer ID, user</text><rect x="660" y="505" width="280" height="64" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2"/><text x="800" y="547" font-size="24" font-weight="800" fill="#0A0A0A" text-anchor="middle">2  Sign with key</text><line x1="800" y1="630" x2="300" y2="630" stroke="#0A0A0A" stroke-width="3"/><polygon points="300,630 314,621 314,639" fill="#0A0A0A"/><text x="550" y="616" font-size="22" font-weight="500" fill="#0A0A0A" text-anchor="middle">3  key ID, nonce, timestamp, signature</text><line x1="300" y1="710" x2="1300" y2="710" stroke="#0A0A0A" stroke-width="3"/><polygon points="1300,710 1286,701 1286,719" fill="#0A0A0A"/><text x="800" y="696" font-size="22" font-weight="500" fill="#0A0A0A" text-anchor="middle">4  Purchase with offer + signature</text><line x1="1300" y1="790" x2="300" y2="790" stroke="#0A0A0A" stroke-width="3"/><polygon points="300,790 314,781 314,799" fill="#0A0A0A"/><text x="800" y="776" font-size="22" font-weight="500" fill="#0A0A0A" text-anchor="middle">5  Apple verifies, new period starts</text><line x1="80" y1="846" x2="1520" y2="846" stroke="#E5E5E5" stroke-width="2"/><text x="80" y="880" font-size="22" font-weight="500" fill="#525252" text-anchor="start">Source: Apple, Generating a signature for promotional offers (developer.apple.com/documentation/storekit)</text></svg>