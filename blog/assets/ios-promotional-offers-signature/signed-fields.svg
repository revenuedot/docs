<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d" font-family="Manrope, Helvetica, Arial, sans-serif"><title id="t">The string your server signs for a promotional offer</title><desc id="d">Seven fields in order: bundle ID, key ID, product ID, offer ID, app account token, nonce, timestamp, signed with ECDSA and SHA-256.</desc><rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/><rect x="80" y="56" width="64" height="10" fill="#F7B500"/><text x="80" y="150" font-size="48" font-weight="800" fill="#0A0A0A" text-anchor="start">The string your server signs</text><text x="80" y="200" font-size="26" font-weight="500" fill="#525252" text-anchor="start">Seven values in this order, joined by the invisible character U+2063</text><rect x="80" y="290" width="168" height="130" fill="none" stroke="#0A0A0A" stroke-width="2"/><text x="164" y="348" font-size="22" font-weight="800" fill="#0A0A0A" text-anchor="middle">app bundle</text><text x="164" y="384" font-size="22" font-weight="500" fill="#525252" text-anchor="middle">ID</text><rect x="262" y="350" width="14" height="14" fill="#F7B500"/><rect x="290" y="290" width="168" height="130" fill="none" stroke="#0A0A0A" stroke-width="2"/><text x="374" y="348" font-size="22" font-weight="800" fill="#0A0A0A" text-anchor="middle">key</text><text x="374" y="384" font-size="22" font-weight="500" fill="#525252" text-anchor="middle">ID</text><rect x="472" y="350" width="14" height="14" fill="#F7B500"/><rect x="500" y="290" width="168" height="130" fill="none" stroke="#0A0A0A" stroke-width="2"/><text x="584" y="348" font-size="22" font-weight="800" fill="#0A0A0A" text-anchor="middle">product</text><text x="584" y="384" font-size="22" font-weight="500" fill="#525252" text-anchor="middle">ID</text><rect x="682" y="350" width="14" height="14" fill="#F7B500"/><rect x="710" y="290" width="168" height="130" fill="none" stroke="#0A0A0A" stroke-width="2"/><text x="794" y="348" font-size="22" font-weight="800" fill="#0A0A0A" text-anchor="middle">offer</text><text x="794" y="384" font-size="22" font-weight="500" fill="#525252" text-anchor="middle">ID</text><rect x="892" y="350" width="14" height="14" fill="#F7B500"/><rect x="920" y="290" width="168" height="130" fill="none" stroke="#0A0A0A" stroke-width="2"/><text x="1004" y="348" font-size="22" font-weight="800" fill="#0A0A0A" text-anchor="middle">app account</text><text x="1004" y="384" font-size="22" font-weight="500" fill="#525252" text-anchor="middle">token</text><rect x="1102" y="350" width="14" height="14" fill="#F7B500"/><rect x="1130" y="290" width="168" height="130" fill="none" stroke="#0A0A0A" stroke-width="2"/><text x="1214" y="348" font-size="22" font-weight="800" fill="#0A0A0A" text-anchor="middle">nonce</text><text x="1214" y="384" font-size="22" font-weight="500" fill="#525252" text-anchor="middle">(lowercase)</text><rect x="1312" y="350" width="14" height="14" fill="#F7B500"/><rect x="1340" y="290" width="168" height="130" fill="none" stroke="#0A0A0A" stroke-width="2"/><text x="1424" y="348" font-size="22" font-weight="800" fill="#0A0A0A" text-anchor="middle">timestamp</text><text x="1424" y="384" font-size="22" font-weight="500" fill="#525252" text-anchor="middle">(ms)</text><text x="80" y="480" font-size="24" font-weight="500" fill="#525252" text-anchor="start">Gold marks are U+2063 separators. Use lowercase for the nonce and the app account token.</text><line x1="800" y1="500" x2="800" y2="560" stroke="#0A0A0A" stroke-width="3"/><polygon points="800,560 791,546 809,546" fill="#0A0A0A"/><rect x="280" y="560" width="1040" height="70" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2"/><text x="800" y="605" font-size="24" font-weight="800" fill="#0A0A0A" text-anchor="middle">Sign with your In-App Purchase key: ECDSA P-256, SHA-256</text><line x1="800" y1="630" x2="800" y2="690" stroke="#0A0A0A" stroke-width="3"/><polygon points="800,690 791,676 809,676" fill="#0A0A0A"/><rect x="280" y="690" width="1040" height="70" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2"/><text x="800" y="735" font-size="24" font-weight="800" fill="#0A0A0A" text-anchor="middle">DER signature, Base64 encoded</text><line x1="80" y1="846" x2="1520" y2="846" stroke="#E5E5E5" stroke-width="2"/><text x="80" y="880" font-size="22" font-weight="500" fill="#525252" text-anchor="start">Source: Apple, Generating a signature for promotional offers (developer.apple.com/documentation/storekit)</text></svg>