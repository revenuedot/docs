<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" width="1600" height="640" role="img" aria-labelledby="t d"><title id="t">Where each React Native runtime can buy</title><desc id="d">Expo Go and web accept a Test Store key only. A development build or bare React Native app makes real store purchases.</desc><rect width="1600" height="640" fill="#FFFFFF"/><text x="116" y="124" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#0A0A0A" text-anchor="start">Runtime</text><text x="546" y="124" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#0A0A0A" text-anchor="start">Real store purchase</text><text x="876" y="124" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#0A0A0A" text-anchor="start">Test Store key</text><text x="1206" y="124" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#0A0A0A" text-anchor="start">Key to ship</text><line x1="100" y1="146" x2="1500" y2="146" stroke="#0A0A0A" stroke-width="3"/><text x="116" y="200" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#0A0A0A" text-anchor="start">Expo Go</text><text x="546" y="200" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#525252" text-anchor="start">No</text><text x="876" y="200" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#525252" text-anchor="start">Yes</text><text x="1206" y="200" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#525252" text-anchor="start">test_ only</text><line x1="100" y1="230" x2="1500" y2="230" stroke="#E5E5E5" stroke-width="2"/><text x="116" y="284" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#0A0A0A" text-anchor="start">Expo development build</text><text x="546" y="284" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#525252" text-anchor="start">Yes</text><text x="876" y="284" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#525252" text-anchor="start">Yes, Debug builds</text><text x="1206" y="284" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#525252" text-anchor="start">appl_ or goog_</text><line x1="100" y1="314" x2="1500" y2="314" stroke="#E5E5E5" stroke-width="2"/><text x="116" y="368" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#0A0A0A" text-anchor="start">Bare React Native</text><text x="546" y="368" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#525252" text-anchor="start">Yes</text><text x="876" y="368" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#525252" text-anchor="start">Yes, Debug builds</text><text x="1206" y="368" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#525252" text-anchor="start">appl_ or goog_</text><line x1="100" y1="398" x2="1500" y2="398" stroke="#E5E5E5" stroke-width="2"/><text x="116" y="452" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#0A0A0A" text-anchor="start">Web (react-native-web)</text><text x="546" y="452" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#525252" text-anchor="start">No</text><text x="876" y="452" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#525252" text-anchor="start">Yes</text><text x="1206" y="452" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#525252" text-anchor="start">test_ only</text><line x1="100" y1="482" x2="1500" y2="482" stroke="#E5E5E5" stroke-width="2"/></svg>