<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d" font-family="Manrope, Helvetica, Arial, sans-serif"><title id="t">Three ways a failed renewal ends</title><desc id="d">Payment fixed in grace keeps the renewal date, fixed after grace moves the billing date, never fixed means the subscription expires.</desc><rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/><rect x="80" y="56" width="64" height="10" fill="#F7B500"/><text x="80" y="150" font-size="48" font-weight="800" fill="#0A0A0A" text-anchor="start">Three ways a failed renewal ends</text><text x="80" y="200" font-size="26" font-weight="500" fill="#525252" text-anchor="start">Illustration with a 16-day grace period. The same shape applies on Google Play.</text><line x1="360" y1="300" x2="1480" y2="300" stroke="#0A0A0A" stroke-width="2"/><text x="360" y="285" font-size="22" font-weight="500" fill="#525252" text-anchor="start">Day 0</text><text x="1480" y="285" font-size="22" font-weight="500" fill="#525252" text-anchor="end">Day 60</text><text x="80" y="360" font-size="28" font-weight="800" fill="#0A0A0A" text-anchor="start">A. Payment fixed inside the grace period</text><rect x="360" y="380" width="299" height="56" fill="#0A0A0A"/><rect x="659" y="380" width="821" height="56" fill="#E5E5E5"/><rect x="519" y="390" width="18" height="36" fill="#F7B500"/><text x="679" y="420" font-size="22" font-weight="800" fill="#0A0A0A" text-anchor="start">fixed on day 9</text><text x="360" y="470" font-size="24" font-weight="500" fill="#525252" text-anchor="start">No gap in access. The renewal date stays the same.</text><text x="80" y="530" font-size="28" font-weight="800" fill="#0A0A0A" text-anchor="start">B. Payment fixed after the grace period</text><rect x="360" y="550" width="299" height="56" fill="#0A0A0A"/><rect x="659" y="550" width="821" height="56" fill="#E5E5E5"/><rect x="948" y="560" width="18" height="36" fill="#F7B500"/><text x="977" y="590" font-size="22" font-weight="800" fill="#0A0A0A" text-anchor="start">fixed on day 32</text><text x="360" y="640" font-size="24" font-weight="500" fill="#525252" text-anchor="start">Access returns. The billing date moves to the day of recovery.</text><text x="80" y="700" font-size="28" font-weight="800" fill="#0A0A0A" text-anchor="start">C. Payment never fixed</text><rect x="360" y="720" width="299" height="56" fill="#0A0A0A"/><rect x="659" y="720" width="821" height="56" fill="#E5E5E5"/><text x="360" y="810" font-size="24" font-weight="500" fill="#525252" text-anchor="start">The subscription expires when retry ends. Access ended when grace ended.</text><line x1="80" y1="846" x2="1520" y2="846" stroke="#E5E5E5" stroke-width="2"/><text x="80" y="880" font-size="22" font-weight="500" fill="#525252" text-anchor="start">Sources: Apple, Reducing involuntary subscriber churn; Google, Subscription lifecycle</text></svg>