<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d" font-family="Manrope, Helvetica, Arial, sans-serif"><title id="t">Failed renewals: grace period, retry and account hold</title><desc id="d">Two 60-day timelines. App Store: 16-day grace with access, then billing retry. Google Play: 7-day grace, then account hold.</desc><rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/><rect x="80" y="56" width="64" height="10" fill="#F7B500"/><text x="80" y="170" font-size="64" font-weight="800" fill="#0A0A0A" text-anchor="start">Failed renewals: grace period,</text><text x="80" y="245" font-size="64" font-weight="800" fill="#0A0A0A" text-anchor="start">retry and account hold</text><text x="80" y="305" font-size="28" font-weight="500" fill="#525252" text-anchor="start">How long each store keeps trying, and when access stops</text><line x1="360" y1="380" x2="1480" y2="380" stroke="#0A0A0A" stroke-width="2"/><line x1="360" y1="370" x2="360" y2="390" stroke="#0A0A0A" stroke-width="2"/><line x1="1480" y1="370" x2="1480" y2="390" stroke="#0A0A0A" stroke-width="2"/><text x="360" y="360" font-size="22" font-weight="500" fill="#525252" text-anchor="start">Day 0: renewal fails</text><text x="1480" y="360" font-size="22" font-weight="500" fill="#525252" text-anchor="end">Day 60</text><text x="80" y="454" font-size="30" font-weight="800" fill="#0A0A0A" text-anchor="start">App Store</text><text x="80" y="488" font-size="22" font-weight="500" fill="#525252" text-anchor="start">Example: 16-day grace</text><rect x="360" y="420" width="299" height="90" fill="#0A0A0A"/><text x="509" y="474" font-size="24" font-weight="800" fill="#FFFFFF" text-anchor="middle">Grace: access</text><rect x="659" y="420" width="821" height="90" fill="#E5E5E5"/><text x="1069" y="474" font-size="24" font-weight="800" fill="#0A0A0A" text-anchor="middle">Billing retry: no access</text><text x="80" y="614" font-size="30" font-weight="800" fill="#0A0A0A" text-anchor="start">Google Play</text><text x="80" y="648" font-size="22" font-weight="500" fill="#525252" text-anchor="start">Example: 7-day grace</text><rect x="360" y="580" width="131" height="90" fill="#0A0A0A"/><text x="425" y="634" font-size="24" font-weight="800" fill="#FFFFFF" text-anchor="middle">Grace</text><rect x="491" y="580" width="989" height="90" fill="#E5E5E5"/><text x="985" y="634" font-size="24" font-weight="800" fill="#0A0A0A" text-anchor="middle">Account hold: no access</text><rect x="360" y="730" width="28" height="28" fill="#0A0A0A"/><text x="404" y="754" font-size="24" font-weight="500" fill="#0A0A0A" text-anchor="start">Access kept</text><rect x="660" y="730" width="28" height="28" fill="#E5E5E5"/><text x="704" y="754" font-size="24" font-weight="500" fill="#0A0A0A" text-anchor="start">No access, store keeps retrying</text><line x1="80" y1="846" x2="1520" y2="846" stroke="#E5E5E5" stroke-width="2"/><text x="80" y="880" font-size="22" font-weight="500" fill="#525252" text-anchor="start">Sources: Apple, Reducing involuntary subscriber churn; Google, Subscription lifecycle and Play Console Help</text></svg>