<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d" font-family="Manrope, Helvetica, Arial, sans-serif"><title id="t">Flutter in_app_purchase vs purchases_flutter</title><desc id="d">Two columns: in_app_purchase leaves verification, renewals and cross-platform access to your own server, while purchases_flutter sends purchases to a backend that handles them.</desc><rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/><rect x="80" y="56" width="64" height="10" fill="#F7B500"/><text x="80" y="170" font-size="64" font-weight="800" fill="#0A0A0A">Flutter: in_app_purchase</text><text x="80" y="245" font-size="64" font-weight="800" fill="#0A0A0A">vs purchases_flutter</text><text x="80" y="305" font-size="28" font-weight="500" fill="#525252">Who verifies the purchase decides how much you build</text><rect x="80" y="350" width="700" height="440" fill="none" stroke="#0A0A0A" stroke-width="2"/><text x="108" y="402" font-size="34" font-weight="800" fill="#0A0A0A">in_app_purchase</text><text x="108" y="438" font-size="22" font-weight="500" fill="#525252">flutter.dev, BSD-3-Clause</text><rect x="108" y="472" width="14" height="14" fill="#F7B500"/><text x="138" y="490" font-size="26" font-weight="500" fill="#0A0A0A">Products and the purchase sheet</text><rect x="108" y="532" width="14" height="14" fill="#F7B500"/><text x="138" y="550" font-size="26" font-weight="500" fill="#0A0A0A">Hands you the store receipt</text><rect x="108" y="592" width="14" height="14" fill="#F7B500"/><text x="138" y="610" font-size="26" font-weight="500" fill="#0A0A0A">Your server verifies it</text><rect x="108" y="652" width="14" height="14" fill="#F7B500"/><text x="138" y="670" font-size="26" font-weight="500" fill="#0A0A0A">Your server tracks renewals</text><rect x="108" y="712" width="14" height="14" fill="#F7B500"/><text x="138" y="730" font-size="26" font-weight="500" fill="#0A0A0A">Your code completes in 3 days</text><rect x="820" y="350" width="700" height="440" fill="none" stroke="#0A0A0A" stroke-width="2"/><text x="848" y="402" font-size="34" font-weight="800" fill="#0A0A0A">purchases_flutter</text><text x="848" y="438" font-size="22" font-weight="500" fill="#525252">RevenueCat SDK, MIT</text><rect x="848" y="472" width="14" height="14" fill="#F7B500"/><text x="878" y="490" font-size="26" font-weight="500" fill="#0A0A0A">Offerings and the purchase sheet</text><rect x="848" y="532" width="14" height="14" fill="#F7B500"/><text x="878" y="550" font-size="26" font-weight="500" fill="#0A0A0A">Backend verifies every purchase</text><rect x="848" y="592" width="14" height="14" fill="#F7B500"/><text x="878" y="610" font-size="26" font-weight="500" fill="#0A0A0A">Backend tracks renewals, refunds</text><rect x="848" y="652" width="14" height="14" fill="#F7B500"/><text x="878" y="670" font-size="26" font-weight="500" fill="#0A0A0A">One entitlement on iOS and Android</text><rect x="848" y="712" width="14" height="14" fill="#F7B500"/><text x="878" y="730" font-size="26" font-weight="500" fill="#0A0A0A">Backend: RevenueCat or RevenueDot</text><line x1="80" y1="846" x2="1520" y2="846" stroke="#E5E5E5" stroke-width="2"/><text x="80" y="880" font-size="22" font-weight="500" fill="#525252">Sources: pub.dev package pages, Google's Flutter in-app purchases codelab, RevenueCat pricing</text></svg>