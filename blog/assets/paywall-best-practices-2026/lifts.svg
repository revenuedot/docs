<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d" font-family="Manrope, Helvetica, Arial, sans-serif"><title id="t">Six paywall changes and the lift each source reports</title><desc id="d">Horizontal bars: simple paywall +111%, reviews and statistic +72%, timeline +50%, multi-page +37%, trial reminder +23%, reviews and anchoring +17%.</desc><rect width="1600" height="900" fill="#FFFFFF"/><rect x="80" y="56" width="64" height="10" fill="#F7B500"/><text x="80" y="128" font-size="42" font-weight="800" fill="#0A0A0A" text-anchor="start">Six paywall changes and the lift each source reports</text><text x="80" y="176" font-size="26" font-weight="500" fill="#525252" text-anchor="start">Each row has its own metric, so compare bars only as a rough guide.</text><line x1="80" y1="846" x2="1520" y2="846" stroke="#E5E5E5" stroke-width="2"/><text x="80" y="880" font-size="22" font-weight="500" fill="#525252" text-anchor="start">Sources: Superwall, RevenueCat, Growth.design case studies, checked October 2026. Results are the sources' own.</text><text x="80" y="244" font-size="26" font-weight="800" fill="#0A0A0A" text-anchor="start">Simple paywall, no comparison chart</text><text x="80" y="276" font-size="22" font-weight="500" fill="#525252" text-anchor="start">Conversion lift (Superwall)</text><rect x="760" y="222" width="640.0" height="52" fill="#0A0A0A"/><text x="1416.0" y="262" font-size="34" font-weight="800" fill="#0A0A0A" text-anchor="start">+111%</text><line x1="80" y1="304" x2="1520" y2="304" stroke="#E5E5E5" stroke-width="2"/><text x="80" y="344" font-size="26" font-weight="800" fill="#0A0A0A" text-anchor="start">Reviews, a statistic, price anchoring</text><text x="80" y="376" font-size="22" font-weight="500" fill="#525252" text-anchor="start">Install-to-trial lift (RevenueCat)</text><rect x="760" y="322" width="415.13513513513516" height="52" fill="#0A0A0A"/><text x="1191.1351351351352" y="362" font-size="34" font-weight="800" fill="#0A0A0A" text-anchor="start">+72%</text><line x1="80" y1="404" x2="1520" y2="404" stroke="#E5E5E5" stroke-width="2"/><text x="80" y="444" font-size="26" font-weight="800" fill="#0A0A0A" text-anchor="start">Timeline paywall (Pepper)</text><text x="80" y="476" font-size="22" font-weight="500" fill="#525252" text-anchor="start">Lifetime value lift (Superwall)</text><rect x="760" y="422" width="288.2882882882883" height="52" fill="#0A0A0A"/><text x="1064.2882882882882" y="462" font-size="34" font-weight="800" fill="#0A0A0A" text-anchor="start">+50%</text><line x1="80" y1="504" x2="1520" y2="504" stroke="#E5E5E5" stroke-width="2"/><text x="80" y="544" font-size="26" font-weight="800" fill="#0A0A0A" text-anchor="start">Two or more pages, not one</text><text x="80" y="576" font-size="22" font-weight="500" fill="#525252" text-anchor="start">Conversion lift (Superwall)</text><rect x="760" y="522" width="213.33333333333334" height="52" fill="#0A0A0A"/><text x="989.3333333333334" y="562" font-size="34" font-weight="800" fill="#0A0A0A" text-anchor="start">+37%</text><line x1="80" y1="604" x2="1520" y2="604" stroke="#E5E5E5" stroke-width="2"/><text x="80" y="644" font-size="26" font-weight="800" fill="#0A0A0A" text-anchor="start">Trial reminder and clear terms (Blinkist)</text><text x="80" y="676" font-size="22" font-weight="500" fill="#525252" text-anchor="start">Trial conversion lift (Growth.design)</text><rect x="760" y="622" width="132.61261261261262" height="52" fill="#0A0A0A"/><text x="908.6126126126126" y="662" font-size="34" font-weight="800" fill="#0A0A0A" text-anchor="start">+23%</text><line x1="80" y1="704" x2="1520" y2="704" stroke="#E5E5E5" stroke-width="2"/><text x="80" y="744" font-size="26" font-weight="800" fill="#0A0A0A" text-anchor="start">Real reviews plus weekly price anchoring</text><text x="80" y="776" font-size="22" font-weight="500" fill="#525252" text-anchor="start">Revenue per user lift (RevenueCat)</text><rect x="760" y="722" width="98.01801801801801" height="52" fill="#0A0A0A"/><text x="874.018018018018" y="762" font-size="34" font-weight="800" fill="#0A0A0A" text-anchor="start">+17%</text><line x1="80" y1="804" x2="1520" y2="804" stroke="#E5E5E5" stroke-width="2"/></svg>
