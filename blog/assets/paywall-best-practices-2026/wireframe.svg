<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d" font-family="Manrope, Helvetica, Arial, sans-serif"><title id="t">The paywall, top to bottom, in nine parts</title><desc id="d">A phone wireframe with nine numbered parts: close and restore, headline, benefits, trial timeline, social proof, plan cards, button, disclosure, exit drawer.</desc><rect width="1600" height="900" fill="#FFFFFF"/><rect x="80" y="56" width="64" height="10" fill="#F7B500"/><text x="80" y="128" font-size="44" font-weight="800" fill="#0A0A0A" text-anchor="start">The paywall, top to bottom, in nine parts</text><text x="80" y="176" font-size="26" font-weight="500" fill="#525252" text-anchor="start">Native controls, one accent colour, the billed price largest.</text><line x1="80" y1="846" x2="1520" y2="846" stroke="#E5E5E5" stroke-width="2"/><text x="80" y="880" font-size="22" font-weight="500" fill="#525252" text-anchor="start">Layout: RevenueDot template gallery. Apple: billed amount must be the most prominent price (developer.apple.com/app-store/subscriptions).</text><rect x="140" y="200" width="420" height="630" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="4"/><rect x="310.0" y="210" width="80" height="10" fill="#0A0A0A"/><text x="164" y="262" font-size="26" font-weight="500" fill="#525252" text-anchor="start">X</text><text x="536" y="262" font-size="22" font-weight="500" fill="#525252" text-anchor="end">Restore</text><text x="350.0" y="310" font-size="30" font-weight="800" fill="#0A0A0A" text-anchor="middle">Your plan is ready</text><rect x="180" y="338" width="22" height="22" fill="#0A0A0A"/><text x="220" y="357" font-size="22" font-weight="500" fill="#0A0A0A" text-anchor="start">Personal daily plan</text><rect x="180" y="372" width="22" height="22" fill="#0A0A0A"/><text x="220" y="391" font-size="22" font-weight="500" fill="#0A0A0A" text-anchor="start">Reminders that adapt</text><rect x="180" y="406" width="22" height="22" fill="#0A0A0A"/><text x="220" y="425" font-size="22" font-weight="500" fill="#0A0A0A" text-anchor="start">Works offline</text><rect x="220" y="455" width="20" height="20" fill="#F7B500"/><text x="230" y="505" font-size="22" font-weight="500" fill="#0A0A0A" text-anchor="middle">Today</text><rect x="340" y="455" width="20" height="20" fill="#0A0A0A"/><text x="350" y="505" font-size="22" font-weight="500" fill="#0A0A0A" text-anchor="middle">Day 5</text><rect x="460" y="455" width="20" height="20" fill="#0A0A0A"/><text x="470" y="505" font-size="22" font-weight="500" fill="#0A0A0A" text-anchor="middle">Day 7</text><line x1="230" y1="465" x2="470" y2="465" stroke="#0A0A0A" stroke-width="3"/><text x="350.0" y="550" font-size="22" font-weight="500" fill="#525252" text-anchor="middle">4.8 rating  |  120K users</text><rect x="160" y="572" width="180" height="100" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="4"/><rect x="360" y="572" width="180" height="100" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"/><rect x="170" y="558" width="128" height="28" fill="#F7B500"/><text x="234" y="580" font-size="22" font-weight="800" fill="#0A0A0A" text-anchor="middle">SAVE 60%</text><text x="180" y="620" font-size="24" font-weight="800" fill="#0A0A0A" text-anchor="start">Annual</text><text x="180" y="654" font-size="22" font-weight="500" fill="#525252" text-anchor="start">$39.99/yr</text><text x="380" y="620" font-size="24" font-weight="800" fill="#0A0A0A" text-anchor="start">Weekly</text><text x="380" y="654" font-size="22" font-weight="500" fill="#525252" text-anchor="start">$4.99/wk</text><rect x="160" y="692" width="380" height="52" fill="#0A0A0A"/><text x="350.0" y="727" font-size="26" font-weight="800" fill="#FFFFFF" text-anchor="middle">Start free trial</text><text x="350.0" y="772" font-size="22" font-weight="500" fill="#525252" text-anchor="middle">3 days free, then $39.99/year</text><text x="350.0" y="804" font-size="22" font-weight="500" fill="#525252" text-anchor="middle">Terms  |  Privacy</text><line x1="560" y1="262" x2="650" y2="250" stroke="#E5E5E5" stroke-width="2"/><rect x="650" y="230" width="40" height="40" fill="#F7B500"/><text x="670.0" y="258.0" font-size="26" font-weight="800" fill="#0A0A0A" text-anchor="middle">1</text><text x="710" y="259" font-size="28" font-weight="500" fill="#0A0A0A" text-anchor="start">Small X at top left, Restore at top right</text><line x1="560" y1="310" x2="650" y2="316" stroke="#E5E5E5" stroke-width="2"/><rect x="650" y="296" width="40" height="40" fill="#F7B500"/><text x="670.0" y="324.0" font-size="26" font-weight="800" fill="#0A0A0A" text-anchor="middle">2</text><text x="710" y="325" font-size="28" font-weight="500" fill="#0A0A0A" text-anchor="start">Headline built from the quiz answers</text><line x1="560" y1="390" x2="650" y2="382" stroke="#E5E5E5" stroke-width="2"/><rect x="650" y="362" width="40" height="40" fill="#F7B500"/><text x="670.0" y="390.0" font-size="26" font-weight="800" fill="#0A0A0A" text-anchor="middle">3</text><text x="710" y="391" font-size="28" font-weight="500" fill="#0A0A0A" text-anchor="start">Three to five benefit lines</text><line x1="560" y1="470" x2="650" y2="448" stroke="#E5E5E5" stroke-width="2"/><rect x="650" y="428" width="40" height="40" fill="#F7B500"/><text x="670.0" y="456.0" font-size="26" font-weight="800" fill="#0A0A0A" text-anchor="middle">4</text><text x="710" y="457" font-size="28" font-weight="500" fill="#0A0A0A" text-anchor="start">Trial timeline: today, reminder, charge</text><line x1="560" y1="550" x2="650" y2="514" stroke="#E5E5E5" stroke-width="2"/><rect x="650" y="494" width="40" height="40" fill="#F7B500"/><text x="670.0" y="522.0" font-size="26" font-weight="800" fill="#0A0A0A" text-anchor="middle">5</text><text x="710" y="523" font-size="28" font-weight="500" fill="#0A0A0A" text-anchor="start">Social proof: rating and user count</text><line x1="560" y1="620" x2="650" y2="580" stroke="#E5E5E5" stroke-width="2"/><rect x="650" y="560" width="40" height="40" fill="#F7B500"/><text x="670.0" y="588.0" font-size="26" font-weight="800" fill="#0A0A0A" text-anchor="middle">6</text><text x="710" y="589" font-size="28" font-weight="500" fill="#0A0A0A" text-anchor="start">Two plans, annual pre-selected, savings badge</text><line x1="560" y1="710" x2="650" y2="646" stroke="#E5E5E5" stroke-width="2"/><rect x="650" y="626" width="40" height="40" fill="#F7B500"/><text x="670.0" y="654.0" font-size="26" font-weight="800" fill="#0A0A0A" text-anchor="middle">7</text><text x="710" y="655" font-size="28" font-weight="500" fill="#0A0A0A" text-anchor="start">Full-width button, plain label</text><line x1="560" y1="772" x2="650" y2="712" stroke="#E5E5E5" stroke-width="2"/><rect x="650" y="692" width="40" height="40" fill="#F7B500"/><text x="670.0" y="720.0" font-size="26" font-weight="800" fill="#0A0A0A" text-anchor="middle">8</text><text x="710" y="721" font-size="28" font-weight="500" fill="#0A0A0A" text-anchor="start">One disclosure line, Terms and Privacy</text><line x1="560" y1="804" x2="650" y2="778" stroke="#E5E5E5" stroke-width="2"/><rect x="650" y="758" width="40" height="40" fill="#F7B500"/><text x="670.0" y="786.0" font-size="26" font-weight="800" fill="#0A0A0A" text-anchor="middle">9</text><text x="710" y="787" font-size="28" font-weight="500" fill="#0A0A0A" text-anchor="start">Tap X: exit drawer with a shorter plan</text></svg>
