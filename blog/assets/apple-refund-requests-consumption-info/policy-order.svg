<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700" role="img" aria-labelledby="t d"><title id="t">Refund Control policies are checked in order</title><desc id="d">Policies are checked top to bottom. The first one whose conditions match the customer decides. The default policy covers everyone else.</desc><rect width="1600" height="700" fill="#FFFFFF"/><text x="100" y="100" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#0A0A0A" text-anchor="start">The first matching policy decides</text><rect x="100" y="150" width="1400" height="100" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"/><text x="140" y="212" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="36" font-weight="800" fill="#0A0A0A" text-anchor="start">1</text><text x="220" y="194" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#0A0A0A" text-anchor="start">Recent renewal</text><text x="220" y="230" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#525252" text-anchor="start">renewed in the last 24 hours</text><line x1="700" y1="200" x2="900" y2="200" stroke="#0A0A0A" stroke-width="3"/><polygon points="900,200 884.0,208.0 884.0,192.0" fill="#0A0A0A"/><text x="940" y="210" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#0A0A0A" text-anchor="start">Prefer full refund</text><rect x="100" y="274" width="1400" height="100" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"/><text x="140" y="336" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="36" font-weight="800" fill="#0A0A0A" text-anchor="start">2</text><text x="220" y="318" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#0A0A0A" text-anchor="start">First purchase</text><text x="220" y="354" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#525252" text-anchor="start">within the last 7 days</text><line x1="700" y1="324" x2="900" y2="324" stroke="#0A0A0A" stroke-width="3"/><polygon points="900,324 884.0,332.0 884.0,316.0" fill="#0A0A0A"/><text x="940" y="334" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#0A0A0A" text-anchor="start">Send consumption data only</text><rect x="100" y="398" width="1400" height="100" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"/><text x="140" y="460" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="36" font-weight="800" fill="#0A0A0A" text-anchor="start">3</text><text x="220" y="442" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#0A0A0A" text-anchor="start">Platform</text><text x="220" y="478" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#525252" text-anchor="start">iOS</text><line x1="700" y1="448" x2="900" y2="448" stroke="#0A0A0A" stroke-width="3"/><polygon points="900,448 884.0,456.0 884.0,440.0" fill="#0A0A0A"/><text x="940" y="458" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#0A0A0A" text-anchor="start">Prefer no refund</text><rect x="100" y="522" width="1400" height="100" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="3"/><text x="140" y="584" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="36" font-weight="800" fill="#0A0A0A" text-anchor="start">D</text><text x="220" y="566" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#0A0A0A" text-anchor="start">Default policy</text><text x="220" y="602" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#525252" text-anchor="start">everyone else</text><line x1="700" y1="572" x2="900" y2="572" stroke="#0A0A0A" stroke-width="3"/><polygon points="900,572 884.0,580.0 884.0,564.0" fill="#0A0A0A"/><text x="940" y="582" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#0A0A0A" text-anchor="start">Send consumption data only</text><text x="100" y="670" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#525252" text-anchor="start">Examples only. You choose the conditions and the preference for each policy.</text></svg>