<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d"><title id="t">Timeline: customer asks Apple for a refund, Apple sends CONSUMPTION_REQUEST, the developer answers within 12 hours, Apple grants or declines the refund</title><desc id="d">Timeline: customer asks Apple for a refund, Apple sends CONSUMPTION_REQUEST, the developer answers within 12 hours, Apple grants or declines the refund</desc><rect width="1600" height="900" fill="#FFFFFF"/><rect x="100" y="100" width="22" height="22" fill="#F7B500"/><text x="138" y="120" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#0A0A0A" text-anchor="start">REVENUEDOT</text><text x="100" y="330" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="62" font-weight="800" fill="#0A0A0A" text-anchor="start">Answer Apple&#x27;s</text><text x="100" y="406" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="62" font-weight="800" fill="#0A0A0A" text-anchor="start">refund requests</text><text x="100" y="500" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="30" font-weight="400" fill="#525252" text-anchor="start">CONSUMPTION_REQUEST, what Apple</text><text x="100" y="546" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="30" font-weight="400" fill="#525252" text-anchor="start">asks and how to reply in 12 hours</text><line x1="100" y1="800" x2="1500" y2="800" stroke="#E5E5E5" stroke-width="2"/><text x="100" y="850" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#525252" text-anchor="start">revenuedot.app/blog</text><rect x="960" y="170" width="520" height="110" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"/><text x="1220.0" y="214.92" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#0A0A0A" text-anchor="middle">Customer asks Apple</text><text x="1220.0" y="250.92" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#525252" text-anchor="middle">for a refund</text><line x1="1220.0" y1="280" x2="1220.0" y2="325" stroke="#0A0A0A" stroke-width="3"/><polygon points="1220.0,325 1212.0,309.0 1228.0,309.0" fill="#0A0A0A"/><rect x="960" y="325" width="520" height="110" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"/><text x="1220.0" y="369.92" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#0A0A0A" text-anchor="middle">CONSUMPTION_REQUEST</text><text x="1220.0" y="405.92" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#525252" text-anchor="middle">sent to your server</text><line x1="1220.0" y1="435" x2="1220.0" y2="480" stroke="#0A0A0A" stroke-width="3"/><polygon points="1220.0,480 1212.0,464.0 1228.0,464.0" fill="#0A0A0A"/><rect x="960" y="480" width="520" height="110" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="3"/><rect x="974" y="494" width="14" height="14" fill="#F7B500"/><text x="1220.0" y="524.92" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#0A0A0A" text-anchor="middle">You answer in 12 hours</text><text x="1220.0" y="560.92" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#525252" text-anchor="middle">consumption information</text><line x1="1220.0" y1="590" x2="1220.0" y2="635" stroke="#0A0A0A" stroke-width="3"/><polygon points="1220.0,635 1212.0,619.0 1228.0,619.0" fill="#0A0A0A"/><rect x="960" y="635" width="520" height="110" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"/><text x="1220.0" y="679.92" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#0A0A0A" text-anchor="middle">REFUND or REFUND_DECLINED</text><text x="1220.0" y="715.92" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#525252" text-anchor="middle">Apple decides</text></svg>