<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d" font-family="Manrope, Helvetica, Arial, sans-serif"><title id="t">Superwall concepts and their RevenueDot equivalents</title><desc id="d">Campaigns, placements, audiences and experiments in Superwall map to targeting rules, placements, audiences and experiments in RevenueDot.</desc><rect width="1600" height="900" fill="#FFFFFF"/><rect x="80" y="56" width="64" height="10" fill="#F7B500"/><text x="80" y="128" font-size="44" font-weight="800" fill="#0A0A0A" text-anchor="start">Superwall concepts and their RevenueDot equivalents</text><text x="80" y="176" font-size="26" font-weight="500" fill="#525252" text-anchor="start">Rebuild each one once. The app code reads offerings instead of registering placements.</text><rect x="80" y="220" width="700" height="84" fill="#0A0A0A" stroke="#0A0A0A" stroke-width="2"/><rect x="780" y="220" width="740" height="84" fill="#0A0A0A" stroke="#0A0A0A" stroke-width="2"/><text x="110" y="274" font-size="28" font-weight="800" fill="#FFFFFF" text-anchor="start">Superwall</text><text x="810" y="274" font-size="28" font-weight="800" fill="#FFFFFF" text-anchor="start">RevenueDot</text><rect x="80" y="304" width="700" height="84" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"/><rect x="780" y="304" width="740" height="84" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"/><text x="110" y="358" font-size="28" font-weight="500" fill="#0A0A0A" text-anchor="start">Placement registered with register()</text><text x="810" y="358" font-size="28" font-weight="500" fill="#0A0A0A" text-anchor="start">Placement on a targeting rule</text><rect x="80" y="388" width="700" height="84" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"/><rect x="780" y="388" width="740" height="84" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"/><text x="110" y="442" font-size="28" font-weight="500" fill="#0A0A0A" text-anchor="start">Audience filter in a campaign</text><text x="810" y="442" font-size="28" font-weight="500" fill="#0A0A0A" text-anchor="start">Audience under Targeting</text><rect x="80" y="472" width="700" height="84" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"/><rect x="780" y="472" width="740" height="84" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"/><text x="110" y="526" font-size="28" font-weight="500" fill="#0A0A0A" text-anchor="start">Paywall in the editor</text><text x="810" y="526" font-size="28" font-weight="500" fill="#0A0A0A" text-anchor="start">Paywall from a template or the editor</text><rect x="80" y="556" width="700" height="84" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"/><rect x="780" y="556" width="740" height="84" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"/><text x="110" y="610" font-size="28" font-weight="500" fill="#0A0A0A" text-anchor="start">Percentage split between paywalls</text><text x="810" y="610" font-size="28" font-weight="500" fill="#0A0A0A" text-anchor="start">Experiment between two offerings</text><rect x="80" y="640" width="700" height="84" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"/><rect x="780" y="640" width="740" height="84" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"/><text x="110" y="694" font-size="28" font-weight="500" fill="#0A0A0A" text-anchor="start">Webhooks</text><text x="810" y="694" font-size="28" font-weight="500" fill="#0A0A0A" text-anchor="start">Webhooks in RevenueCat's shape</text><line x1="80" y1="846" x2="1520" y2="846" stroke="#E5E5E5" stroke-width="2"/><text x="80" y="880" font-size="22" font-weight="500" fill="#525252" text-anchor="start">Sources: superwall.com/docs (campaigns, placements, audiences), revenuedot.app/docs/guides/targeting-and-experiments</text></svg>