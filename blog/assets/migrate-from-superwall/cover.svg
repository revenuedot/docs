<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d" font-family="Manrope, Helvetica, Arial, sans-serif"><title id="t">Two layers to move off Superwall</title><desc id="d">Superwall provides a paywall layer and a subscription layer. You can replace either one or both with RevenueDot.</desc><rect width="1600" height="900" fill="#FFFFFF"/><rect x="80" y="56" width="64" height="10" fill="#F7B500"/><text x="80" y="150" font-size="60" font-weight="800" fill="#0A0A0A" text-anchor="start">Superwall is two layers. Move one or both.</text><text x="80" y="205" font-size="30" font-weight="500" fill="#525252" text-anchor="start">Paywalls decide what users see. The backend decides who has access.</text><rect x="80" y="290" width="450" height="340" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2"/><text x="96" y="395" font-size="32" font-weight="800" fill="#0A0A0A" text-anchor="start">A. Keep paywalls</text><text x="96" y="438" font-size="26" font-weight="500" fill="#525252" text-anchor="start">Replace the backend</text><text x="96" y="473" font-size="14" font-weight="500" fill="#525252" text-anchor="start"></text><text x="96" y="492" font-size="24" font-weight="500" fill="#525252" text-anchor="start">Superwall paywalls stay.</text><text x="96" y="524" font-size="24" font-weight="500" fill="#525252" text-anchor="start">RevenueDot decides access</text><text x="96" y="557" font-size="24" font-weight="500" fill="#525252" text-anchor="start">through the RevenueCat SDK.</text><rect x="575" y="290" width="450" height="340" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2"/><text x="591" y="395" font-size="32" font-weight="800" fill="#0A0A0A" text-anchor="start">B. Replace paywalls</text><text x="591" y="438" font-size="26" font-weight="500" fill="#525252" text-anchor="start">Keep a backend</text><text x="591" y="473" font-size="14" font-weight="500" fill="#525252" text-anchor="start"></text><text x="591" y="492" font-size="24" font-weight="500" fill="#525252" text-anchor="start">RevenueDot paywalls and</text><text x="591" y="524" font-size="24" font-weight="500" fill="#525252" text-anchor="start">targeting replace placements.</text><text x="591" y="557" font-size="24" font-weight="500" fill="#525252" text-anchor="start">Your backend choice is open.</text><rect x="1070" y="290" width="450" height="340" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="4"/><text x="1086" y="395" font-size="32" font-weight="800" fill="#0A0A0A" text-anchor="start">C. Replace both</text><text x="1086" y="438" font-size="26" font-weight="500" fill="#525252" text-anchor="start">One system</text><text x="1086" y="473" font-size="14" font-weight="500" fill="#525252" text-anchor="start"></text><text x="1086" y="492" font-size="24" font-weight="500" fill="#525252" text-anchor="start">RevenueCat SDK, RevenueDot</text><text x="1086" y="524" font-size="24" font-weight="500" fill="#525252" text-anchor="start">backend and paywalls.</text><text x="1086" y="557" font-size="24" font-weight="500" fill="#525252" text-anchor="start">No Superwall SDK left.</text><text x="80" y="700" font-size="26" font-weight="500" fill="#525252" text-anchor="start">Superwall bills 1% only on revenue that flows through its own paywalls, above $10K a month.</text><text x="80" y="746" font-size="26" font-weight="500" fill="#525252" text-anchor="start">Moving paywalls off Superwall removes that bill. Moving only the backend does not.</text><line x1="80" y1="846" x2="1520" y2="846" stroke="#E5E5E5" stroke-width="2"/><text x="80" y="880" font-size="22" font-weight="500" fill="#525252" text-anchor="start">Sources: superwall.com/pricing, superwall.com/docs (Using RevenueCat), revenuedot.app/docs/guides/paywalls</text></svg>