<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d" font-family="Manrope, Helvetica, Arial, sans-serif"><title id="t">A three-page paywall: value, then trial, then price</title><desc id="d">Three phone wireframes: page 1 value with benefits and a review, page 2 trial timeline, page 3 plan cards and the purchase button.</desc><rect width="1600" height="900" fill="#FFFFFF"/><rect x="80" y="56" width="64" height="10" fill="#F7B500"/><text x="80" y="128" font-size="44" font-weight="800" fill="#0A0A0A" text-anchor="start">A three-page paywall: value, then trial, then price</text><text x="80" y="176" font-size="26" font-weight="500" fill="#525252" text-anchor="start">Each page does one job. The button on pages 1 and 2 says Continue.</text><line x1="80" y1="846" x2="1520" y2="846" stroke="#E5E5E5" stroke-width="2"/><text x="80" y="880" font-size="22" font-weight="500" fill="#525252" text-anchor="start">Layout: RevenueDot Story pages and Trial timeline templates. Superwall suggests two to three screens.</text><rect x="100" y="215" width="380" height="600" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="4"/><rect x="250.0" y="225" width="80" height="10" fill="#0A0A0A"/><text x="124" y="275" font-size="26" font-weight="500" fill="#525252" text-anchor="start">X</text><text x="456" y="275" font-size="24" font-weight="800" fill="#0A0A0A" text-anchor="end">Page 1</text><text x="290.0" y="345" font-size="40" font-weight="800" fill="#0A0A0A" text-anchor="middle">Value</text><rect x="124" y="379" width="22" height="22" fill="#F7B500"/><text x="164" y="398" font-size="24" font-weight="500" fill="#0A0A0A" text-anchor="start">Your plan is ready</text><rect x="124" y="451" width="22" height="22" fill="#0A0A0A"/><text x="164" y="470" font-size="24" font-weight="500" fill="#0A0A0A" text-anchor="start">Three benefit lines</text><rect x="124" y="523" width="22" height="22" fill="#0A0A0A"/><text x="164" y="542" font-size="24" font-weight="500" fill="#0A0A0A" text-anchor="start">One real review</text><rect x="250.0" y="759" width="18" height="18" fill="#0A0A0A"/><rect x="280.0" y="759" width="18" height="18" fill="#E5E5E5"/><rect x="310.0" y="759" width="18" height="18" fill="#E5E5E5"/><rect x="124" y="685" width="332" height="54" fill="#0A0A0A"/><text x="290.0" y="720" font-size="26" font-weight="800" fill="#FFFFFF" text-anchor="middle">Continue</text><line x1="500" y1="515" x2="580" y2="515" stroke="#0A0A0A" stroke-width="3"/><polygon points="580,515 562,505 562,525" fill="#0A0A0A"/><rect x="600" y="215" width="380" height="600" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="4"/><rect x="750.0" y="225" width="80" height="10" fill="#0A0A0A"/><text x="624" y="275" font-size="26" font-weight="500" fill="#525252" text-anchor="start">X</text><text x="956" y="275" font-size="24" font-weight="800" fill="#0A0A0A" text-anchor="end">Page 2</text><text x="790.0" y="345" font-size="40" font-weight="800" fill="#0A0A0A" text-anchor="middle">Trial</text><rect x="624" y="379" width="22" height="22" fill="#F7B500"/><text x="664" y="398" font-size="24" font-weight="500" fill="#0A0A0A" text-anchor="start">How your trial works</text><rect x="624" y="451" width="22" height="22" fill="#0A0A0A"/><text x="664" y="470" font-size="24" font-weight="500" fill="#0A0A0A" text-anchor="start">Today: full access</text><rect x="624" y="523" width="22" height="22" fill="#0A0A0A"/><text x="664" y="542" font-size="24" font-weight="500" fill="#0A0A0A" text-anchor="start">Day 5: reminder</text><rect x="624" y="595" width="22" height="22" fill="#0A0A0A"/><text x="664" y="614" font-size="24" font-weight="500" fill="#0A0A0A" text-anchor="start">Day 7: charged</text><rect x="750.0" y="759" width="18" height="18" fill="#E5E5E5"/><rect x="780.0" y="759" width="18" height="18" fill="#0A0A0A"/><rect x="810.0" y="759" width="18" height="18" fill="#E5E5E5"/><rect x="624" y="685" width="332" height="54" fill="#0A0A0A"/><text x="790.0" y="720" font-size="26" font-weight="800" fill="#FFFFFF" text-anchor="middle">Continue</text><line x1="1000" y1="515" x2="1080" y2="515" stroke="#0A0A0A" stroke-width="3"/><polygon points="1080,515 1062,505 1062,525" fill="#0A0A0A"/><rect x="1100" y="215" width="380" height="600" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="4"/><rect x="1250.0" y="225" width="80" height="10" fill="#0A0A0A"/><text x="1124" y="275" font-size="26" font-weight="500" fill="#525252" text-anchor="start">X</text><text x="1456" y="275" font-size="24" font-weight="800" fill="#0A0A0A" text-anchor="end">Page 3</text><text x="1290.0" y="345" font-size="40" font-weight="800" fill="#0A0A0A" text-anchor="middle">Price</text><text x="1290.0" y="417" font-size="24" font-weight="800" fill="#0A0A0A" text-anchor="middle">Choose your plan</text><rect x="1124" y="451" width="332" height="56" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="4"/><text x="1290.0" y="489" font-size="24" font-weight="800" fill="#0A0A0A" text-anchor="middle">Annual selected</text><rect x="1124" y="523" width="332" height="56" fill="#0A0A0A"/><text x="1290.0" y="561" font-size="24" font-weight="800" fill="#FFFFFF" text-anchor="middle">Start free trial</text><rect x="1250.0" y="759" width="18" height="18" fill="#E5E5E5"/><rect x="1280.0" y="759" width="18" height="18" fill="#E5E5E5"/><rect x="1310.0" y="759" width="18" height="18" fill="#0A0A0A"/></svg>
