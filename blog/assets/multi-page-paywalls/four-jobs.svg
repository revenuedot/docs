<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d" font-family="Manrope, Helvetica, Arial, sans-serif"><title id="t">One page does four jobs; pages share them</title><desc id="d">Grid: show the value, explain the trial, show the price, ask for payment. A single page does all four; three pages spread them, with price and payment on page 3.</desc><rect width="1600" height="900" fill="#FFFFFF"/><rect x="80" y="56" width="64" height="10" fill="#F7B500"/><text x="80" y="128" font-size="42" font-weight="800" fill="#0A0A0A" text-anchor="start">One page does four jobs; pages share them</text><text x="80" y="176" font-size="26" font-weight="500" fill="#525252" text-anchor="start">Superwall: a single page must communicate value, address concerns, show price and ask for payment.</text><line x1="80" y1="846" x2="1520" y2="846" stroke="#E5E5E5" stroke-width="2"/><text x="80" y="880" font-size="22" font-weight="500" fill="#525252" text-anchor="start">Source: Superwall (superwall.com/blog), quoted jobs. Mapping to pages is our suggested layout.</text><text x="560" y="236" font-size="28" font-weight="800" fill="#0A0A0A" text-anchor="middle">Single page</text><text x="900" y="236" font-size="28" font-weight="800" fill="#0A0A0A" text-anchor="middle">Page 1</text><text x="1160" y="236" font-size="28" font-weight="800" fill="#0A0A0A" text-anchor="middle">Page 2</text><text x="1420" y="236" font-size="28" font-weight="800" fill="#0A0A0A" text-anchor="middle">Page 3</text><line x1="80" y1="254" x2="1520" y2="254" stroke="#0A0A0A" stroke-width="3"/><text x="80" y="334" font-size="32" font-weight="800" fill="#0A0A0A" text-anchor="start">Show the value</text><line x1="80" y1="370" x2="1520" y2="370" stroke="#E5E5E5" stroke-width="2"/><rect x="540" y="304" width="40" height="40" fill="#0A0A0A"/><rect x="880" y="304" width="40" height="40" fill="#F7B500"/><text x="80" y="454" font-size="32" font-weight="800" fill="#0A0A0A" text-anchor="start">Explain the trial</text><line x1="80" y1="490" x2="1520" y2="490" stroke="#E5E5E5" stroke-width="2"/><rect x="540" y="424" width="40" height="40" fill="#0A0A0A"/><rect x="1140" y="424" width="40" height="40" fill="#F7B500"/><text x="80" y="574" font-size="32" font-weight="800" fill="#0A0A0A" text-anchor="start">Show the price</text><line x1="80" y1="610" x2="1520" y2="610" stroke="#E5E5E5" stroke-width="2"/><rect x="540" y="544" width="40" height="40" fill="#0A0A0A"/><rect x="1400" y="544" width="40" height="40" fill="#F7B500"/><text x="80" y="694" font-size="32" font-weight="800" fill="#0A0A0A" text-anchor="start">Ask for payment</text><line x1="80" y1="730" x2="1520" y2="730" stroke="#E5E5E5" stroke-width="2"/><rect x="540" y="664" width="40" height="40" fill="#0A0A0A"/><rect x="1400" y="664" width="40" height="40" fill="#F7B500"/><text x="80" y="800" font-size="26" font-weight="500" fill="#525252" text-anchor="start">Single page: all four jobs on one screen. Multi-page: one job per screen, price last.</text></svg>
