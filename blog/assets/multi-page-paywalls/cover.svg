<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d" font-family="Manrope, Helvetica, Arial, sans-serif"><title id="t">Multi-page paywalls convert 37% better</title><desc id="d">Two bars: multi-page paywalls 12.41% conversion, single-page paywalls 9.07%.</desc><rect width="1600" height="900" fill="#FFFFFF"/><rect x="80" y="56" width="64" height="10" fill="#F7B500"/><text x="80" y="170" font-size="64" font-weight="800" fill="#0A0A0A" text-anchor="start">Multi-page paywalls</text><text x="80" y="245" font-size="64" font-weight="800" fill="#0A0A0A" text-anchor="start">convert 37% better</text><text x="80" y="305" font-size="28" font-weight="500" fill="#525252" text-anchor="start">12.41% vs 9.07% conversion on onboarding paywalls</text><text x="80" y="360" font-size="28" font-weight="500" fill="#0A0A0A" text-anchor="start">40 million+ paywall opens, Feb to May 2026.</text><line x1="860" y1="730" x2="1520" y2="730" stroke="#0A0A0A" stroke-width="3"/><rect x="895.0" y="200.0" width="260" height="530.0" fill="#0A0A0A"/><text x="1025.0" y="182.0" font-size="64" font-weight="800" fill="#0A0A0A" text-anchor="middle">12.41%</text><text x="1025.0" y="770" font-size="28" font-weight="800" fill="#0A0A0A" text-anchor="middle">Multi-page</text><rect x="1225.0" y="342.64302981466557" width="260" height="387.35697018533443" fill="#E5E5E5"/><text x="1355.0" y="324.64302981466557" font-size="64" font-weight="800" fill="#0A0A0A" text-anchor="middle">9.07%</text><text x="1355.0" y="770" font-size="28" font-weight="800" fill="#0A0A0A" text-anchor="middle">Single page</text><line x1="80" y1="846" x2="1520" y2="846" stroke="#E5E5E5" stroke-width="2"/><text x="80" y="880" font-size="22" font-weight="500" fill="#525252" text-anchor="start">Source: Superwall, multi-page onboarding paywalls convert 37% better (superwall.com/blog)</text></svg>
