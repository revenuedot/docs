<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d" font-family="Manrope, Helvetica, Arial, sans-serif"><title id="t">Offer codes: create, share, redeem, track</title><desc id="d">Four steps: create the offer in App Store Connect, distribute the codes, the customer redeems them, you track the redemption.</desc><rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/><rect x="80" y="56" width="64" height="10" fill="#F7B500"/><text x="80" y="170" font-size="64" font-weight="800" fill="#0A0A0A" text-anchor="start">Offer codes: create, share,</text><text x="80" y="245" font-size="64" font-weight="800" fill="#0A0A0A" text-anchor="start">redeem, track</text><text x="80" y="305" font-size="28" font-weight="500" fill="#525252" text-anchor="start">Four steps from App Store Connect to a counted redemption</text><rect x="80" y="420" width="315" height="250" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2"/><rect x="104" y="444" width="28" height="6" fill="#F7B500"/><text x="104" y="494" font-size="30" font-weight="800" fill="#0A0A0A" text-anchor="start">Create</text><text x="104" y="538" font-size="22" font-weight="500" fill="#525252" text-anchor="start">Subscription Prices,</text><text x="104" y="574" font-size="22" font-weight="500" fill="#525252" text-anchor="start">then Create</text><text x="104" y="610" font-size="22" font-weight="500" fill="#525252" text-anchor="start">Offer Codes</text><line x1="403" y1="545" x2="447" y2="545" stroke="#0A0A0A" stroke-width="3"/><polygon points="447,545 433,536 433,554" fill="#0A0A0A"/><rect x="455" y="420" width="315" height="250" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2"/><rect x="479" y="444" width="28" height="6" fill="#F7B500"/><text x="479" y="494" font-size="30" font-weight="800" fill="#0A0A0A" text-anchor="start">Distribute</text><text x="479" y="538" font-size="22" font-weight="500" fill="#525252" text-anchor="start">Email, link or print.</text><text x="479" y="574" font-size="22" font-weight="500" fill="#525252" text-anchor="start">You send the codes.</text><line x1="778" y1="545" x2="822" y2="545" stroke="#0A0A0A" stroke-width="3"/><polygon points="822,545 808,536 808,554" fill="#0A0A0A"/><rect x="830" y="420" width="315" height="250" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2"/><rect x="854" y="444" width="28" height="6" fill="#F7B500"/><text x="854" y="494" font-size="30" font-weight="800" fill="#0A0A0A" text-anchor="start">Redeem</text><text x="854" y="538" font-size="22" font-weight="500" fill="#525252" text-anchor="start">In-app sheet,</text><text x="854" y="574" font-size="22" font-weight="500" fill="#525252" text-anchor="start">App Store or</text><text x="854" y="610" font-size="22" font-weight="500" fill="#525252" text-anchor="start">redemption link</text><line x1="1153" y1="545" x2="1197" y2="545" stroke="#0A0A0A" stroke-width="3"/><polygon points="1197,545 1183,536 1183,554" fill="#0A0A0A"/><rect x="1205" y="420" width="315" height="250" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2"/><rect x="1229" y="444" width="28" height="6" fill="#F7B500"/><text x="1229" y="494" font-size="30" font-weight="800" fill="#0A0A0A" text-anchor="start">Track</text><text x="1229" y="538" font-size="22" font-weight="500" fill="#525252" text-anchor="start">offerType 3 on the</text><text x="1229" y="574" font-size="22" font-weight="500" fill="#525252" text-anchor="start">transaction, a server</text><text x="1229" y="610" font-size="22" font-weight="500" fill="#525252" text-anchor="start">notification</text><line x1="80" y1="846" x2="1520" y2="846" stroke="#E5E5E5" stroke-width="2"/><text x="80" y="880" font-size="22" font-weight="500" fill="#525252" text-anchor="start">Source: Apple, Set up offer codes, App Store Connect Help (developer.apple.com)</text></svg>