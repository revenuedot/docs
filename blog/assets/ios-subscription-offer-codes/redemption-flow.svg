<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d" font-family="Manrope, Helvetica, Arial, sans-serif"><title id="t">What happens when a customer redeems an offer code</title><desc id="d">Customer redeems, Apple creates the transaction and notification, RevenueDot grants the entitlement, the app and webhooks update.</desc><rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/><rect x="80" y="56" width="64" height="10" fill="#F7B500"/><text x="80" y="150" font-size="48" font-weight="800" fill="#0A0A0A" text-anchor="start">What happens when a customer redeems a code</text><text x="80" y="200" font-size="26" font-weight="500" fill="#525252" text-anchor="start">The same four steps run whether the customer redeems in your app, the App Store or a link</text><rect x="80" y="320" width="315" height="220" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2"/><text x="104" y="372" font-size="30" font-weight="800" fill="#0A0A0A" text-anchor="start">Customer</text><text x="104" y="416" font-size="22" font-weight="500" fill="#525252" text-anchor="start">Enters the code in</text><text x="104" y="452" font-size="22" font-weight="500" fill="#525252" text-anchor="start">your app, the App</text><text x="104" y="488" font-size="22" font-weight="500" fill="#525252" text-anchor="start">Store or a link</text><line x1="403" y1="430" x2="447" y2="430" stroke="#0A0A0A" stroke-width="3"/><polygon points="447,430 433,421 433,439" fill="#0A0A0A"/><rect x="455" y="320" width="315" height="220" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2"/><text x="479" y="372" font-size="30" font-weight="800" fill="#0A0A0A" text-anchor="start">Apple</text><text x="479" y="416" font-size="22" font-weight="500" fill="#525252" text-anchor="start">Creates a transaction</text><text x="479" y="452" font-size="22" font-weight="500" fill="#525252" text-anchor="start">with offer type code</text><text x="479" y="488" font-size="22" font-weight="500" fill="#525252" text-anchor="start">and notifies you</text><line x1="778" y1="430" x2="822" y2="430" stroke="#0A0A0A" stroke-width="3"/><polygon points="822,430 808,421 808,439" fill="#0A0A0A"/><rect x="830" y="320" width="315" height="220" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2"/><text x="854" y="372" font-size="30" font-weight="800" fill="#0A0A0A" text-anchor="start">RevenueDot</text><text x="854" y="416" font-size="22" font-weight="500" fill="#525252" text-anchor="start">Verifies it, grants</text><text x="854" y="452" font-size="22" font-weight="500" fill="#525252" text-anchor="start">the entitlement,</text><text x="854" y="488" font-size="22" font-weight="500" fill="#525252" text-anchor="start">records offer_code</text><line x1="1153" y1="430" x2="1197" y2="430" stroke="#0A0A0A" stroke-width="3"/><polygon points="1197,430 1183,421 1183,439" fill="#0A0A0A"/><rect x="1205" y="320" width="315" height="220" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2"/><text x="1229" y="372" font-size="30" font-weight="800" fill="#0A0A0A" text-anchor="start">App, webhooks</text><text x="1229" y="416" font-size="22" font-weight="500" fill="#525252" text-anchor="start">CustomerInfo updates.</text><text x="1229" y="452" font-size="22" font-weight="500" fill="#525252" text-anchor="start">Webhooks carry</text><text x="1229" y="488" font-size="22" font-weight="500" fill="#525252" text-anchor="start">offer_code</text><rect x="80" y="620" width="1440" height="100" fill="none" stroke="#E5E5E5" stroke-width="2"/><text x="104" y="662" font-size="26" font-weight="500" fill="#0A0A0A" text-anchor="start">Closed app? Transaction.updates delivers the redemption on the next launch,</text><text x="104" y="700" font-size="26" font-weight="500" fill="#525252" text-anchor="start">and Apple's server notification reaches RevenueDot at once.</text><line x1="80" y1="846" x2="1520" y2="846" stroke="#E5E5E5" stroke-width="2"/><text x="80" y="880" font-size="22" font-weight="500" fill="#525252" text-anchor="start">Sources: Apple, Supporting offer codes in your app; RevenueDot docs (win-back offers, App Store setup)</text></svg>