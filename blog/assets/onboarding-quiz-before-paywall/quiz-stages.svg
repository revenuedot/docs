<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d" font-family="Manrope, Helvetica, Arial, sans-serif"><title id="t">The eight stages of a quiz that ends in a paywall</title><desc id="d">Eight numbered boxes: welcome, questions, insight, permissions, building your plan, plan is ready, sign in, paywall.</desc><rect width="1600" height="900" fill="#FFFFFF"/><rect x="80" y="56" width="64" height="10" fill="#F7B500"/><text x="80" y="128" font-size="44" font-weight="800" fill="#0A0A0A" text-anchor="start">The eight stages of a quiz that ends in a paywall</text><text x="80" y="176" font-size="26" font-weight="500" fill="#525252" text-anchor="start">Order matters: value first, a plan reveal right before the offer.</text><line x1="80" y1="846" x2="1520" y2="846" stroke="#E5E5E5" stroke-width="2"/><text x="80" y="880" font-size="22" font-weight="500" fill="#525252" text-anchor="start">Order: RevenueDot sample app "Focus" (github.com/revenuedot/examples). Plan reveal before the paywall: Lazyweb.</text><rect x="80" y="220" width="330" height="260" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2"/><rect x="100" y="240" width="40" height="40" fill="#F7B500"/><text x="120.0" y="268.0" font-size="26" font-weight="800" fill="#0A0A0A" text-anchor="middle">1</text><text x="100" y="340" font-size="30" font-weight="800" fill="#0A0A0A" text-anchor="start">Welcome</text><text x="100" y="384" font-size="24" font-weight="500" fill="#525252" text-anchor="start">A short demo of the</text><text x="100" y="416" font-size="24" font-weight="500" fill="#525252" text-anchor="start">result</text><rect x="450" y="220" width="330" height="260" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2"/><rect x="470" y="240" width="40" height="40" fill="#F7B500"/><text x="490.0" y="268.0" font-size="26" font-weight="800" fill="#0A0A0A" text-anchor="middle">2</text><text x="470" y="340" font-size="30" font-weight="800" fill="#0A0A0A" text-anchor="start">Questions</text><text x="470" y="384" font-size="24" font-weight="500" fill="#525252" text-anchor="start">One per screen, big</text><text x="470" y="416" font-size="24" font-weight="500" fill="#525252" text-anchor="start">rows</text><rect x="820" y="220" width="330" height="260" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2"/><rect x="840" y="240" width="40" height="40" fill="#F7B500"/><text x="860.0" y="268.0" font-size="26" font-weight="800" fill="#0A0A0A" text-anchor="middle">3</text><text x="840" y="340" font-size="30" font-weight="800" fill="#0A0A0A" text-anchor="start">Insight</text><text x="840" y="384" font-size="24" font-weight="500" fill="#525252" text-anchor="start">A chart of why a</text><text x="840" y="416" font-size="24" font-weight="500" fill="#525252" text-anchor="start">plan beats willpower</text><rect x="1190" y="220" width="330" height="260" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2"/><rect x="1210" y="240" width="40" height="40" fill="#F7B500"/><text x="1230.0" y="268.0" font-size="26" font-weight="800" fill="#0A0A0A" text-anchor="middle">4</text><text x="1210" y="340" font-size="30" font-weight="800" fill="#0A0A0A" text-anchor="start">Permissions</text><text x="1210" y="384" font-size="24" font-weight="500" fill="#525252" text-anchor="start">Explain, then ask</text><text x="1210" y="416" font-size="24" font-weight="500" fill="#525252" text-anchor="start">for reminders</text><rect x="80" y="520" width="330" height="260" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2"/><rect x="100" y="540" width="40" height="40" fill="#F7B500"/><text x="120.0" y="568.0" font-size="26" font-weight="800" fill="#0A0A0A" text-anchor="middle">5</text><text x="100" y="640" font-size="26" font-weight="800" fill="#0A0A0A" text-anchor="start">Building your plan</text><text x="100" y="684" font-size="24" font-weight="500" fill="#525252" text-anchor="start">A counter that uses</text><text x="100" y="716" font-size="24" font-weight="500" fill="#525252" text-anchor="start">the answers</text><rect x="450" y="520" width="330" height="260" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2"/><rect x="470" y="540" width="40" height="40" fill="#F7B500"/><text x="490.0" y="568.0" font-size="26" font-weight="800" fill="#0A0A0A" text-anchor="middle">6</text><text x="470" y="640" font-size="30" font-weight="800" fill="#0A0A0A" text-anchor="start">Plan is ready</text><text x="470" y="684" font-size="24" font-weight="500" fill="#525252" text-anchor="start">Four numbers from</text><text x="470" y="716" font-size="24" font-weight="500" fill="#525252" text-anchor="start">the answers</text><rect x="820" y="520" width="330" height="260" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2"/><rect x="840" y="540" width="40" height="40" fill="#F7B500"/><text x="860.0" y="568.0" font-size="26" font-weight="800" fill="#0A0A0A" text-anchor="middle">7</text><text x="840" y="640" font-size="30" font-weight="800" fill="#0A0A0A" text-anchor="start">Sign in</text><text x="840" y="684" font-size="24" font-weight="500" fill="#525252" text-anchor="start">Optional, before the</text><text x="840" y="716" font-size="24" font-weight="500" fill="#525252" text-anchor="start">paywall</text><rect x="1190" y="520" width="330" height="260" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="4"/><rect x="1210" y="540" width="40" height="40" fill="#F7B500"/><text x="1230.0" y="568.0" font-size="26" font-weight="800" fill="#0A0A0A" text-anchor="middle">8</text><text x="1210" y="640" font-size="30" font-weight="800" fill="#0A0A0A" text-anchor="start">Paywall</text><text x="1210" y="684" font-size="24" font-weight="500" fill="#525252" text-anchor="start">Two pages, trial</text><text x="1210" y="716" font-size="24" font-weight="500" fill="#525252" text-anchor="start">timeline</text></svg>
