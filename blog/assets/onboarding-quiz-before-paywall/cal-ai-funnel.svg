<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d" font-family="Manrope, Helvetica, Arial, sans-serif"><title id="t">Cal AI: what its paywall funnel looks like</title><desc id="d">Bars: 87% of new users see a paywall, 57% of paywall viewers start a purchase, 63% of checkout entrants complete it.</desc><rect width="1600" height="900" fill="#FFFFFF"/><rect x="80" y="56" width="64" height="10" fill="#F7B500"/><text x="80" y="128" font-size="44" font-weight="800" fill="#0A0A0A" text-anchor="start">Cal AI: what its paywall funnel looks like</text><text x="80" y="176" font-size="26" font-weight="500" fill="#525252" text-anchor="start">After 123 experiments, 61 of them on the onboarding paywall.</text><line x1="80" y1="846" x2="1520" y2="846" stroke="#E5E5E5" stroke-width="2"/><text x="80" y="880" font-size="22" font-weight="500" fill="#525252" text-anchor="start">Source: Superwall, Cal AI case study (superwall.com/case-studies/cal-ai), checked October 2026</text><line x1="120" y1="740" x2="1480" y2="740" stroke="#0A0A0A" stroke-width="3"/><rect x="216.66666666666663" y="357.2" width="260" height="382.8" fill="#E5E5E5"/><text x="346.66666666666663" y="339.2" font-size="60" font-weight="800" fill="#0A0A0A" text-anchor="middle">87%</text><text x="346.66666666666663" y="780" font-size="28" font-weight="800" fill="#0A0A0A" text-anchor="middle">Paywall shown</text><text x="346.66666666666663" y="814" font-size="22" font-weight="500" fill="#525252" text-anchor="middle">to new users</text><rect x="670.0" y="489.2" width="260" height="250.8" fill="#0A0A0A"/><text x="800.0" y="471.2" font-size="60" font-weight="800" fill="#0A0A0A" text-anchor="middle">57%</text><text x="800.0" y="780" font-size="28" font-weight="800" fill="#0A0A0A" text-anchor="middle">Viewers who start</text><text x="800.0" y="814" font-size="22" font-weight="500" fill="#525252" text-anchor="middle">a purchase</text><rect x="1123.3333333333333" y="462.8" width="260" height="277.2" fill="#E5E5E5"/><text x="1253.3333333333333" y="444.8" font-size="60" font-weight="800" fill="#0A0A0A" text-anchor="middle">63%</text><text x="1253.3333333333333" y="780" font-size="28" font-weight="800" fill="#0A0A0A" text-anchor="middle">Checkout entrants</text><text x="1253.3333333333333" y="814" font-size="22" font-weight="500" fill="#525252" text-anchor="middle">who complete it</text></svg>
