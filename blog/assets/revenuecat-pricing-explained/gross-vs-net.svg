<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" width="1600" height="800" role="img" aria-labelledby="t d"><title id="t">Where $10,000 of tracked revenue goes</title><desc id="d">Two stacked bars for 10,000 dollars charged to customers: Apple takes 30 or 15 percent, RevenueCat fee is 100 dollars on gross, the rest is net.</desc><rect width="1600" height="800" fill="#FFFFFF"/><text x="100" y="100" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="32" font-weight="800" fill="#0A0A0A" text-anchor="start">$10,000 charged to customers in a month</text><text x="100" y="202" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#0A0A0A" text-anchor="start">Standard 30% commission</text><rect x="100" y="220" width="420.00000000000006" height="90" fill="#E5E5E5" stroke="#E5E5E5" stroke-width="2"/><text x="310.0" y="260" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#0A0A0A" text-anchor="middle">Apple 30%</text><text x="310.0" y="294" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#525252" text-anchor="middle">$3,000</text><rect x="520.0" y="220" width="14.000000000000002" height="90" fill="#F7B500" stroke="#F7B500" stroke-width="2"/><rect x="534.0" y="220" width="966.0000000000001" height="90" fill="#0A0A0A" stroke="#0A0A0A" stroke-width="2"/><text x="1017.0" y="260" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">You keep</text><text x="1017.0" y="294" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#FFFFFF" text-anchor="middle">$6,900</text><text x="1495.0000000000002" y="350" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#0A0A0A" text-anchor="start"></text><text x="100" y="412" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#0A0A0A" text-anchor="start">15% commission (Small Business Program or subscriber after year one)</text><rect x="100" y="430" width="210.00000000000003" height="90" fill="#E5E5E5" stroke="#E5E5E5" stroke-width="2"/><text x="205.0" y="470" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#0A0A0A" text-anchor="middle">Apple 15%</text><text x="205.0" y="504" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#525252" text-anchor="middle">$1,500</text><rect x="310.0" y="430" width="14.000000000000002" height="90" fill="#F7B500" stroke="#F7B500" stroke-width="2"/><rect x="324.0" y="430" width="1176.0" height="90" fill="#0A0A0A" stroke="#0A0A0A" stroke-width="2"/><text x="912.0" y="470" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">You keep</text><text x="912.0" y="504" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#FFFFFF" text-anchor="middle">$8,400</text><text x="1495.0000000000002" y="560" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#0A0A0A" text-anchor="start"></text><rect x="100" y="600" width="22" height="22" fill="#F7B500" stroke="#F7B500" stroke-width="2"/><text x="136" y="620" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="24" font-weight="600" fill="#0A0A0A" text-anchor="start">RevenueCat fee: $100, because it is 1% of the $10,000 before store commission</text><text x="100" y="670" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#525252" text-anchor="start">On proceeds, $100 is 1.43% of $7,000 (30% store fee) or 1.18% of $8,500 (15% store fee).</text><text x="100" y="716" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#525252" text-anchor="start">Source: RevenueCat docs say MTR is measured before store commission and taxes.</text></svg>