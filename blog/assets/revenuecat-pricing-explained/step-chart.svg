<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" width="1600" height="800" role="img" aria-labelledby="t d"><title id="t">RevenueCat bill versus monthly tracked revenue</title><desc id="d">Solid line: bill is 1 percent of the whole amount once tracked revenue passes 2,500 dollars. Dashed line: the common misreading that only the excess is charged.</desc><rect width="1600" height="800" fill="#FFFFFF"/><line x1="200" y1="640" x2="1400" y2="640" stroke="#0A0A0A" stroke-width="3"/><line x1="200" y1="640" x2="200" y2="160" stroke="#0A0A0A" stroke-width="3"/><line x1="200.0" y1="640" x2="200.0" y2="650" stroke="#0A0A0A" stroke-width="2"/><text x="200.0" y="684" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#525252" text-anchor="middle">$0</text><line x1="400.0" y1="640" x2="400.0" y2="650" stroke="#0A0A0A" stroke-width="2"/><text x="400.0" y="684" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#525252" text-anchor="middle">$1K</text><line x1="600.0" y1="640" x2="600.0" y2="650" stroke="#0A0A0A" stroke-width="2"/><text x="600.0" y="684" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#525252" text-anchor="middle">$2K</text><line x1="800.0" y1="640" x2="800.0" y2="650" stroke="#0A0A0A" stroke-width="2"/><text x="800.0" y="684" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#525252" text-anchor="middle">$3K</text><line x1="1000.0" y1="640" x2="1000.0" y2="650" stroke="#0A0A0A" stroke-width="2"/><text x="1000.0" y="684" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#525252" text-anchor="middle">$4K</text><line x1="1200.0" y1="640" x2="1200.0" y2="650" stroke="#0A0A0A" stroke-width="2"/><text x="1200.0" y="684" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#525252" text-anchor="middle">$5K</text><line 