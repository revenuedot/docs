<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d" font-family="Manrope, Helvetica, Arial, sans-serif"><title id="t">Two kinds of churn</title><desc id="d">Voluntary churn is a customer turning off auto-renew. Involuntary churn is a failed payment. Each has its own fixes.</desc><rect width="1600" height="900" fill="#FFFFFF"/><rect x="80" y="56" width="64" height="10" fill="#F7B500"/><text x="80" y="150" font-size="60" font-weight="800" fill="#0A0A0A" text-anchor="start">Two kinds of churn, two sets of fixes</text><text x="80" y="205" font-size="30" font-weight="500" fill="#525252" text-anchor="start">A customer who cancels and a card that fails need different tools.</text><rect x="80" y="290" width="700" height="330" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="4"/><text x="96" y="388" font-size="34" font-weight="800" fill="#0A0A0A" text-anchor="start">Voluntary churn</text><text x="96" y="434" font-size="12" font-weight="500" fill="#525252" text-anchor="start"></text><text x="96" y="450" font-size="26" font-weight="500" fill="#525252" text-anchor="start">The customer turns off auto-renew.</text><text x="96" y="485" font-size="26" font-weight="500" fill="#525252" text-anchor="start">Cancellation survey and offer</text><text x="96" y="520" font-size="26" font-weight="500" fill="#525252" text-anchor="start">Apple Retention Messaging</text><text x="96" y="555" font-size="26" font-weight="500" fill="#525252" text-anchor="start">Win-back email and offers</text><rect x="820" y="290" width="700" height="330" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2"/><text x="836" y="388" font-size="34" font-weight="800" fill="#0A0A0A" text-anchor="start">Involuntary churn</text><text x="836" y="434" font-size="12" font-weight="500" fill="#525252" text-anchor="start"></text><text x="836" y="450" font-size="26" font-weight="500" fill="#525252" text-anchor="start">The payment fails at renewal.</text><text x="836" y="485" font-size="26" font-weight="500" fill="#525252" text-anchor="start">Billing grace period</text><text x="836" y="520" font-size="26" font-weight="500" fill="#525252" text-anchor="start">Store billing retry</text><text x="836" y="555" font-size="26" font-weight="500" fill="#525252" text-anchor="start">A prompt to update the card</text><text x="80" y="700" font-size="28" font-weight="800" fill="#0A0A0A" text-anchor="start">On Google Play, 31% of cancellations come from billing errors. On the App Store it is 14%.</text><text x="80" y="746" font-size="24" font-weight="500" fill="#525252" text-anchor="start">Source: RevenueCat, State of Subscription Apps 2026.</text><line x1="80" y1="846" x2="1520" y2="846" stroke="#E5E5E5" stroke-width="2"/><text x="80" y="880" font-size="22" font-weight="500" fill="#525252" text-anchor="start">Sources: RevenueCat State of Subscription Apps 2026, developer.apple.com/app-store/subscriptions</text></svg>