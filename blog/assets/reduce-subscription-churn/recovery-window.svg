<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d" font-family="Manrope, Helvetica, Arial, sans-serif"><title id="t">Apple's recovery window for a failed renewal</title><desc id="d">A failed renewal starts a billing grace period of 3, 16 or 28 days where access stays on, inside Apple's retry window of up to 60 days.</desc><rect width="1600" height="900" fill="#FFFFFF"/><rect x="80" y="56" width="64" height="10" fill="#F7B500"/><text x="80" y="128" font-size="44" font-weight="800" fill="#0A0A0A" text-anchor="start">Apple retries a failed renewal for up to 60 days</text><text x="80" y="176" font-size="26" font-weight="500" fill="#525252" text-anchor="start">The grace period keeps access on. After it ends, Apple keeps retrying without access.</text><rect x="80" y="300" width="1440" height="100" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2"/><rect x="80" y="300" width="672" height="100" fill="#0A0A0A" stroke="#0A0A0A" stroke-width="2"/><text x="416" y="362" font-size="28" font-weight="800" fill="#FFFFFF" text-anchor="middle">Grace period: access on (up to 28 days)</text><text x="1136" y="362" font-size="28" font-weight="800" fill="#0A0A0A" text-anchor="middle">Billing retry: no access unless you grant it</text><line x1="80" y1="400" x2="80" y2="430" stroke="#0A0A0A" stroke-width="3"/><text x="80" y="470" font-size="26" font-weight="800" fill="#0A0A0A" text-anchor="start">Day 0</text><line x1="752" y1="400" x2="752" y2="430" stroke="#0A0A0A" stroke-width="3"/><text x="752" y="470" font-size="26" font-weight="800" fill="#0A0A0A" text-anchor="middle">Day 28</text><line x1="1520" y1="400" x2="1520" y2="430" stroke="#0A0A0A" stroke-width="3"/><text x="1520" y="470" font-size="26" font-weight="800" fill="#0A0A0A" text-anchor="end">Day 60</text><text x="80" y="560" font-size="28" font-weight="800" fill="#0A0A0A" text-anchor="start">Grace period options: 3, 16 or 28 days. Weekly plans cap at 6 days.</text><text x="80" y="606" font-size="26" font-weight="500" fill="#525252" text-anchor="start">The bar shows the longest option. The 60 day retry window is Apple's.</text><text x="80" y="652" font-size="26" font-weight="500" fill="#525252" text-anchor="start">If payment is recovered inside the grace period, there is no gap in revenue.</text><line x1="80" y1="846" x2="1520" y2="846" stroke="#E5E5E5" stroke-width="2"/><text x="80" y="880" font-size="22" font-weight="500" fill="#525252" text-anchor="start">Sources: developer.apple.com/app-store/subscriptions, Apple Help: enable billing grace period</text></svg>