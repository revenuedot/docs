<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" width="1600" height="520" role="img" aria-labelledby="t d"><title id="t">Startup order for the RevenueDot SDK for Flutter</title><desc id="d">Five steps in order: add the SDK, configure, getOfferings, purchase, then check entitlements.</desc><rect width="1600" height="520" fill="#FFFFFF"/><rect x="60" y="170" width="262" height="170" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="3"/><rect x="74" y="184" width="14" height="14" fill="#F7B500"/><text x="191.0" y="262.92" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#0A0A0A" text-anchor="middle"></text><text x="191.0" y="226" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="36" font-weight="800" fill="#0A0A0A" text-anchor="middle">1</text><text x="191.0" y="276" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#0A0A0A" text-anchor="middle">add the SDK</text><text x="191.0" y="314" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#525252" text-anchor="middle">git tag in pubspec</text><line x1="322" y1="255" x2="364" y2="255" stroke="#0A0A0A" stroke-width="3"/><polygon points="364,255 348.0,263.0 348.0,247.0" fill="#0A0A0A"/><rect x="364" y="170" width="262" height="170" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"/><text x="495.0" y="262.92" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#0A0A0A" text-anchor="middle"></text><text x="495.0" y="226" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="36" font-weight="800" fill="#0A0A0A" text-anchor="middle">2</text><text x="495.0" y="276" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#0A0A0A" text-anchor="middle">configure</text><text x="495.0" y="314" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#525252" text-anchor="middle">appl_ or goog_ key</text><line x1="626" y1="255" x2="668" y2="255" stroke="#0A0A0A" stroke-width="3"/><polygon points="668,255 652.0,263.0 652.0,247.0" fill="#0A0A0A"/><rect x="668" y="170" width="262" height="170" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"/><text x="799.0" y="262.92" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#0A0A0A" text-anchor="middle"></text><text x="799.0" y="226" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="36" font-weight="800" fill="#0A0A0A" text-anchor="middle">3</text><text x="799.0" y="276" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#0A0A0A" text-anchor="middle">getOfferings</text><text x="799.0" y="314" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#525252" text-anchor="middle">current offering</text><line x1="930" y1="255" x2="972" y2="255" stroke="#0A0A0A" stroke-width="3"/><polygon points="972,255 956.0,263.0 956.0,247.0" fill="#0A0A0A"/><rect x="972" y="170" width="262" height="170" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"/><text x="1103.0" y="262.92" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#0A0A0A" text-anchor="middle"></text><text x="1103.0" y="226" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="36" font-weight="800" fill="#0A0A0A" text-anchor="middle">4</text><text x="1103.0" y="276" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#0A0A0A" text-anchor="middle">purchase</text><text x="1103.0" y="314" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#525252" text-anchor="middle">one package</text><line x1="1234" y1="255" x2="1276" y2="255" stroke="#0A0A0A" stroke-width="3"/><polygon points="1276,255 1260.0,263.0 1260.0,247.0" fill="#0A0A0A"/><rect x="1276" y="170" width="262" height="170" fill="#FFFFFF" strok