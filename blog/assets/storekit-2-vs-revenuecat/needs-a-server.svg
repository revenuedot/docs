<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d" font-family="Manrope, Helvetica, Arial, sans-serif"><title id="t">What a server adds to StoreKit 2</title><desc id="d">Table of five needs: other stores, closed-app events, refund requests, webhooks and charts, remote paywalls, with device and server columns.</desc><rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/><rect x="80" y="56" width="64" height="10" fill="#F7B500"/><text x="80" y="150" font-size="48" font-weight="800" fill="#0A0A0A" text-anchor="start">What a server adds to StoreKit 2</text><text x="80" y="200" font-size="26" font-weight="500" fill="#525252" text-anchor="start">Five jobs StoreKit does not do on the device</text><rect x="80" y="250" width="1440" height="64" fill="#0A0A0A"/><text x="96" y="294" font-size="24" font-weight="800" fill="#FFFFFF" text-anchor="start">Need</text><text x="596" y="294" font-size="24" font-weight="800" fill="#FFFFFF" text-anchor="start">On the device</text><text x="1036" y="294" font-size="24" font-weight="800" fill="#FFFFFF" text-anchor="start">On a server</text><text x="96" y="370" font-size="24" font-weight="800" fill="#0A0A0A" text-anchor="start">Android or web customers</text><text x="596" y="370" font-size="24" font-weight="500" fill="#525252" text-anchor="start">Apple purchases only</text><text x="1036" y="370" font-size="24" font-weight="500" fill="#525252" text-anchor="start">One customer, every store</text><line x1="80" y1="410" x2="1520" y2="410" stroke="#E5E5E5" stroke-width="2"/><text x="96" y="466" font-size="24" font-weight="800" fill="#0A0A0A" text-anchor="start">Renewals while app is closed</text><text x="596" y="466" font-size="24" font-weight="500" fill="#525252" text-anchor="start">Updates only while running</text><text x="1036" y="466" font-size="24" font-weight="500" fill="#525252" text-anchor="start">Store notifications in real time</text><line x1="80" y1="506" x2="1520" y2="506" stroke="#E5E5E5" stroke-width="2"/><text x="96" y="562" font-size="24" font-weight="800" fill="#0A0A0A" text-anchor="start">Refund requests</text><text x="596" y="562" font-size="24" font-weight="500" fill="#525252" text-anchor="start">Nothing</text><text x="1036" y="562" font-size="24" font-weight="500" fill="#525252" text-anchor="start">Answer within 12 hours</text><line x1="80" y1="602" x2="1520" y2="602" stroke="#E5E5E5" stroke-width="2"/><text x="96" y="658" font-size="24" font-weight="800" fill="#0A0A0A" text-anchor="start">Webhooks and charts</text><text x="596" y="658" font-size="24" font-weight="500" fill="#525252" text-anchor="start">Nothing</text><text x="1036" y="658" font-size="24" font-weight="500" fill="#525252" text-anchor="start">Events, MRR, churn, cohorts</text><line x1="80" y1="698" x2="1520" y2="698" stroke="#E5E5E5" stroke-width="2"/><text x="96" y="754" font-size="24" font-weight="800" fill="#0A0A0A" text-anchor="start">Remote paywalls and tests</text><text x="596" y="754" font-size="24" font-weight="500" fill="#525252" text-anchor="start">Nothing</text><text x="1036" y="754" font-size="24" font-weight="500" fill="#525252" text-anchor="start">Offerings, targeting, experiments</text><line x1="80" y1="794" x2="1520" y2="794" stroke="#E5E5E5" stroke-width="2"/><line x1="80" y1="846" x2="1520" y2="846" stroke="#E5E5E5" stroke-width="2"/><text x="80" y="880" font-size="22" font-weight="500" fill="#525252" text-anchor="start">Sources: Apple, StoreKit and App Store Server API documentation (developer.apple.com)</text></svg>