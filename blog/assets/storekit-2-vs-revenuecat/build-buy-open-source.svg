<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d" font-family="Manrope, Helvetica, Arial, sans-serif"><title id="t">Build it, buy it or run it open source</title><desc id="d">Table comparing building your own backend, RevenueCat and RevenueDot on cost, server, app code and strengths.</desc><rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/><rect x="80" y="56" width="64" height="10" fill="#F7B500"/><text x="80" y="150" font-size="48" font-weight="800" fill="#0A0A0A" text-anchor="start">Build it, buy it or run it open source</text><text x="80" y="200" font-size="26" font-weight="500" fill="#525252" text-anchor="start">What changes between the three options</text><rect x="80" y="250" width="1440" height="64" fill="#0A0A0A"/><text x="96" y="294" font-size="24" font-weight="800" fill="#FFFFFF" text-anchor="start"></text><text x="316" y="294" font-size="24" font-weight="800" fill="#FFFFFF" text-anchor="start">Build it</text><text x="716" y="294" font-size="24" font-weight="800" fill="#FFFFFF" text-anchor="start">RevenueCat</text><text x="1126" y="294" font-size="24" font-weight="800" fill="#FFFFFF" text-anchor="start">RevenueDot</text><text x="96" y="376" font-size="24" font-weight="800" fill="#0A0A0A" text-anchor="start">Cost</text><text x="316" y="376" font-size="24" font-weight="500" fill="#525252" text-anchor="start">Your engineering time</text><text x="716" y="360" font-size="24" font-weight="500" fill="#525252" text-anchor="start">Free to $2,500 a month,</text><text x="716" y="392" font-size="24" font-weight="500" fill="#525252" text-anchor="start">then 1% of all of it</text><text x="1126" y="360" font-size="24" font-weight="500" fill="#525252" text-anchor="start">Free until $10K a month,</text><text x="1126" y="392" font-size="24" font-weight="500" fill="#525252" text-anchor="start">then 0.5%, capped at $999</text><line x1="80" y1="422" x2="1520" y2="422" stroke="#E5E5E5" stroke-width="2"/><text x="96" y="484" font-size="24" font-weight="800" fill="#0A0A0A" text-anchor="start">Server</text><text x="316" y="484" font-size="24" font-weight="500" fill="#525252" text-anchor="start">You write and run it</text><text x="716" y="484" font-size="24" font-weight="500" fill="#525252" text-anchor="start">Hosted by RevenueCat</text><text x="1126" y="484" font-size="24" font-weight="500" fill="#525252" text-anchor="start">Cloud, or run it yourself</text><line x1="80" y1="530" x2="1520" y2="530" stroke="#E5E5E5" stroke-width="2"/><text x="96" y="592" font-size="24" font-weight="800" fill="#0A0A0A" text-anchor="start">App code</text><text x="316" y="592" font-size="24" font-weight="500" fill="#525252" text-anchor="start">StoreKit 2, Play Billing</text><text x="716" y="592" font-size="24" font-weight="500" fill="#525252" text-anchor="start">RevenueCat SDK</text><text x="1126" y="592" font-size="24" font-weight="500" fill="#525252" text-anchor="start">Same SDK, new proxy URL</text><line x1="80" y1="638" x2="1520" y2="638" stroke="#E5E5E5" stroke-width="2"/><text x="96" y="700" font-size="24" font-weight="800" fill="#0A0A0A" text-anchor="start">Stronger at</text><text x="316" y="700" font-size="24" font-weight="500" fill="#525252" text-anchor="start">Full control</text><text x="716" y="700" font-size="24" font-weight="500" fill="#525252" text-anchor="start">Established, SOC 2</text><text x="1126" y="700" font-size="24" font-weight="500" fill="#525252" text-anchor="start">Open source, your data</text><line x1="80" y1="746" x2="1520" y2="746" stroke="#E5E5E5" stroke-width="2"/><line x1="80" y1="846" x2="1520" y2="846" stroke="#E5E5E5" stroke-width="2"/><text x="80" y="880" font-size="22" font-weight="500" fill="#525252" text-anchor="start">Sources: RevenueCat pricing page and docs; RevenueDot pricing (checked October 2026)</text></svg>