<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d" font-family="Manrope, Helvetica, Arial, sans-serif"><title id="t">StoreKit 2 vs RevenueCat: what still needs a server</title><desc id="d">Two columns: what StoreKit 2 does on the device, and what needs a server.</desc><rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/><rect x="80" y="56" width="64" height="10" fill="#F7B500"/><text x="80" y="170" font-size="64" font-weight="800" fill="#0A0A0A" text-anchor="start">StoreKit 2 vs RevenueCat:</text><text x="80" y="245" font-size="64" font-weight="800" fill="#0A0A0A" text-anchor="start">what still needs a server</text><text x="80" y="305" font-size="28" font-weight="500" fill="#525252" text-anchor="start">StoreKit 2 handles the device. A backend handles the rest</text><rect x="80" y="350" width="700" height="440" fill="none" stroke="#0A0A0A" stroke-width="2"/><text x="108" y="402" font-size="34" font-weight="800" fill="#0A0A0A" text-anchor="start">On the device (StoreKit 2)</text><text x="108" y="438" font-size="22" font-weight="500" fill="#525252" text-anchor="start">Apple purchases, this device and Apple Account</text><rect x="108" y="472" width="14" height="14" fill="#F7B500"/><text x="138" y="490" font-size="26" font-weight="500" fill="#0A0A0A" text-anchor="start">Product details and prices</text><rect x="108" y="532" width="14" height="14" fill="#F7B500"/><text x="138" y="550" font-size="26" font-weight="500" fill="#0A0A0A" text-anchor="start">The purchase sheet</text><rect x="108" y="592" width="14" height="14" fill="#F7B500"/><text x="138" y="610" font-size="26" font-weight="500" fill="#0A0A0A" text-anchor="start">Signed, verified transactions</text><rect x="108" y="652" width="14" height="14" fill="#F7B500"/><text x="138" y="670" font-size="26" font-weight="500" fill="#0A0A0A" text-anchor="start">Entitlements for this Apple Account</text><rect x="108" y="712" width="14" height="14" fill="#F7B500"/><text x="138" y="730" font-size="26" font-weight="500" fill="#0A0A0A" text-anchor="start">Offer code and promo offer APIs</text><rect x="820" y="350" width="700" height="440" fill="none" stroke="#0A0A0A" stroke-width="2"/><text x="848" y="402" font-size="34" font-weight="800" fill="#0A0A0A" text-anchor="start">On a server</text><text x="848" y="438" font-size="22" font-weight="500" fill="#525252" text-anchor="start">Everything beyond one device and one store</text><rect x="848" y="472" width="14" height="14" fill="#F7B500"/><text x="878" y="490" font-size="26" font-weight="500" fill="#0A0A0A" text-anchor="start">One customer across stores</text><rect x="848" y="532" width="14" height="14" fill="#F7B500"/><text x="878" y="550" font-size="26" font-weight="500" fill="#0A0A0A" text-anchor="start">Notifications while the app is closed</text><rect x="848" y="592" width="14" height="14" fill="#F7B500"/><text x="878" y="610" font-size="26" font-weight="500" fill="#0A0A0A" text-anchor="start">Refund answers, billing retry state</text><rect x="848" y="652" width="14" height="14" fill="#F7B500"/><text x="878" y="670" font-size="26" font-weight="500" fill="#0A0A0A" text-anchor="start">Webhooks, charts and analytics</text><rect x="848" y="712" width="14" height="14" fill="#F7B500"/><text x="878" y="730" font-size="26" font-weight="500" fill="#0A0A0A" text-anchor="start">Remote paywalls and experiments</text><line x1="80" y1="846" x2="1520" y2="846" stroke="#E5E5E5" stroke-width="2"/><text x="80" y="880" font-size="22" font-weight="500" fill="#525252" text-anchor="start">Sources: Apple, StoreKit and App Store Server API documentation (developer.apple.com)</text></svg>