  /v1/receipts:
    post:
      operationId: postReceipt
      tags:
        - Receipts
      summary: Post a purchase or restore
      description: |-
        Every purchase, restore and `syncPurchases()` ends here. RevenueDot verifies the purchase with the store, saves it, records events and answers the updated customer info.

        - **App Store:** `fetch_token` is a StoreKit 2 signed transaction (JWS), a StoreKit 1 app receipt (base64) or an Xcode StoreKit test receipt. With the app's in-app purchase key, Apple's App Store Server API supplies the full history and renewal state.
        - **Google Play:** `fetch_token` is the purchase token. RevenueDot checks it with the Play Developer API and acknowledges it.
        - **Amazon Appstore:** `fetch_token` is the receipt id and `store_user_id` the Amazon user id (`X-Platform: amazon`). RevenueDot checks both with Amazon's Receipt Verification Service.
        - **Stripe:** from your backend, with `X-Platform: stripe` and the Stripe app's public key (`strp_`): `fetch_token` is a subscription id (`sub_…`) or a Checkout Session id (`cs_…`). RevenueDot reads it from Stripe with the app's restricted key. An unpaid first invoice or an open session answers 503, so post it again later.
        - **Test Store:** `fetch_token` is `test_<purchase time in ms>_<id>`. Any such token is accepted.

        **4xx or 5xx matters.** A 4xx tells the SDK the purchase can never be accepted, so it finishes the transaction. RevenueDot answers 5xx for its own and the store's temporary failures so the SDK keeps the purchase and retries.
        With a secret key, send `X-Platform` so RevenueDot knows which app the receipt belongs to.
      security:
        - publicApiKey: []
        - secretApiKey: []
      parameters:
        - $ref: "#/components/parameters/XPlatform"
        - $ref: "#/components/parameters/XNonce"
        - name: X-Is-Sandbox
          in: header
          schema:
            type: string
          description: "`true` when the SDK knows the purchase is sandbox (used for StoreKit 1 receipts without an environment)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                app_user_id:
                  type: string
                  description: The customer posting the receipt.
                fetch_token:
                  type: string
                  description: Receipt, signed transaction, purchase token or Test Store token.
                app_transaction:
                  type: string
                  description: StoreKit 2 app transaction JWS (accepted; not required).
                transaction_id:
                  type: string
                  description: Store transaction id.
                product_id:
                  type: string
                  description: Product being bought.
                product_ids:
                  type: array
                  items:
                    type: string
                platform_product_ids:
                  type: array
                  items:
                    type: object
                    properties:
                      product_id:
                        type: string
                      base_plan_id:
                        type: string
                      offer_id:
                        type: string
                price:
                  type: number
                currency:
                  type: string
                store_country:
                  type: string
                normal_duration:
                  type: string
                  description: ISO 8601 period of the product.
                is_restore:
                  type: boolean
                store_user_id:
                  type: string
                presented_offering_identifier:
                  type: string
                  description: Offering the purchase was made from; it appears in webhooks.
                attributes:
                  type: object
                  description: Customer attributes to save with the purchase.
              required:
                - app_user_id
            example:
              app_user_id: user_1
              fetch_token: test_1790800914000_quickstart
              product_id: pro_monthly
              price: 9.99
              currency: USD
              presented_offering_identifier: default
      responses:
        "200":
          description: Updated customer info, plus `purchased_products`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReceiptResponse"
              example:
                request_date: 2026-09-30T20:41:54Z
                request_date_ms: 1790800914034
                subscriber:
                  entitlements:
                    pro:
                      expires_date: 2026-10-30T20:41:54Z
                      grace_period_expires_date: null
                      product_identifier: pro_monthly
                      purchase_date: 2026-09-30T20:41:54Z
                  first_seen: 2026-09-30T20:41:54Z
                  last_seen: 2026-09-30T20:41:54Z
                  management_url: null
                  non_subscriptions: {}
                  original_app_user_id: user_1
                  original_application_version: null
                  original_purchase_date: 2026-09-30T20:41:54Z
                  other_purchases: {}
                  subscriptions:
                    pro_monthly:
                      auto_resume_date: null
                      billing_issues_detected_at: null
                      display_name: null
                      expires_date: 2026-10-30T20:41:54Z
                      grace_period_expires_date: null
                      is_sandbox: true
                      management_url: null
                      original_purchase_date: 2026-09-30T20:41:54Z
                      ownership_type: PURCHASED
                      period_type: normal
                      purchase_date: 2026-09-30T20:41:54Z
                      refunded_at: null
                      store: test_store
                      store_transaction_id: test_1790800914000_quickstart
                      unsubscribe_detected_at: null
                      price:
                        amount: 9.99
                        currency: USD
                purchased_products:
                  pro_monthly:
                    should_consume: false
        "400":
          $ref: "#/components/responses/V1Error400"
        "401":
          $ref: "#/components/responses/V1Error401"
        "500":
          $ref: "#/components/responses/V1Error500"
        "503":
          $ref: "#/components/responses/V1Error503"
      x-source: routes/sdk.ts
