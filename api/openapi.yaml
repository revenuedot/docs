  /v2/projects/{project_id}/import/customers:
    post:
      operationId: importCustomers
      tags:
        - Migration import
      summary: Import customers with their purchases
      description: |-
        Up to 100 RevenueCat-shaped customers per call, each with aliases, attributes, subscriptions and one-time purchases. Writes state directly: no events and no webhooks unless `emit_events` is true.
        Keeps first-seen dates, original purchase dates and store transaction ids, and keys each subscription like the store adapters do (Apple original transaction id, Google purchase token), so later receipts and notifications update the imported row. Running the same import twice changes nothing.
        Google subscriptions without `purchase_token` are keyed `needs_token_refresh:<order id>` until a token is found. The `revenuedot import` CLI calls this; see [the importer](../docs/migrate/importer.md).
      security:
        - secretApiKey: []
        - dashboardSession: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                customers:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                      aliases:
                        type: array
                        items:
                          type: string
                      first_seen_at:
                        type: integer
                      last_seen_at:
                        type: integer
                      last_seen_app_version:
                        type:
                          - string
                          - "null"
                      last_seen_country:
                        type:
                          - string
                          - "null"
                      last_seen_platform:
                        type:
                          - string
                          - "null"
                      attributes:
                        type: array
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                            value:
                              type:
                                - string
                                - "null"
                            updated_at:
                              type: integer
                          required:
                            - name
                            - value
                      subscriptions:
                        type: array
                        items:
                          type: object
                          properties:
                            source_id:
                              type: string
                            app_id:
                              type:
                                - string
                                - "null"
                            store:
                              type: string
                            product_identifier:
                              type: string
                            environment:
                              type: string
                              enum:
                                - production
                                - sandbox
                            ownership:
                              type: string
                              enum:
                                - purchased
                                - family_shared
                            starts_at:
                              type: integer
                            current_period_starts_at:
                              type: integer
                            current_period_ends_at:
                              type:
                                - integer
                                - "null"
                            status:
                              type: string
                              enum:
                                - trialing
                                - active
                                - expired
                                - in_grace_period
                                - in_billing_retry
                                - paused
                                - unknown
                                - incomplete
                            auto_renewal_status:
                              type: string
                              enum:
                                - will_renew
                                - will_not_renew
                                - will_change_product
                                - will_pause
                                - requires_price_increase_consent
                                - has_already_renewed
                            store_subscription_identifier:
                              type: string
                            original_transaction_id:
                              type:
                                - string
                                - "null"
                            original_transaction_id_confirmed:
                              type: boolean
                            purchase_token:
                              type:
                                - string
                                - "null"
                            period_type:
                              type: string
                              enum:
                                - normal
                                - trial
                                - intro
                                - promotional
                                - prepaid
                            country:
                              type:
                                - string
                                - "null"
                            price:
                              type:
                                - object
                                - "null"
                            total_revenue_usd:
                              type:
                                - number
                                - "null"
                            unsubscribe_detected_at:
                              type:
                                - integer
                                - "null"
                            billing_issues_detected_at:
                              type:
                                - integer
                                - "null"
                            grace_period_expires_at:
                              type:
                                - integer
                                - "null"
                            refunded_at:
                              type:
                                - integer
                                - "null"
                            auto_resume_at:
                              type:
                                - integer
                                - "null"
                            entitlement_lookup_keys:
                              type: array
                              items:
                                type: string
                            auto_renew_product_identifier:
                              type:
                                - string
                                - "null"
                            transactions:
                              type: array
                              items:
                                type: object
                                properties:
                                  id:
                                    type: string
                                  purchased_at:
                                    type: integer
                                  expires_at:
                                    type:
                                      - integer
                                      - "null"
                                  revenue_usd:
                                    type:
                                      - number
                                      - "null"
                                  price:
                                    type:
                                      - object
                                      - "null"
                                required:
                                  - id
                                  - purchased_at
                          required:
                            - store
                            - product_identifier
                            - starts_at
                            - current_period_starts_at
                            - status
                            - store_subscription_identifier
                      purchases:
                        type: array
                        items:
                          type: object
                          properties:
                            source_id:
                              type: string
                            app_id:
                              type:
                                - string
                                - "null"
                            store:
                              type: string
                            product_identifier:
                              type: string
                            environment:
                              type: string
                              enum:
                                - production
                                - sandbox
                            purchased_at:
                              type: integer
                            store_purchase_identifier:
                              type: string
                            status:
                              type: string
                              enum:
                                - owned
                                - refunded
                            refunded_at:
                              type:
                                - integer
                                - "null"
                            consumable:
                              type: boolean
                            price:
                              type:
                                - object
                                - "null"
                            revenue_usd:
                              type:
                                - number
                                - "null"
                            country:
                              type:
                                - string
                                - "null"
                          required:
                            - store
                            - product_identifier
                            - purchased_at
                            - store_purchase_identifier
                    required:
                      - id
                  minItems: 1
                  maxItems: 100
                emit_events:
                  type: boolean
                  description: Default false.
                resolve_store_ids:
                  type: boolean
                  description: "Default true: use the app's store credentials to confirm Apple ids and find Google tokens."
              required:
                - customers
            example:
              customers:
                - id: imported_1
                  aliases:
                    - $RCAnonymousID:0f1e2d
                  first_seen_at: 1735689600000
                  attributes:
                    - name: $email
                      value: ana@example.com
                  subscriptions:
                    - store: test_store
                      app_id: appvnrm0a5h
                      product_identifier: pro_annual
                      starts_at: 1735689600000
                      current_period_starts_at: 1767225600000
                      current_period_ends_at: 1798761600000
                      status: active
                      auto_renewal_status: will_renew
                      store_subscription_identifier: test_1767225600000_imported
      responses:
        "200":
          description: A report per customer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
              example:
                object: import_result
                emit_events: false
                customers:
                  - id: imported_1
                    status: created
                    subscriptions: 1
                    purchases: 0
                    needs_token_refresh: 0
                    notes: []
        "400":
