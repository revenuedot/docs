  /v1/notifications/apple/{app_id}:
    post:
      operationId: appleNotification
      tags:
        - Store notifications
      summary: App Store Server Notifications v2
      description: |-
        Set this URL (shown on the app's page in the dashboard) as the Production and Sandbox Server URL in App Store Connect, with version 2 notifications.
        RevenueDot verifies Apple's signature and the bundle id, stores the raw body, copies it to `notification_forward_url` when set, and applies it.

        - **200:** handled, including notifications about purchases this server has not seen (stored; applied only with `track_new_purchases`).
        - **400:** the payload cannot be verified or belongs to another app. App Store Connect shows it as failed.
        - **404:** no App Store app with this id.
        - **500:** RevenueDot failed; Apple retries.
      security: []
      parameters:
        - $ref: "#/components/parameters/AppId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                signedPayload:
                  type: string
                  description: Apple's signed JWS.
              required:
                - signedPayload
      responses:
        "200":
          description: Handled.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
              example:
                ok: true
        "400":
          description: Unverifiable.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: "The signed payload is not valid: bad signature."
        "404":
          description: Unknown app.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "500":
          description: Failed; Apple retries.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
