        - object
        - project_id
        - checked_at
        - apps
        - webhooks
        - sdk_versions
    StoreSettings:
      type: object
      properties:
        object:
          type: string
          const: app_store_settings
        app_id:
          type: string
        type:
          type: string
        api_origin:
          type: string
          description: "This server as the outside world reaches it: the SDK's proxy URL."
        notification_url:
          type:
            - string
            - "null"
          description: App Store or Google Play notification URL for this app.
        notification_forward_url:
          type:
            - string
            - "null"
          description: Where notifications are copied during a dual run.
        last_notification_at:
          type:
            - integer
            - "null"
          format: int64
          description: Last notification processed for a known purchase. Epoch milliseconds, or null.
        last_notification_error:
          type:
            - string
            - "null"
        last_notification_received_at:
          type:
            - integer
            - "null"
          format: int64
          description: Last notification received. Epoch milliseconds, or null.
        notification_status:
          type: string
          enum:
            - ready
            - failing
            - received
            - waiting
        last_forward:
          type:
            - object
            - "null"
          properties:
            status:
              type: integer
              description: HTTP status of the forward; 0 means no answer.
            at:
              type: integer
        track_new_purchases:
          type: boolean
          description: Apply notifications about purchases this server has never seen.
        allow_unsigned_receipts:
          type: boolean
          description: Accept StoreKit 1 receipts without the in-app purchase key. Development only.
        credentials:
          type: object
          properties:
            subscription_key:
              type: object
              properties:
                configured:
                  type: boolean
                key_id:
                  type:
                    - string
                    - "null"
                issuer_id:
                  type:
                    - string
                    - "null"
            app_store_connect_api_key:
              type: object
              properties:
                configured:
                  type: boolean
                key_id:
                  type:
                    - string
                    - "null"
                issuer_id:
                  type:
                    - string
                    - "null"
                vendor_number:
                  type:
                    - string
                    - "null"
            shared_secret:
              type: object
              properties:
                configured:
                  type: boolean
            play_service_account:
              type: object
              properties:
                configured:
                  type: boolean
                client_email:
                  type:
                    - string
                    - "null"
            xcode_certificate:
              type: object
              properties:
                configured:
                  type: boolean
      required:
        - object
        - app_id
        - type
        - api_origin
        - notification_status
        - credentials
    CredentialsCheck:
      type: object
      properties:
        object:
          type: string
          const: credentials_check
        app_id:
          type: string
        store:
          type: string
        status:
          type: string
          enum:
            - valid
            - invalid
            - unreachable
        valid:
          type: boolean
        message:
          type: string
          description: What to do next, in plain words.
        checked_at:
          type: integer
          format: int64
          description: Checked at. Epoch milliseconds.
        key_id:
          type: string
        client_email:
          type:
            - string
            - "null"
      required:
        - object
        - app_id
        - store
        - status
        - valid
        - message
        - checked_at
    MassExtension:
      type: object
      properties:
        object:
          type: string
          const: subscription_mass_extension
        id:
          type: string
          description: Request id.
        app_id:
          type: string
        product_id:
          type: string
        environment:
          type: string
          enum:
            - production
            - sandbox
        extend_by_days:
          type: integer
        extend_reason_code:
          type: string
        storefront_country_codes:
          type:
            - array
            - "null"
          items:
            type: string
        complete:
          type: boolean
        completed_at:
          type:
            - integer
            - "null"
        succeeded_count:
          type:
            - integer
            - "null"
        failed_count:
          type:
            - integer
            - "null"
        requested_at:
          type: integer
      required:
        - object
        - id
        - app_id
        - product_id
        - environment
        - complete
    TestPurchase:
      type: object
      properties:
        object:
          type: string
          const: test_purchase
        scenario:
          type: string
        store_transaction_id:
          type: string
          description: The Test Store token (test_<ms>_<uuid>).
        event_types:
          type: array
          items:
            type: string
          description: Events recorded, in order.
        customer:
          $ref: "#/components/schemas/Customer"
        subscription:
          oneOf:
            - $ref: "#/components/schemas/Subscription"
            - type: "null"
        purchase:
          oneOf:
            - $ref: "#/components/schemas/Purchase"
            - type: "null"
      required:
        - object
        - scenario
        - store_transaction_id
        - event_types
        - customer
    MetricHistory:
      type: object
      properties:
        object:
          type: string
          const: metric_history
        id:
          type: string
        currency:
          type: string
          const: USD
        days:
          type: integer
        environment:
          type: string
          enum:
            - production
            - sandbox
        resolution:
          type: string
          const: day
        value:
          type: number
        previous_value:
          type:
            - number
            - "null"
        values:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
                description: YYYY-MM-DD
              value:
                type: number
        last_updated_at:
          type: integer
          format: int64
          description: Computed at. Epoch milliseconds.
      required:
        - object
        - id
        - days
        - environment
        - values
    CustomerSummary:
      type: object
      properties:
        object:
          type: string
          const: customer_summary
        id:
          type: string
          description: The id you asked for.
        original_app_user_id:
          type: string
        aliases:
          type: array
          items:
            type: string
        total_revenue_in_usd:
          type: number
        sandbox_revenue_in_usd:
          type: number
        country:
          type:
            - string
            - "null"
        platform:
          type:
            - string
            - "null"
        stores:
          type: array
          items:
            type: string
        offering_override:
          type:
            - string
            - "null"
        active_entitlements:
          type: array
          items:
            type: object
        granted_entitlements:
          type: array
          items:
            type: object
        subscriptions:
          type: array
          items:
            type: object
        purchases:
          type: array
          items:
            type: object
      required:
        - object
        - id
        - original_app_user_id
    ImportResult:
      type: object
      properties:
        object:
          type: string
          const: import_result
        emit_events:
          type: boolean
        customers:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              status:
                type: string
                enum:
                  - created
                  - updated
                  - merged
              subscriptions:
                type: integer
              purchases:
                type: integer
              needs_token_refresh:
                type: integer
              notes:
                type: array
                items:
                  type: string
      required:
        - object
        - emit_events
        - customers
    ImportStatus:
      type: object
      properties:
        object:
          type: string
          const: import_status
        customers:
          type: integer
        subscriptions:
          type: integer
        needs_token_refresh:
          type: integer
          description: Google Play subscriptions still waiting for their purchase token.
        needs_token_refresh_by_app:
          type: object
          additionalProperties:
            type: integer
      required:
        - object
        - customers
        - subscriptions
        - needs_token_refresh
        - needs_token_refresh_by_app
  parameters:
    ProjectId:
      name: project_id
      in: path
      required: true
      schema:
        type: string
      description: Project id (proj...).
      example: proj18pzzkao
    AppId:
      name: app_id
      in: path
      required: true
      schema:
        type: string
      description: App id (app...).
    AppUserId:
      name: app_user_id
      in: path
      required: true
      schema:
        type: string
        maxLength: 100
      description: App user id, URL-encoded (anonymous ids look like `$RCAnonymousID:...`).
      example: user_1
    CustomerId:
      name: customer_id
      in: path
      required: true
      schema:
        type: string
      description: Any app user id of the customer.
      example: user_1
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      description: Page size. Values outside 1-100 are clamped, not rejected.
    StartingAfter:
      name: starting_after
      in: query
      schema:
        type: string
      description: Id of the last item of the previous page. Use `next_page` instead of building it.
    Environment:
      name: environment
      in: query
      schema:
        type: string
        enum:
          - production
          - sandbox
      description: "Only this environment. Default: both."
    XPlatform:
      name: X-Platform
      in: header
      schema:
        type: string
      description: SDK platform (ios, android, macos, web ...). With a secret key it picks the project's app for that platform.
    XNonce:
      name: X-Nonce
      in: header
      schema:
        type: string
      description: Base64 nonce the SDK sends when entitlement verification is on; it is part of the signed message.
  responses:
    V2Error400:
      description: The request is invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/V2Error"
          example:
            object: error
            type: parameter_error
            message: "app_id: Required"
            param: app_id
            doc_url: https://revenuedot.app/docs/api/errors#parameter-error
            retryable: false
    V2Error401:
      description: No API key, or an unknown one.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/V2Error"
          example:
            object: error
            type: authentication_error
            message: "Missing API key. Send Authorization: Bearer <secret key>."
            doc_url: https://revenuedot.app/docs/api/errors#authentication-error
            retryable: false
    V2Error403:
      description: The key lacks a permission, or a public key was used.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/V2Error"
          example:
            object: error
            type: authorization_error
            message: API v2 requires a secret API key (sk_...). Public app keys only work with the SDK endpoints.
            doc_url: https://revenuedot.app/docs/api/errors#authorization-error
            retryable: false
    V2Error404:
      description: Not found in this project (another project's ids also answer 404).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/V2Error"
          example:
            object: error
            type: resource_missing
            message: Customer not found.
            doc_url: https://revenuedot.app/docs/api/errors#resource-missing
            retryable: false
    V2Error409:
      description: It already exists, or it conflicts with another object.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/V2Error"
          example:
            object: error
            type: resource_already_exists
            message: An entitlement with lookup_key pro already exists.
            doc_url: https://revenuedot.app/docs/api/errors#resource-already-exists
            retryable: false
    V2Error422:
      description: The request is valid but cannot be done in this state or for this store.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/V2Error"
          example:
            object: error
            type: unprocessable_entity_error
            message: The current offering cannot be archived. Make another offering current first.
            doc_url: https://revenuedot.app/docs/api/errors#unprocessable-entity-error
            retryable: false
    V2Error503:
      description: The store could not be reached. Retry later.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/V2Error"
          example:
            object: error
            type: store_error
            message: Google Play could not be reached.
            doc_url: https://revenuedot.app/docs/api/errors#store-error
            retryable: true
    V1Error400:
      description: Bad request. For receipts, a 4xx tells the SDK the purchase can never be accepted, so it finishes the transaction.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/V1Error"
          example:
            code: 7103
            message: The receipt is not a valid Test Store purchase token.
    V1Error401:
      description: Unknown API key.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/V1Error"
          example:
            code: 7225
            message: Invalid API Key.
    V1Error403:
      description: A public app key was used for a secret-key endpoint.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/V1Error"
          example:
            code: 7225
            message: This endpoint requires a secret API key.
    V1Error404:
      description: Not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/V1Error"
          example:
            code: 7259
            message: Subscriber not found.
    V1Error500:
      description: Server error. The SDK keeps the purchase and retries.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/V1Error"
          example:
            code: 7110
            message: Internal server error.
    V1Error503:
      description: The store could not be reached. Retry later.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/V1Error"
          example:
            code: 7101
            message: Google Play could not be reached.
  securitySchemes:
    publicApiKey:
      type: http
      scheme: bearer
      description: A public app key (`appl_`, `mac_`, `goog_`, `test_`, `amzn_`, `strp_`, `rcb_`, `pdl_`, `roku_`). Safe to ship in an app. The SDK sends it on every request.
    secretApiKey:
      type: http
      scheme: bearer
      description: A project secret key (`sk_...`). Server side only. Its `permissions` limit what it can do.
    dashboardSession:
      type: apiKey
      in: cookie
      name: rd_session
      description: The dashboard session cookie from `POST /auth/login`. It authorizes `/v2` for every project the user belongs to.
    googlePubSubOidc:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Google-signed OIDC token of a Pub/Sub push subscription. Checked only when the app's `pubsub_audience` credential is set.
security:
  - secretApiKey: []
externalDocs:
  description: RevenueDot documentation
  url: https://github.com/revenuedot/docs
