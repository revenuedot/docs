  /v2/projects/{project_id}/subscriptions/{subscription_id}/actions/extend:
    post:
      operationId: extendSubscription
      tags:
        - Subscriptions
      summary: Extend a subscription
      description: "App Store: Apple extends the renewal date (1 to 90 days, `extend_reason_code` required, needs the in-app purchase key). Google Play: the renewal is deferred (up to 365 days). Send `extend_by_days` or `extend_until_ms`, not both."
      security:
        - secretApiKey: []
        - dashboardSession: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: subscription_id
          in: path
          required: true
          schema:
            type: string
          description: Subscription id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  properties:
                    extend_by_days:
                      type: integer
                      minimum: 1
                    extend_reason_code:
                      type: string
                      enum:
                        - undeclared
                        - customer_satisfaction
                        - other
                        - service_issue_or_outage
                      description: Apple's reason for the extension. Required for App Store subscriptions.
                  required:
                    - extend_by_days
                  additionalProperties: false
                - type: object
                  properties:
                    extend_until_ms:
                      type: integer
                      description: New end, epoch milliseconds.
                    extend_reason_code:
                      type: string
                      enum:
                        - undeclared
                        - customer_satisfaction
                        - other
                        - service_issue_or_outage
                      description: Apple's reason for the extension. Required for App Store subscriptions.
                  required:
                    - extend_until_ms
                  additionalProperties: false
            example:
              extend_by_days: 7
              extend_reason_code: customer_satisfaction
      responses:
        "200":
          description: The subscription.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
        "400":
          $ref: "#/components/responses/V2Error400"
        "401":
