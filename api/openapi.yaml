    post:
      operationId: forgotPassword
      tags:
        - Dashboard auth
      summary: Email a password reset link
      description: |-
        Always answers 200 with the same body, whether or not an account uses the address, so the answer does not reveal who has an account. If one does, it gets a link to `/reset-password` that works once and expires after 1 hour.

        Limits: 5 requests per IP address per 15 minutes (then 429), and 3 emails per address per hour (further requests answer 200 but send nothing). See [I forgot my password](../docs/help/forgot-password.md).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 320
              required:
                - email
            example:
              email: dev@example.com
      responses:
        "200":
          description: Accepted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  message:
                    type: string
              example:
                ok: true
                message: If an account uses this email, we sent it a link to reset the password. The link expires in 1 hour.
        "400":
          description: Not a valid email address.
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  message:
                    type: string
        "429":
          description: Too many requests from this IP address.
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  message:
                    type: string
              example:
                type: rate_limit_error
                message: Too many password reset requests. Try again in 15 minutes.
      x-source: routes/auth.ts
      x-revenuedot-extension: true
