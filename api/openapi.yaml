  /auth/signup:
    post:
      operationId: signup
      tags:
        - Dashboard auth
      summary: Create a dashboard account
      description: |-
        Creates the user and a first project, and sets the `rd_session` cookie (30 days; `Secure` over https). On a self-hosted server only the first account (the owner) can sign up, unless the server runs with `REVENUEDOT_ALLOW_SIGNUP=true`.

        With `invite_token` (from an invite link), the account joins the inviting project instead of getting a new one, and sign-up works even where it is closed. The email must be the invited address; the account counts as verified. On RevenueDot Cloud, an account without an invite gets an email with a confirmation link (valid 24 hours).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                  maxLength: 200
                name:
                  type: string
                  maxLength: 100
                project_name:
                  type: string
                  description: "Default: My project. Ignored with `invite_token`."
                  maxLength: 100
                invite_token:
                  type: string
                  description: RevenueDot extension. The token from an invite link (`/invite?token=...`).
                  maxLength: 200
              required:
                - email
                - password
            example:
              email: dev@example.com
              password: change-me-please
              project_name: My app
      responses:
        "201":
          description: Signed up and signed in. With an invite, `project_id` is the project joined.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  project_id:
                    type: string
                    description: Only with `invite_token`.
              example:
                ok: true
        "400":
          description: Invalid email or password, or an invite that is not valid (`invite_invalid`) or for another address (`invite_email_mismatch`).
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  message:
                    type: string
        "403":
          description: "Sign-up is closed: the server has an owner already."
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  message:
                    type: string
              example:
                type: signup_closed
                message: "Sign-up is closed on this server: it has an owner account already. The owner can open it by setting REVENUEDOT_ALLOW_SIGNUP=true."
        "409":
          description: The email is taken.
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  message:
                    type: string
      x-source: routes/auth.ts
      x-revenuedot-extension: true
