      responses:
        "200":
          description: Handled.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - processed
                      - confirmed
                      - unknown_purchase
                      - ignored
                      - duplicate
                      - invalid_receipt
