webhooks:
  INITIAL_PURCHASE:
    post:
      operationId: webhookInitialPurchase
      tags:
        - Webhook events
      summary: INITIAL_PURCHASE
      description: The first purchase of a subscription, including a free trial start.
      parameters:
        - name: X-RevenueCat-Webhook-Signature
          in: header
          required: true
          schema:
            type: string
          description: "`t=<unix seconds>,v1=<hex HMAC-SHA256 of \"<t>.<raw body>\" with the webhook's signing secret>`. Signed again on every attempt."
          example: t=1790800914,v1=0a1552334e825926036f7efe21527800ea45caa63eca523c6120c6da9041ef99
        - name: Authorization
          in: header
          required: false
          schema:
            type: string
          description: The webhook's `authorization_header`, verbatim, when you set one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - api_version
                - event
              properties:
                api_version:
                  type: string
                  const: "1.0"
                event:
                  type: object
                  properties:
                    id:
                      type: string
                      description: Unique event id (upper-case UUID). Deduplicate on it.
                    type:
                      type: string
                      description: Event type.
                    event_timestamp_ms:
                      type: integer
                      description: When RevenueDot recorded the event. Epoch milliseconds.
                    app_id:
                      type: string
                      description: RevenueDot app id. Left out for promotional grants.
                    app_user_id:
                      type: string
                      description: The app user id the event is about (a non-anonymous alias when there is one).
                    original_app_user_id:
                      type: string
                      description: The customer's first app user id.
                    aliases:
                      type: array
                      items:
                        type: string
                      description: Every app user id of the customer.
                    product_id:
                      type: string
                      description: Store product id. For PRODUCT_CHANGE, the product the customer changed from.
                    period_type:
                      type: string
                      enum:
                        - NORMAL
                        - TRIAL
                        - INTRO
                        - PROMOTIONAL
                        - PREPAID
                    purchased_at_ms:
                      type: integer
                      description: Start of the period. Epoch milliseconds.
                    expiration_at_ms:
                      type:
                        - integer
                        - "null"
                      description: End of the period, or null for lifetime. Epoch milliseconds.
                    environment:
                      type: string
                      enum:
                        - PRODUCTION
                        - SANDBOX
                    entitlement_id:
                      type: "null"
                      description: Always null (deprecated in RevenueCat's payload).
                    entitlement_ids:
                      type:
                        - array
                        - "null"
                      items:
                        type: string
                      description: Lookup keys of the entitlements the product unlocks, or null.
                    presented_offering_id:
                      type:
                        - string
                        - "null"
                      description: Offering the purchase was made from, when the SDK sent it.
                    transaction_id:
                      type:
                        - string
                        - "null"
                      description: Store transaction id of this period.
                    original_transaction_id:
                      type:
                        - string
                        - "null"
                      description: First transaction id of the subscription.
                    is_family_share:
                      type: boolean
                    country_code:
                      type:
                        - string
                        - "null"
                      description: ISO 3166-1 alpha-2.
                    currency:
                      type:
                        - string
                        - "null"
                      description: ISO 4217.
                    price:
                      type:
                        - number
                        - "null"
                      description: USD. Money moved only on INITIAL_PURCHASE, RENEWAL, NON_RENEWING_PURCHASE, REFUND_REVERSED and refunds (negative); 0 on other events.
                    price_in_purchased_currency:
                      type:
                        - number
                        - "null"
                      description: Same as price, in `currency`.
                    subscriber_attributes:
                      type: object
                      additionalProperties:
                        type: object
                        properties:
                          value:
                            type:
                              - string
                              - "null"
                          updated_at_ms:
                            type: integer
                    store:
                      type: string
                      enum:
                        - APP_STORE
                        - MAC_APP_STORE
                        - PLAY_STORE
                        - AMAZON
                        - STRIPE
                        - RC_BILLING
                        - PROMOTIONAL
                        - TEST_STORE
                        - PADDLE
                        - ROKU
                        - EXTERNAL
                    takehome_percentage:
                      type: number
                      description: 1 minus the estimated store commission.
                    tax_percentage:
                      type: number
                      description: Always 0 today.
                    commission_percentage:
                      type: number
                      description: Estimated store commission (0.3 for App Store and Google Play, 0 for Test Store).
                    offer_code:
                      type: "null"
                  required:
                    - id
                    - type
                    - event_timestamp_ms
                    - app_user_id
                    - original_app_user_id
                    - aliases
                    - product_id
                    - period_type
                    - purchased_at_ms
                    - environment
                    - store
            example:
              api_version: "1.0"
              event:
                id: 66339910-3BFF-49F4-B873-D1283D673DE2
                type: INITIAL_PURCHASE
                event_timestamp_ms: 1790800914034
                app_id: appvnrm0a5h
                app_user_id: user_1
                original_app_user_id: user_1
                aliases:
                  - user_1
                product_id: pro_monthly
                period_type: NORMAL
                purchased_at_ms: 1790800914000
                expiration_at_ms: 1793392914000
                environment: SANDBOX
                entitlement_id: null
                entitlement_ids:
                  - pro
                presented_offering_id: default
                transaction_id: test_1790800914000_quickstart
                original_transaction_id: test_1790800914000_quickstart
                is_family_share: false
                country_code: null
                currency: USD
                price: 9.99
                price_in_purchased_currency: 9.99
                subscriber_attributes: {}
                store: TEST_STORE
                takehome_percentage: 1
                tax_percentage: 0
                commission_percentage: 0
                offer_code: null
      responses:
        "200":
          description: Only HTTP 200 counts as delivered. Anything else, or no answer within 60 seconds, is retried after 5, 10, 20, 40 and 80 minutes.
      x-source: services/events.ts
  RENEWAL:
    post:
      operationId: webhookRenewal
      tags:
        - Webhook events
      summary: RENEWAL
      description: "A new paid period: a renewal, a trial converting (`is_trial_conversion: true`), a lapsed customer resubscribing, or a recovered billing issue."
      parameters:
        - name: X-RevenueCat-Webhook-Signature
          in: header
          required: true
