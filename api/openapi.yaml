  /v1/notifications/google/{app_id}:
    post:
      operationId: googleNotification
      tags:
        - Store notifications
      summary: Google Play real-time developer notifications (Pub/Sub push)
      description: |-
        Set this URL as the endpoint of a Pub/Sub **push** subscription on the topic Google Play publishes to.
        When the app's `pubsub_audience` credential is set, the push must carry a Google-signed OIDC token for that audience (and for `pubsub_service_account` when set).
        Each message is stored once (by message id), forwarded when `notification_forward_url` is set, and applied by reading the purchase from the Play Developer API.

        - **200:** handled, a duplicate, ignored (another package, not a developer notification) or an invalid token that can never succeed.
        - **400:** not a Pub/Sub push body. **401:** bad push token. **404:** no Google Play app with this id.
        - **500 or 503:** a temporary failure; Pub/Sub redelivers.
      security:
        - {}
        - googlePubSubOidc: []
      parameters:
        - $ref: "#/components/parameters/AppId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: object
                  properties:
                    data:
                      type: string
                      description: Base64 JSON developer notification.
                    messageId:
                      type: string
                    publishTime:
                      type: string
                subscription:
                  type: string
              required:
                - message
      responses:
        "200":
          description: Handled.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - processed
                      - ignored
                      - duplicate
                      - invalid_token
              example:
                status: processed
        "400":
          description: Not a push body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V1Error"
        "401":
          description: Bad push token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V1Error"
              example:
                code: 7224
                message: The Pub/Sub push token is missing or invalid.
        "404":
          description: Unknown app.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V1Error"
        "500":
          description: Temporary failure; Pub/Sub retries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V1Error"
        "503":
          description: Google's signing keys could not be loaded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V1Error"
      x-source: stores/google/notifications.ts
