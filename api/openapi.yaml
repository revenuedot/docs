              schema:
                type: object
                properties:
                  algorithm:
                    type: string
                    const: Ed25519
                  public_key:
                    type: string
                    description: Base64 of the raw 32-byte public key.
                  encoding:
                    type: string
                    const: base64
                  header:
                    type: string
                    const: X-Signature
                  docs:
                    type: string
              example:
                algorithm: Ed25519
