        checksum (24 bytes, the first 24 bytes of SHA-256 of the payload), size (u32, little-endian), encoding (0, none) and 3 reserved bytes, then the payload padded to 8 bytes.
        Element 0 is the configuration JSON with the topics `sources`, `ui_config` (app, localizations, variable_config, custom_variables) and `workflows` (one per
        published paywall, keyed by workflow id, with `offering_identifier`). The other elements are the blobs those topics reference, inline. 204 when the `manifest` the SDK sent is current.
      security:
        - publicApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                manifest:
                  type: string
                  description: The manifest of the configuration the SDK holds.
                prefetched_blobs:
                  type: array
                  items:
                    type: string
                  description: Blob refs the SDK already holds; they are not inlined again.
              description: The SDK also sends `fetch_context` and `app_user_id`, which the server does not use.
            example:
              manifest: v1.Qm9vdHN0cmFw
              prefetched_blobs: []
      responses:
        "200":
          description: RC Container.
          content:
            application/x-rc-format:
              schema:
                type: string
                format: binary
        "204":
          description: The SDK's configuration is current.
