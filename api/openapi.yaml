components:
  schemas:
    V1Error:
      type: object
      properties:
        code:
          type: integer
          description: RevenueCat-compatible backend error code. See the error table.
        message:
          type: string
          description: What went wrong.
        attribute_errors:
          type: array
          items:
            type: object
            properties:
              key_name:
                type: string
              message:
                type: string
          description: Only for 7263.
      required:
        - code
        - message
      x-error-codes:
        - code: 7000
          name: BAD_REQUEST / INVALID_PLATFORM
          status: "400"
          meaning: The request is malformed, a secret-key receipt post has no X-Platform app, or the store action does not exist for this store.
        - code: 7101
          name: STORE_PROBLEM
          status: 400 or 503
          meaning: The store refused the request (400), or the store or its credentials could not be used right now (503, retry later).
        - code: 7102
          name: RECEIPT_ALREADY_IN_USE
          status: "400"
          meaning: The purchase belongs to another customer and the project's transfer behaviour is keep or transfer_if_no_active.
        - code: 7103
          name: INVALID_RECEIPT
          status: "400"
          meaning: The receipt, signed transaction or purchase token is not valid, or it belongs to another bundle id or package name.
        - code: 7110
          name: INTERNAL
          status: "500"
          meaning: An unexpected server error. The SDK keeps the transaction and retries.
        - code: 7220
          name: INVALID_APP_USER_ID
          status: "400"
          meaning: The app user id is empty or longer than 100 characters.
        - code: 7224
          name: INVALID_AUTH_TOKEN
          status: "401"
          meaning: A Google Pub/Sub push token is missing or invalid (store notifications only).
        - code: 7225
          name: INVALID_API_KEY
          status: 401 or 403
          meaning: The API key is unknown (401), or a REST v1 endpoint was called with a public key (403).
        - code: 7226
          name: BAD_REQUEST_PARAMS
          status: "400"
          meaning: A store action got parameters it cannot use.
        - code: 7234
          name: INVALID_APPLE_SUBSCRIPTION_KEY
          status: "500"
          meaning: A StoreKit 1 receipt arrived for an App Store app without an in-app purchase key, or the key is incomplete. Sent as 500 so the SDK retries once you add the key.
        - code: 7259
          name: NOT_FOUND
          status: "404"
          meaning: The customer, entitlement, offering or subscription does not exist.
        - code: 7263
          name: INVALID_SUBSCRIBER_ATTRIBUTES
          status: "400"
          meaning: Some attributes were not saved; `attribute_errors` lists them.
        - code: 7662
          name: UNSUPPORTED_RECEIPT
          status: "400"
          meaning: Receipts for this app's store are not supported yet (Amazon, Stripe, Web Billing, Paddle, Roku).
