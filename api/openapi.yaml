  /v1/offers:
    post:
      operationId: postOfferForSigning
      tags:
        - SDK support
      summary: Sign a promotional offer (iOS)
      description: |-
        What `Purchases.promotionalOffer(forProductDiscount:product:)` calls. RevenueDot signs each offer with the App Store app's In-App Purchase key (`key_id`, `issuer_id` and `private_key` in the app's credentials) the way Apple verifies it: ECDSA P-256 with SHA-256 over the bundle id, key id, product id, offer id, app account token, nonce and timestamp, DER-encoded and base64 ([Apple's format](https://developer.apple.com/documentation/storekit/generating-a-signature-for-promotional-offers)).
        The app account token matches what the SDK puts on the payment: with StoreKit 2 the lowercase app user id when it is a UUID and empty otherwise; with StoreKit 1 the app user id.
        Without an In-App Purchase key the answer is 400 with code 7234, which the SDK reports as `invalidAppleSubscriptionKeyError` for that offer only.
      security:
        - publicApiKey: []
        - secretApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                app_user_id:
                  type: string
                fetch_token:
                  type: string
                  description: The receipt or signed transaction; not needed for signing.
                generate_offers:
                  type: array
                  items:
                    type: object
                    properties:
                      offer_id:
                        type: string
                        description: Promotional offer id from App Store Connect.
                      product_id:
                        type: string
                    required:
                      - offer_id
                      - product_id
              required:
                - app_user_id
                - generate_offers
            example:
              app_user_id: user_1
              fetch_token: …
              generate_offers:
                - offer_id: winback_50
                  product_id: pro_monthly
      responses:
        "200":
          description: One signature per offer.
          content:
            application/json:
              schema:
                type: object
                properties:
                  offers:
                    type: array
                    items:
                      type: object
                      properties:
                        key_id:
                          type: string
                        offer_id:
                          type: string
                        product_id:
                          type: string
                        signature_data:
                          type: object
                          properties:
                            nonce:
                              type: string
                              description: Lowercase UUID.
                            signature:
                              type: string
                              description: Base64 DER ECDSA signature.
                            timestamp:
                              type: integer
                              description: Epoch milliseconds.
              example:
                offers:
                  - key_id: 2X9R4HXF34
                    offer_id: winback_50
                    product_id: pro_monthly
                    signature_data:
                      nonce: 0f3c2a8e-5d7b-4d7e-9a53-3b8f2c1e6d40
                      signature: MEUCIQDD…
                      timestamp: 1790800914034
        "400":
          description: No In-App Purchase key, or no offers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V1Error"
              example:
                code: 7234
                message: Promotional offers need the app's App Store In-App Purchase key. Add it in the app's settings.
        "401":
          $ref: "#/components/responses/V1Error401"
      x-source: routes/sdk.ts
