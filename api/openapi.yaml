  /v2/projects/{project_id}/test_purchases:
    post:
      operationId: createTestPurchase
      tags:
        - Test Store
      summary: Simulate a Test Store purchase or lifecycle
      description: |-
        Runs a purchase through the same pipeline as an SDK receipt, so events, the transaction ledger and webhooks come out as they would. Scenarios:
        `purchase`, `trial`, `trial_conversion`, `renewal`, `cancel`, `billing_issue`, `refund`, `expire`. See [the Test Store guide](../docs/guides/test-store.md).
      security:
        - secretApiKey: []
        - dashboardSession: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                app_user_id:
                  type: string
                  maxLength: 100
                product_id:
                  type: string
                  description: Product id or store identifier of a Test Store product.
                app_id:
                  type: string
                  description: Test Store app; default the project's first.
                price:
                  type: number
                  minimum: 0
                currency:
                  type: string
                  description: Three letters; default USD.
