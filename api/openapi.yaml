  parameters:
    ProjectId:
      name: project_id
      in: path
      required: true
      schema:
        type: string
      description: Project id (proj...).
      example: proj18pzzkao
    AppId:
      name: app_id
      in: path
      required: true
      schema:
        type: string
      description: App id (app...).
    AppUserId:
      name: app_user_id
      in: path
      required: true
      schema:
        type: string
        maxLength: 100
      description: App user id, URL-encoded (anonymous ids look like `$RCAnonymousID:...`).
      example: user_1
    CustomerId:
      name: customer_id
      in: path
      required: true
      schema:
        type: string
      description: Any app user id of the customer.
      example: user_1
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      description: Page size. Values outside 1-100 are clamped, not rejected.
    StartingAfter:
      name: starting_after
      in: query
      schema:
        type: string
      description: Id of the last item of the previous page. Use `next_page` instead of building it.
    Environment:
      name: environment
      in: query
      schema:
        type: string
        enum:
          - production
          - sandbox
      description: "Only this environment. Default: both."
    XPlatform:
      name: X-Platform
      in: header
      schema:
        type: string
      description: SDK platform (ios, android, macos, web ...). With a secret key it picks the project's app for that platform.
    XNonce:
      name: X-Nonce
      in: header
      schema:
        type: string
      description: Base64 nonce the SDK sends when entitlement verification is on; it is part of the signed message.
  responses:
    V2Error400:
      description: The request is invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/V2Error"
          example:
            object: error
            type: parameter_error
            message: "app_id: Required"
            param: app_id
            doc_url: https://revenuedot.app/docs/api/errors#parameter-error
            retryable: false
    V2Error401:
      description: No API key, or an unknown one.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/V2Error"
          example:
            object: error
            type: authentication_error
            message: "Missing API key. Send Authorization: Bearer <secret key>."
            doc_url: https://revenuedot.app/docs/api/errors#authentication-error
            retryable: false
    V2Error403:
      description: The key lacks a permission, or a public key was used.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/V2Error"
          example:
            object: error
            type: authorization_error
            message: API v2 requires a secret API key (sk_...). Public app keys only work with the SDK endpoints.
            doc_url: https://revenuedot.app/docs/api/errors#authorization-error
            retryable: false
    V2Error404:
      description: Not found in this project (another project's ids also answer 404).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/V2Error"
          example:
            object: error
            type: resource_missing
            message: Customer not found.
            doc_url: https://revenuedot.app/docs/api/errors#resource-missing
            retryable: false
    V2Error409:
      description: It already exists, or it conflicts with another object.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/V2Error"
          example:
            object: error
            type: resource_already_exists
            message: An entitlement with lookup_key pro already exists.
            doc_url: https://revenuedot.app/docs/api/errors#resource-already-exists
            retryable: false
    V2Error422:
      description: The request is valid but cannot be done in this state or for this store.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/V2Error"
          example:
            object: error
            type: unprocessable_entity_error
            message: The current offering cannot be archived. Make another offering current first.
            doc_url: https://revenuedot.app/docs/api/errors#unprocessable-entity-error
            retryable: false
    V2Error429:
      description: Too many requests. Retry later.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/V2Error"
          example:
            object: error
            type: rate_limit_error
            message: This project sent too many invites today. Try again tomorrow.
            doc_url: https://revenuedot.app/docs/api/errors#rate-limit-error
            retryable: true
    V2Error503:
      description: The store could not be reached. Retry later.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/V2Error"
          example:
            object: error
            type: store_error
            message: Google Play could not be reached.
            doc_url: https://revenuedot.app/docs/api/errors#store-error
            retryable: true
    V1Error400:
      description: Bad request. For receipts, a 4xx tells the SDK the purchase can never be accepted, so it finishes the transaction.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/V1Error"
          example:
            code: 7103
            message: The receipt is not a valid Test Store purchase token.
    V1Error401:
      description: Unknown API key.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/V1Error"
          example:
            code: 7225
            message: Invalid API Key.
    V1Error403:
      description: A public app key was used for a secret-key endpoint.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/V1Error"
          example:
            code: 7225
            message: This endpoint requires a secret API key.
    V1Error404:
      description: Not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/V1Error"
          example:
            code: 7259
            message: Subscriber not found.
    V1Error500:
      description: Server error. The SDK keeps the purchase and retries.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/V1Error"
          example:
            code: 7110
            message: Internal server error.
    V1Error503:
      description: The store could not be reached. Retry later.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/V1Error"
          example:
            code: 7101
            message: Google Play could not be reached.
  securitySchemes:
    publicApiKey:
      type: http
      scheme: bearer
      description: A public app key (`appl_`, `mac_`, `goog_`, `test_`, `amzn_`, `strp_`, `rcb_`, `pdl_`, `roku_`). Safe to ship in an app. The SDK sends it on every request.
    secretApiKey:
      type: http
      scheme: bearer
      description: A project secret key (`sk_...`). Server side only. Its `permissions` limit what it can do.
    dashboardSession:
      type: apiKey
      in: cookie
      name: rd_session
      description: The dashboard session cookie from `POST /auth/login`. It authorizes `/v2` for every project the user belongs to.
    googlePubSubOidc:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Google-signed OIDC token of a Pub/Sub push subscription. Checked only when the app's `pubsub_audience` credential is set.
security:
  - secretApiKey: []
externalDocs:
  description: RevenueDot documentation
  url: https://github.com/revenuedot/docs
