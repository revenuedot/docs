              properties:
                aad_attribution_token:
                  type: string
                  description: The token from AAAttribution.attributionToken().
              required:
                - aad_attribution_token
            example:
              aad_attribution_token: wD3Ma…
      responses:
        "200":
          description: Accepted; the lookup runs after the answer.
          content:
            application/json:
              schema:
                type: object
              example: {}
        "400":
          description: No token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V1Error"
              example:
                code: 7226
                message: aad_attribution_token is required.
        "401":
