# Redocly lint rules for api/openapi.yaml (npm run lint:openapi).
extends:
  - recommended
rules:
  # Webhook events and a few SDK endpoints have no error responses by design.
  operation-4xx-response: off
  # localhost is the documented local server.
  no-server-example.com: off
  # Public endpoints (health, store notifications, signing key) have no security on purpose.
  security-defined: off
  # GET /v1/customercenter/{app_user_id} answers 404 by design (Customer Center is not built).
  operation-2xx-response: off
